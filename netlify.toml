[build]
  publish = "."
  # Regenera as paginas de categoria (eletricistas.html, canalizadores.html,
  # etc.) a partir de templates/categoria.template.html + scripts/categories-data.json
  # antes de cada deploy. So mexas nesses dois ficheiros para mudar conteudo
  # de categorias — nao edites as paginas .html diretamente, sao geradas e
  # o proximo deploy sobrescreve-as. Ver scripts/build-categories.js.
  command = "node scripts/build-categories.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Resumo diario por notificacao push (todas as manhas, so quando ha algo
# que precise mesmo de atencao).
[functions."daily-digest"]
  schedule = "0 7 * * *"

# Aviso de chuva para trabalhos ao ar livre marcados para daqui a 2 dias.
[functions."weather-alert"]
  schedule = "0 6 * * *"

# Sitemap dinamico dos perfis de profissionais (netlify/functions/sitemap-profiles.js).
# Gerado a pedido a partir da base de dados, porque perfis sao criados/
# atualizados todos os dias — um sitemap estatico ficaria desatualizado.
# Tem de vir ANTES do redirect /:slug abaixo, senao seria interpretado
# como o link proprio de um profissional chamado "sitemap-profiles".
[[redirects]]
  from = "/sitemap-profiles.xml"
  to = "/.netlify/functions/sitemap-profiles"
  status = 200

# O Blog foi renomeado para Academia (set/2026). Mantem vivos os links e
# favoritos antigos em vez de dar 404.
[[redirects]]
  from = "/blog"
  to = "/academia"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/academia.html"
  status = 301

# Link proprio dos profissionais Pro: flinko.pt/o-nome-dele
# Esta regra e a ULTIMA de proposito. O Netlify serve sempre os ficheiros
# reais primeiro, por isso /pricing, /eletricistas e companhia continuam a
# funcionar; so os caminhos que nao correspondem a nada e que chegam aqui.
# Os nomes das paginas existentes estao na tabela reserved_slugs, para que
# ninguem consiga registar um slug que colida com elas.
[[redirects]]
  from = "/:slug"
  to = "/profile.html?u=:slug"
  status = 200
  force = false

# Cabecalhos de seguranca para todas as paginas.
# A CSP esta em modo "Report-Only": o browser NAO bloqueia nada, so regista no
# consola (F12) o que bloquearia. Navega o site com a consola aberta; se nao
# aparecer nenhum aviso legitimo, troca o nome do cabecalho para
# Content-Security-Policy para passar a bloquear a serio. Mantem
# 'unsafe-inline' porque as paginas usam <script> e onclick= inline — o
# objetivo a medio prazo e removê-los e tirar o 'unsafe-inline'.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# Cache de assets estaticos no browser do visitante. Os nomes dos ficheiros
# NAO tem hash de versao, por isso os tempos sao propositadamente moderados
# (nao "immutable" nem 1 ano) — se editarmos um destes ficheiros, os
# visitantes com cache ainda quente veem a versao antiga ate o cache expirar.
# JS/CSS: 1 hora (mudam com alguma frequencia durante o desenvolvimento).
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Imagens e icones: 1 semana (mudam raramente).
[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
