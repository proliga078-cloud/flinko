[build]
  publish = "."
  # Aplica o cabecalho unico (scripts/site-header.js) e regenera as paginas de categoria (eletricistas.html, canalizadores.html,
  # etc.) a partir de templates/categoria.template.html + scripts/categories-data.json
  # antes de cada deploy. So mexas nesses dois ficheiros para mudar conteudo
  # de categorias — nao edites as paginas .html diretamente, sao geradas e
  # o proximo deploy sobrescreve-as. Ver scripts/build-categories.js.
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Resumo diario por notificacao push (todas as manhas, so quando ha algo
# que precise mesmo de atencao).
[functions."daily-digest"]
  schedule = "0 7 * * *"

# Aviso de chuva para trabalhos ao ar livre marcados para daqui a 2 dias.
[functions."weather-alert"]
  schedule = "0 6 * * *"

# Lembretes a profissionais com o perfil por completar (dia 1, 3 e 7),
# ver netlify/functions/profile-reminders.js. 9h UTC = 10h em Portugal (verao).
[functions."profile-reminders"]
  schedule = "0 9 * * *"

# Lembrete ao profissional de mensagens de clientes por responder (2h a 24h),
# ver netlify/functions/reply-reminders.js. De hora a hora; nao envia de noite.
[functions."reply-reminders"]
  schedule = "15 * * * *"

# A pagina de perfil servida com o essencial ja no HTML (ver
# netlify/functions/profile-page.js) le o profile.html do proprio deploy.
[functions."profile-page"]
  included_files = ["profile.html"]

# Sitemap dinamico dos perfis de profissionais (netlify/functions/sitemap-profiles.js).
# Gerado a pedido a partir da base de dados, porque perfis sao criados/
# atualizados todos os dias — um sitemap estatico ficaria desatualizado.
# Tem de vir ANTES do redirect /:slug abaixo, senao seria interpretado
# como o link proprio de um profissional chamado "sitemap-profiles".
[[redirects]]
  from = "/sitemap-profiles.xml"
  to = "/.netlify/functions/sitemap-profiles"
  status = 200

# Perfis abertos por id (a maioria: o link proprio /o-nome-dele e so do
# Pro). Passam pela mesma funcao que os perfis com link proprio, para o
# titulo, a descricao, a imagem de partilha e os dados estruturados virem ja
# no HTML. force=true porque profile.html existe como ficheiro.
[[redirects]]
  from = "/profile.html"
  query = {id = ":id"}
  to = "/.netlify/functions/profile-page?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/profile"
  query = {id = ":id"}
  to = "/.netlify/functions/profile-page?id=:id"
  status = 200
  force = true

# Pagina antiga para profissionais (fase de lancamento) — substituida por
# /profissionais. Redirect permanente para nao perder links nem o Google.
[[redirects]]
  from = "/torna-te-profissional"
  to = "/profissionais"
  status = 301
  force = true

[[redirects]]
  from = "/torna-te-profissional.html"
  to = "/profissionais"
  status = 301
  force = true

# Sitemap das paginas locais (categoria x cidade), gerado a pedido — ver
# netlify/functions/sitemap-local.js. So lista combinacoes com profissionais.
[[redirects]]
  from = "/sitemap-local.xml"
  to = "/.netlify/functions/sitemap-local"
  status = 200

# Paginas locais para SEO: /eletricistas/braga, /pintores/porto, ...
# (netlify/functions/local-page.js). Duas partes no caminho, por isso nao
# colidem com os links dos profissionais (/o-nome-dele, uma so parte) e o
# Netlify serve sempre primeiro os ficheiros reais (ex: /assets/x.js).
# Tem de vir ANTES do redirect /:slug mais abaixo.
[[redirects]]
  from = "/:cat/:city"
  to = "/.netlify/functions/local-page/:cat/:city"
  status = 200
  force = false

# Out/2026: o painel de gestao novo (gestao.html) e o unico painel. Os
# enderecos dos paineis anteriores (admin, admin-antigo, admin-classico)
# abrem-no, para nao partir favoritos.
[[redirects]]
  from = "/admin.html"
  to = "/gestao"
  status = 301
  force = true

[[redirects]]
  from = "/admin"
  to = "/gestao"
  status = 301
  force = true

[[redirects]]
  from = "/admin-antigo.html"
  to = "/gestao"
  status = 301
  force = true

[[redirects]]
  from = "/admin-antigo"
  to = "/gestao"
  status = 301
  force = true

[[redirects]]
  from = "/admin-classico.html"
  to = "/gestao"
  status = 301
  force = true

[[redirects]]
  from = "/admin-classico"
  to = "/gestao"
  status = 301
  force = true

# O Blog foi renomeado para Academia (set/2026). Mantem vivos os links e
# favoritos antigos em vez de dar 404.
[[redirects]]
  from = "/blog"
  to = "/academia"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/academia.html"
  status = 301

# Link proprio dos profissionais Pro: flinko.pt/o-nome-dele (servido pela
# funcao profile-page, que devolve 404 a caminhos que nao sao de ninguem).
# Esta regra e a ULTIMA de proposito. O Netlify serve sempre os ficheiros
# reais primeiro, por isso /pricing, /eletricistas e companhia continuam a
# funcionar; so os caminhos que nao correspondem a nada e que chegam aqui.
# Os nomes das paginas existentes estao na tabela reserved_slugs, para que
# ninguem consiga registar um slug que colida com elas.
[[redirects]]
  from = "/:slug"
  to = "/.netlify/functions/profile-page/:slug"
  status = 200
  force = false

# Cabecalhos de seguranca para todas as paginas.
# A CSP esta ATIVA (desde set/2026): o browser recusa scripts, estilos,
# ligacoes e iframes de origens que nao estejam nesta lista. Se juntares um
# servico novo (outra CDN, um mapa, um video...), acrescenta a origem aqui,
# senao deixa de funcionar. Atencao: o Simple Analytics nao esta no codigo,
# e injetado pelo Netlify (Snippet injection); por isso esta aqui a mao.
# Mantem 'unsafe-inline' porque as paginas usam
# <script> e onclick= inline; o objetivo a medio prazo e remove-los e tirar o
# 'unsafe-inline'.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://scripts.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com https://queue.simpleanalyticscdn.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# Cache de assets estaticos no browser do visitante. Os nomes dos ficheiros
# NAO tem hash de versao, por isso os tempos sao propositadamente moderados
# (nao "immutable" nem 1 ano) — se editarmos um destes ficheiros, os
# visitantes com cache ainda quente veem a versao antiga ate o cache expirar.
# JS/CSS: o browser confirma sempre com o servidor (304 barato se nao mudou).
# Com max-age=3600 uma pagina nova podia correr com JS antigo ate 1 hora
# depois de um deploy (o dashboard tem 13 ficheiros que dependem uns dos outros).
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Imagens e icones: 1 semana (mudam raramente).
[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
