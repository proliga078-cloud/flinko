name: Testes automáticos (checkout / auth)

# Corre os testes unitários das funções Netlify e os testes E2E de
# auth.html / pricing.html a cada push e pull request, para que uma
# regressão nas funções de pagamento ou no login/registo seja apanhada
# antes do deploy, não depois. Ver tests/README.md para correr localmente.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários (netlify/functions)
        run: npm run test:unit

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (auth.html / pricing.html)
        run: npm run test:e2e

      - name: Guardar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
