<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proliga – Entrar / Registar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; }
nav {
background: #fff; border-bottom: 1px solid #ECECE9;
padding: 0 24px; height: 64px;
display: flex; align-items: center;
}
.logo { font-size: 22px; font-weight: 800; color: #E8720A; text-decoration: none; }
.logo span { color: #AF620A; }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
.card {
background: #fff;
border-radius: 16px;
box-shadow: 0 4px 24px rgba(0,0,0,.08);
width: 100%; max-width: 460px;
overflow: hidden;
}
.tabs { display: flex; border-bottom: 2px solid #ECECE9; }
.tab {
flex: 1; padding: 18px; text-align: center;
font-weight: 600; font-size: 15px;
cursor: pointer; color: #94a3b8;
border: none; background: none;
font-family: inherit; transition: all .2s;
}
.tab.active { color: #E8720A; border-bottom: 2px solid #E8720A; margin-bottom: -2px; }
.form-body { padding: 32px; }
.form-group { margin-bottom: 20px; }
label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
input, select {
width: 100%; padding: 12px 14px;
border: 1.5px solid #ECECE9;
border-radius: 8px;
font-size: 14px; font-family: inherit;
color: #1e293b; outline: none;
transition: border-color .2s;
}
input:focus, select:focus { border-color: #E8720A; }
.btn-submit {
width: 100%; padding: 14px;
background: #E8720A; color: #fff;
border: none; border-radius: 8px;
font-size: 15px; font-weight: 700;
cursor: pointer; font-family: inherit;
transition: background .2s; margin-top: 8px;
}
.btn-submit:hover { background: #1e40af; }
.btn-submit:disabled { background: #93c5fd; cursor: not-allowed; }
.msg { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; display: none; }
.msg.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; display: block; }
.msg.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
.msg.hidden { display: none; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.hint { font-size: 12px; color: #94a3b8; margin-top: 6px }
.card-title { font-size: 17px; font-weight: 800; margin-bottom: 6px }
.card-sub { font-size: 13px; color: #64748b; margin-bottom: 22px; line-height: 1.5 }

.pw-wrap{position:relative;display:block}
.pw-wrap input{width:100%;padding-right:44px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8;padding:6px;border-radius:7px;display:flex;align-items:center}
.pw-toggle:hover{color:#E8720A;background:#f1f5f9}
.pw-toggle.on{color:#E8720A}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* === tema navy+laranja: nav === */
nav{background:#0F1A33}
nav a.logo{color:#fff}
nav a.logo em,nav a.logo span{color:#F2A55C}
.navlinks{color:#9AA6C3}
.navlinks a:hover{color:#fff}
.hamburger-btn{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}
.mobile-nav-panel{background:#fff}
nav .btn-ghost{color:#fff}
nav .btn-ghost:hover{background:rgba(255,255,255,.1)}
nav .btn-line{color:#fff;border-color:rgba(255,255,255,.3)}
nav .btn-line:hover{border-color:rgba(255,255,255,.6)}
.btn-ink{background:#E8720A;color:#fff}
.btn-ink:hover{background:#C25A06}

.intent-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.intent-card{border:1.5px solid #ECECE9;border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .15s}
.intent-card:hover{border-color:#F2A55C}
.intent-card.on{border-color:#E8720A;background:#FDECDD}
.intent-card .ic{width:22px;height:22px;color:#E8720A;margin-bottom:6px;display:inline-block}
.intent-card .it{font-size:13px;font-weight:700;color:#1e293b}
.intent-card .is{font-size:11px;color:#64748b;margin-top:2px}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<link rel="shortcut icon" href="/favicon.ico"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#0F1A33"/>
<script src="/assets/pwa.js" defer></script>
</head>
<body>
<nav>
<a href="index.html" class="logo">Pro<span>liga</span></a>
</nav>
<main>
<div class="card">

<div id="back-link" style="display:none;padding:14px 32px 0">
<a href="#" onclick="history.back();return false" style="font-size:13px;color:#64748b;text-decoration:none;display:inline-flex;align-items:center;gap:5px">← Voltar</a>
</div>

<div id="tabs-wrap">
<div class="tabs">
<button class="tab active" onclick="showTab('login')" id="tab-login">Entrar</button>
<button class="tab" onclick="showTab('register')" id="tab-register">Registar</button>
</div>

<!-- LOGIN -->
<div id="form-login" class="form-body">
<div class="msg hidden" id="login-msg"></div>
<div class="form-group">
<label>Email</label>
<input type="email" id="login-email" placeholder="o-teu@email.com" autocomplete="email" />
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
</div>
<button class="btn-submit" id="login-btn" onclick="doLogin()">Entrar na conta</button>
<div style="text-align:center;margin-top:14px">
<a href="#" onclick="doResetPassword(event)" style="font-size:13px;color:#E8720A;text-decoration:none">Esqueci a palavra-passe</a>
</div>
</div>

<!-- REGISTER -->
<div id="form-register" class="form-body" style="display:none">
<div class="msg hidden" id="reg-msg"></div>
<div class="form-group">
<label>O que procuras?</label>
<div class="intent-grid">
<div class="intent-card" id="intent-client" onclick="selectAccountType('client')">
<svg class="ic" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
<div class="it">Contratar</div>
<div class="is">Procuro um profissional</div>
</div>
<div class="intent-card" id="intent-professional" onclick="selectAccountType('professional')">
<svg class="ic" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
<div class="it">Oferecer serviços</div>
<div class="is">Sou profissional</div>
</div>
</div>
</div>
<div class="form-group">
<label>Nome completo</label>
<input type="text" id="reg-name" placeholder="João Silva" autocomplete="name" />
</div>
<div class="form-group">
<label>Email</label>
<input type="email" id="reg-email" placeholder="o-teu@email.com" autocomplete="email" />
</div>
<div class="form-group">
<label>Password</label>
<div class="pw-wrap">
<input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
<button type="button" class="pw-toggle" id="reg-pw-toggle" onclick="togglePw('reg-password','reg-pw-toggle')" aria-label="Mostrar password">
<svg class="ic" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
<div class="hint">Toca no olho para veres o que escreveste.</div>
</div>
<button class="btn-submit" id="reg-btn" onclick="doRegister()">Criar conta</button>
</div>
</div>

<!-- RECOVERY: define nova password (aberto a partir do link de email) -->
<div id="form-recovery" class="form-body" style="display:none">
<div class="card-title">🔑 Define uma nova password</div>
<div class="card-sub">Vieste do link de recuperação enviado por email. Escolhe a tua nova password abaixo.</div>
<div class="msg hidden" id="recovery-msg"></div>
<div class="form-group">
<label>Nova password</label>
<input type="password" id="recovery-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
</div>
<div class="form-group">
<label>Confirmar nova password</label>
<input type="password" id="recovery-password2" placeholder="Repete a password" autocomplete="new-password" />
<div class="hint" id="recovery-match-hint"></div>
</div>
<button class="btn-submit" id="recovery-btn" onclick="doUpdatePassword()">Guardar nova password</button>
</div>

</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://cdwinidhtfxfxowflize.supabase.co'
const SUPABASE_KEY = 'sb_publishable_G1U9iSJLR2JkhD9gvfyY3Q_qaqnMaUk'
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

let inRecovery = false

// Detect password recovery flow (user clicked the reset link in their email)
db.auth.onAuthStateChange((event, session) => {
if (event === 'PASSWORD_RECOVERY') {
inRecovery = true
document.getElementById('tabs-wrap').style.display = 'none'
document.getElementById('form-recovery').style.display = 'block'
}
})

// Impede open redirect: só aceita um ?redirect= que aponte para uma página
// do próprio site (caminho relativo), nunca para um domínio externo — caso
// contrário um link como auth.html?redirect=https://site-falso.com podia
// usar o nosso login genuíno para depois atirar a vítima para phishing.
function safeRedirect(path) {
try {
if (!path) return null
const url = new URL(path, location.origin)
if (url.origin === location.origin) return url.pathname + url.search + url.hash
} catch (e) {}
return null
}

// If already logged in (and not in the middle of a recovery flow), redirect to dashboard
db.auth.getSession().then(({ data }) => {
if (data.session && !inRecovery && !location.hash.includes('type=recovery')) location.href = safeRedirect(params.get('redirect')) || 'dashboard.html'
})

// Check if coming from ?tab=register
const params = new URLSearchParams(location.search)
if (params.get('tab') === 'register') showTab('register')
const refCode = (params.get('ref') || '').trim().toUpperCase() || null

let regAccountType = null
function selectAccountType(t) {
regAccountType = t
document.getElementById('intent-client').classList.toggle('on', t === 'client')
document.getElementById('intent-professional').classList.toggle('on', t === 'professional')
}
// Se viemos de uma ação concreta do site (ex: mandar mensagem a um
// profissional, ou publicar um pedido) já sabemos se é cliente ou
// profissional — não faz sentido obrigar a escolher outra vez.
const intentParam = params.get('intent')
if (intentParam === 'client' || intentParam === 'professional') selectAccountType(intentParam)

// Se viemos de outra página (temos ?redirect=), mostra um link para voltar
// em vez de deixar a pessoa "presa" no ecrã de login.
if (params.get('redirect')) document.getElementById('back-link').style.display = 'block'
function postAuthDestination(accountType) {
const r = safeRedirect(params.get('redirect'))
if (r) return r
return accountType === 'client' ? 'pedidos.html' : 'dashboard.html'
}

function showTab(tab) {
document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none'
document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none'
document.getElementById('tab-login').classList.toggle('active', tab === 'login')
document.getElementById('tab-register').classList.toggle('active', tab === 'register')
}

function showMsg(id, text, type) {
const el = document.getElementById(id)
el.textContent = text
el.className = 'msg ' + (text ? type : 'hidden')
}

async function doLogin() {
const email = document.getElementById('login-email').value.trim()
const password = document.getElementById('login-password').value
const btn = document.getElementById('login-btn')

showMsg('login-msg', '', 'hidden')
if (!email || !password) return showMsg('login-msg', 'Preenche o email e a password.', 'error')

btn.disabled = true
btn.textContent = 'A entrar...'

try {
const { data, error } = await db.auth.signInWithPassword({ email, password })

if (error) {
showMsg('login-msg', 'Email ou password incorretos.', 'error')
btn.disabled = false
btn.textContent = 'Entrar na conta'
return
}

if (data.user.email === 'davidscampos10@gmail.com') {
showMsg('login-msg', 'Bem-vindo, admin! A redirecionar...', 'success')
setTimeout(() => location.href = 'admin.html', 800)
return
}

showMsg('login-msg', 'Bem-vindo! A redirecionar...', 'success')
setTimeout(() => location.href = safeRedirect(params.get('redirect')) || 'dashboard.html', 800)
} catch (e) {
showMsg('login-msg', 'Erro de ligação. Tenta novamente.', 'error')
btn.disabled = false
btn.textContent = 'Entrar na conta'
}
}

// Live match feedback for register password confirmation
function togglePw(inputId,btnId){
const i=document.getElementById(inputId); const b=document.getElementById(btnId)
const show=i.type==='password'
i.type=show?'text':'password'
b.setAttribute('aria-label',show?'Ocultar password':'Mostrar password')
b.classList.toggle('on',show)
}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('recovery-password').addEventListener('input',checkRecoveryMatch)
document.getElementById('recovery-password2').addEventListener('input',checkRecoveryMatch)
})

async function doRegister() {
const name = document.getElementById('reg-name').value.trim()
const email = document.getElementById('reg-email').value.trim()
const password = document.getElementById('reg-password').value
const btn = document.getElementById('reg-btn')

showMsg('reg-msg', '', 'hidden')

if (!regAccountType) return showMsg('reg-msg', 'Escolhe se queres contratar ou oferecer serviços.', 'error')
if (!name || !email || !password) return showMsg('reg-msg', 'Preenche todos os campos.', 'error')
if (password.length < 6) return showMsg('reg-msg', 'A password deve ter pelo menos 6 caracteres.', 'error')
if (!email.includes('@')) return showMsg('reg-msg', 'Introduz um email válido.', 'error')

btn.disabled = true
btn.textContent = 'A criar conta...'

try {
const { data: signUpData, error: signUpError } = await db.auth.signUp({ email, password })

if (signUpError) {
const errMsg = (signUpError.message || '').toLowerCase()
let msg = 'Erro ao criar conta. Tenta novamente.'
if (errMsg.includes('already') || errMsg.includes('registered') || errMsg.includes('exists')) {
msg = 'Este email já está registado. Tenta fazer login.'
} else if (errMsg.includes('invalid') || errMsg.includes('email')) {
msg = 'Email inválido. Verifica o endereço introduzido.'
} else if (errMsg.includes('password') || errMsg.includes('weak')) {
msg = 'Password demasiado fraca. Usa pelo menos 6 caracteres.'
}
showMsg('reg-msg', msg, 'error')
btn.disabled = false
btn.textContent = 'Criar conta'
return
}

const userId = signUpData.user?.id
if (!userId) {
showMsg('reg-msg', 'Este email já está registado. Tenta fazer login.', 'error')
btn.disabled = false
btn.textContent = 'Criar conta'
return
}

if (signUpData.session) {
await insertProfile(userId, name, email, regAccountType)
await applyReferral(userId)
showMsg('reg-msg', 'Conta criada! A redirecionar...', 'success')
setTimeout(() => location.href = postAuthDestination(regAccountType), 800)
return
}

const { data: signInData, error: signInError } = await db.auth.signInWithPassword({ email, password })

if (!signInError && signInData?.session) {
await insertProfile(signInData.user.id, name, email, regAccountType)
await applyReferral(signInData.user.id)
showMsg('reg-msg', 'Conta criada! A redirecionar...', 'success')
setTimeout(() => location.href = postAuthDestination(regAccountType), 800)
return
}

showMsg('reg-msg', '✅ Conta criada! Verifica o email ' + email + ' e clica no link de confirmação. Depois faz login aqui.', 'success')
btn.disabled = false
btn.textContent = 'Criar conta'

} catch (e) {
showMsg('reg-msg', 'Erro de ligação. Tenta novamente.', 'error')
btn.disabled = false
btn.textContent = 'Criar conta'
}
}

async function insertProfile(userId, name, email, accountType) {
// Criar o perfil passa por uma função (RPC): um "upsert" direto com
// "on conflict ... do update" exige privilégio de SELECT sobre as
// colunas em causa mesmo sem pedir dados de volta — deixou de estar
// disponível para contas normais depois de restringirmos as colunas
// legíveis da tabela profiles. A função corre com privilégios completos.
await db.rpc('create_my_profile_if_missing', { p_name: name, p_account_type: accountType || 'professional' })
}

async function applyReferral(newUserId) {
if (!refCode) return
try {
// referral_code nao e uma coluna legivel diretamente (so o proprio dono a
// consegue ler) — usa-se uma funcao dedicada que so devolve o id de quem
// convidou, sem expor mais nenhum dado do perfil dele.
const { data: referrerId } = await db.rpc('resolve_referral_code', { code: refCode })
if (!referrerId || referrerId === newUserId) return
await db.from('signup_referrals').insert({ referrer_id: referrerId, referred_id: newUserId })
} catch (e) {}
}

async function doResetPassword(e) {
e.preventDefault()
const email = document.getElementById('login-email').value.trim()
if (!email) { showMsg('login-msg', 'Escreve o teu email acima primeiro.', 'error'); return }
const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/auth.html' })
if (error) { showMsg('login-msg', 'Erro ao enviar email de recuperação.', 'error') }
else { showMsg('login-msg', 'Email de recuperação enviado para ' + email + '! Abre o email e clica no link para definires a nova password.', 'success') }
}

function checkRecoveryMatch(){
const p1=document.getElementById('recovery-password').value
const p2=document.getElementById('recovery-password2').value
const hint=document.getElementById('recovery-match-hint')
if(!p2){hint.textContent='';return true}
if(p1===p2){hint.textContent='✓ As passwords coincidem';hint.style.color='#166534';return true}
hint.textContent='✗ As passwords não coincidem';hint.style.color='#b91c1c';return false
}

async function doUpdatePassword(){
const p1=document.getElementById('recovery-password').value
const p2=document.getElementById('recovery-password2').value
const btn=document.getElementById('recovery-btn')
showMsg('recovery-msg','','hidden')
if(!p1||!p2)return showMsg('recovery-msg','Preenche os dois campos.','error')
if(p1.length<6)return showMsg('recovery-msg','A password deve ter pelo menos 6 caracteres.','error')
if(p1!==p2)return showMsg('recovery-msg','As passwords não coincidem.','error')
btn.disabled=true;btn.textContent='A guardar...'
const{error}=await db.auth.updateUser({password:p1})
btn.disabled=false;btn.textContent='Guardar nova password'
if(error){showMsg('recovery-msg','Erro ao atualizar a password. Tenta pedir um novo link de recuperação.','error');return}
showMsg('recovery-msg','Password atualizada! A redirecionar...','success')
setTimeout(()=>location.href='dashboard.html',1000)
}

// Enter key support
document.addEventListener('keydown', e => {
if (e.key !== 'Enter') return
if (document.getElementById('form-recovery').style.display !== 'none') doUpdatePassword()
else if (document.getElementById('form-login').style.display !== 'none') doLogin()
else doRegister()
})
</script>
</body>
</html>
