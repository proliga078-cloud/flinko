<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Flinko · Gestão</title>
<style>
:root{
  --bg:#f4f5f8;--card:#fff;--ink:#1c2033;--mut:#6b7186;--line:#e6e8ef;
  --side:#161a2b;--side-ink:#aab0c6;--acc:#f26a1b;--acc2:#fff1e8;

}
@media (prefers-color-scheme:dark){

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
a{color:var(--acc)}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:30px;width:100%;max-width:380px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo b{color:var(--acc)}
.lbox p{color:var(--mut);margin:6px 0 18px}
label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sec{margin:0;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600}.btn.sec.sm{font-size:12px}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.bad{background:var(--bad)}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
/* layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
aside .logo{color:#fff;padding:4px 10px 16px}
aside nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;border:0;background:none;color:inherit;text-align:left}
.nv:hover{background:rgba(255,255,255,.06)}
.nv.on{background:var(--acc);color:#fff}
.nv .ic{width:20px;text-align:center}
.nv .bd{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
aside .btn.sec{color:var(--side-ink);border-color:rgba(255,255,255,.2)}
.ng{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#6b7391;padding:12px 11px 4px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .cd{background:var(--card);border-radius:8px;min-height:88px;padding:4px 6px;font-size:11px;overflow:hidden;cursor:pointer}
.cal .cd.o{opacity:.35;cursor:default}.cal .cd.t{outline:2px solid var(--acc)}
.ev{display:block;border-radius:4px;padding:1px 4px;margin-top:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details summary{list-style:revert}
.who{font-size:12px;padding:10px;border-top:1px solid rgba(255,255,255,.08);word-break:break-all}
main{padding:24px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;letter-spacing:-.3px}
.top .sub{color:var(--mut)}
.top .sp{flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.pill.ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.pill.warn{background:#fef3c7;color:#92400e;border-color:#fde68a}
.pill.bad{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.pill.acc{background:var(--acc2);color:var(--acc);border-color:transparent}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;min-width:0}
.card h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.kpi .lb{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.8px;margin:2px 0}
.kpi .d{font-size:12px;color:var(--mut)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.sec{margin:26px 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--bg)}
.tw{overflow:auto;max-width:100%}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.fun{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:6px 0}
.fun .fb{height:26px;background:var(--acc2);border-radius:8px;overflow:hidden}
.fun .fb i{display:block;height:100%;background:var(--acc);border-radius:8px;min-width:2px}
.fun .n{text-align:right;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{width:auto;min-width:150px}
.sug{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sug:last-child{border:0}
.sug .t{flex:1}
.kb{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:12px}
.kb .col{background:var(--bg);border-radius:12px;padding:10px;min-height:120px}
.kb h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--mut);letter-spacing:.5px}
.tk{background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:var(--sh)}
.tk .tt{font-weight:600}
.tk .mt{font-size:12px;color:var(--mut);margin:4px 0 8px}
.tk .ac{display:flex;gap:6px;flex-wrap:wrap}
svg text{fill:var(--mut);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
/* drawer + modal */
#ov{position:fixed;inset:0;background:rgba(10,12,25,.5);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);z-index:41;padding:22px;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
#modal{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:rgba(10,12,25,.55);padding:16px}
#modal .mb{background:var(--card);border-radius:16px;padding:22px;max-width:420px;width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;margin:12px 0}
.kv span:nth-child(odd){color:var(--mut)}
.note{background:var(--acc2);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.note.bad{background:#fee2e2;color:#7f1d1d}
.mut{color:var(--mut)}
.mob{display:none}
@media print{aside,.tools,.btn,.mob,#ov,#drawer{display:none!important}#app{display:block}main{padding:0}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}
@media (max-width:860px){
  .cal .cd{min-height:56px}.ev{font-size:0;height:6px;padding:0}
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:230px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  main{padding:16px 14px 60px}
  .mob{display:inline-block}
  .kb{grid-template-columns:1fr}
  .fun{grid-template-columns:110px 1fr 70px}
}
</style>
</head>

<div id="login">
  <div class="lbox">

<script>
"use strict";
/* ============ CONFIG ============ */
const SB_URL = "https://cdwinidhtfxfxowflize.supabase.co";
const SB_KEY = "sb_publishable_G1U9iSJLR2JkhD9gvfyY3Q_qaqnMaUk"; // chave pública (anon)
const DAY = 864e5;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = v => (v || 0).toLocaleString("pt-PT", { style: "currency", currency: "EUR", maximumFractionDigits: v % 1 ? 2 : 0 });
const num = v => (v || 0).toLocaleString("pt-PT");
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const now = () => Date.now();
const dkey = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const fdate = d => d ? new Date(d).toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit", year: "numeric" }) : "—";
const ago = d => { if (!d) return "—"; const n = Math.floor((now() - new Date(d)) / DAY); return n <= 0 ? "hoje" : n === 1 ? "ontem" : "há " + n + " dias"; };
const ls = { get(k, f) { if (k !== "fk_session" && DEMO) return f; try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } }, set(k, v) { if (k !== "fk_session" && DEMO) return; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());

/* ============ AUTH + API ============ */
let session = ls.get("fk_session", null);

async function authFetch(path, body) {
  const r = await fetch(SB_URL + "/auth/v1/" + path, { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || "Falha no início de sessão");
  return j;
}
async function refresh() {
  if (!session?.refresh_token) throw new Error("Sessão expirada");

  session = { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user };

}
async function api(path, opt = {}, retry = true) {
  if (DEMO) { const r = demoApi(path, opt), q = new URLSearchParams(path.split("?")[1] || ""); return Array.isArray(r) && q.has("limit") ? r.slice(+q.get("offset") || 0, (+q.get("offset") || 0) + +q.get("limit")) : r; }
  const r = await fetch(SB_URL + "/rest/v1/" + path, {
    method: opt.method || "GET",
    headers: Object.assign({ apikey: SB_KEY, Authorization: "Bearer " + session.access_token, "Content-Type": "application/json", Prefer: "return=representation" }, opt.headers || {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  if (r.status === 401 && retry) { await refresh(); return api(path, opt, false); }
  const t = await r.text();
  if (!r.ok) { let m = t; try { m = JSON.parse(t).message || t; } catch (e) { } const e = new Error(m); e.status = r.status; throw e; }
  return t ? JSON.parse(t) : [];
}
// Lê TODAS as linhas de uma consulta, página a página. A API do Supabase
// devolve no máximo 1000 linhas por pedido (às vezes menos); sem isto os
// números paravam de crescer sem aviso nenhum. Avança pelo nº de linhas que
// chegou, por isso funciona seja qual for o limite do servidor. A consulta
// tem de ter uma ordem estável (order=...,id).
async function apiAll(path, page = 1000) {
  const out = [], sep = path.includes("?") ? "&" : "?";
  for (let off = 0; ; ) {
    const rows = await api(path + sep + "limit=" + page + "&offset=" + off);
    if (!Array.isArray(rows) || !rows.length) break;
    out.push(...rows); off += rows.length;
    if (out.length > 200000) break; // travão de segurança
  }
  return out;
}
// Tabela ou função ainda não criada no Supabase (migração por aplicar).
const missing = e => e && (e.status === 404 || /does not exist|PGRST20[25]|schema cache|Could not find/i.test(e.message || ""));
window.addEventListener("unhandledrejection", e => { const m = e.reason && e.reason.message || String(e.reason || ""); if (m) toast("Erro: " + m); });

/* ============ STORAGE (tarefas, CRM, definições) ============ */
const store = { cloud: false, tasks: [], crm: {}, settings: {} };
const DEFAULTS = {
  prices: { starter: 9.99, pro: 19.99, premium: 29.99 },
  aiFee: 2.99,
  costs: [{ name: "Domínio flinko.pt", amount: 0 }, { name: "Supabase", amount: 0 }, { name: "Netlify", amount: 0 }, { name: "Email / outros", amount: 0 }],
  goals: { pros: 100, clients: 50, reviews: 20, mrr: 100 },
  proj: { newPros: 10, conv: 5, growth: 5, avgPrice: 19.99 }
};
async function loadStore() {
  if (DEMO && store._init) return;
  store._init = true; store.broken = null;
  try {
    const [t, c, st, it] = await Promise.all([apiAll("admin_tasks?select=*&order=created_at.desc,id"), apiAll("admin_crm?select=*&order=profile_id"), apiAll("admin_settings?select=*&order=key"), apiAll("admin_items?select=*&order=created_at,id")]);

    store.settings = Object.fromEntries(st.map(x => [x.key, x.value]));
    store.items = {}; it.forEach(r => { (store.items[r.kind] = store.items[r.kind] || []).push(Object.assign({}, r.data, { id: r.id })); });
    store.cloud = true;
  } catch (e) {
    store.cloud = false;
    if (missing(e)) {
      // As tabelas do painel ainda não existem: usa este navegador (e diz isso em Definições).
      store.tasks = ls.get("fk_tasks", []); store.crm = ls.get("fk_crm", {}); store.settings = ls.get("fk_settings", {}); store.items = ls.get("fk_items", {});
    } else {
      // Falha de rede ou de permissões: NÃO passa a guardar no navegador às

    }
  }
}
const guard = () => { if (store.broken) throw new Error("Sem ligação às tabelas do painel no Supabase: nada foi guardado. Carrega em ↻ Atualizar."); };
const setting = k => store.settings[k] ?? DEFAULTS[k];
async function saveSetting(k, v) {
  guard();
  store.settings[k] = v;
  if (store.cloud) await api("admin_settings", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: { key: k, value: v } });
  else ls.set("fk_settings", store.settings);
}
async function saveTask(t) {
  guard();
  const i = store.tasks.findIndex(x => x.id === t.id);

  else ls.set("fk_tasks", store.tasks);

async function delTask(id) {

}

  const cur = store.crm[pid] || { profile_id: pid, stage: "novo", notes: "", next_contact: null };

/* ============ CARREGAR DADOS ============ */
let D = {}, M = {}, LOADERR = [];
// Todas as consultas têm uma ordem estável (acabam em id) para a paginação

// Converte visitas em bruto (uma linha por visita) no formato agregado de
// admin_visit_rows. Usado enquanto a migração não estiver aplicada.
function compactVisits(raw) {
  const m = {};
  raw.forEach(v => {

async function loadTable(k) {

async function loadAll() {

/* ============ CÁLCULOS ============ */
function compute() {
  const t = now(), d7 = t - 7 * DAY, d14 = t - 14 * DAY, d30 = t - 30 * DAY;
  const P = D.profiles.filter(p => !p.is_demo && !p.is_admin);           // contas reais
  const ignoreIds = new Set(D.profiles.filter(p => p.is_demo || p.is_admin).map(p => p.id));
  const pros = P.filter(p => p.account_type !== "client");
  const clients = P.filter(p => p.account_type === "client");
  const phone = Object.fromEntries(D.private.map(x => [x.profile_id, x.phone]));
  const cnt = (arr, key) => arr.reduce((m, x) => (m[x[key]] = (m[x[key]] || 0) + 1, m), {});
  const svc = cnt(D.services, "professional_id"), port = cnt(D.portfolio, "professional_id"), rev = cnt(D.reviews, "professional_id");
  const convByPro = cnt(D.conversations, "professional_id"), offByPro = cnt(D.offers, "professional_id");
  const viewsByPro = cnt(D.pviews, "profile_id");

  /* completude do perfil (0-100) */
  const chk = p => [
    ["Categoria", 15, !!p.category], ["Localização", 10, !!p.location], ["Bio", 15, !!(p.bio && p.bio.trim())],
    ["Foto", 15, !!p.photo_url], ["Capa", 5, !!p.cover_url], ["Serviço", 15, !!svc[p.id]],
    ["Portfólio", 10, !!port[p.id]], ["Verificado", 10, !!p.verified], ["Telemóvel", 5, !!phone[p.id]]
  ];
  pros.forEach(p => { p._chk = chk(p); p._score = p._chk.reduce((s, c) => s + (c[2] ? c[1] : 0), 0); p._missing = p._chk.filter(c => !c[2]).map(c => c[0]); p._phone = phone[p.id] || ""; p._views = viewsByPro[p.id] || 0; p._conv = convByPro[p.id] || 0; p._svc = svc[p.id] || 0; });

  /* tráfego sem as visitas do admin/demo */
  const V = D.visits.filter(v => !(v.user_id && ignoreIds.has(v.user_id)));
  const inWin = (arr, f, a, b) => arr.filter(x => { const q = new Date(x[f]).getTime(); return q >= a && q < b; });
  const uniq = arr => new Set(arr.map(v => v.visitor_id)).size;
  const v7 = inWin(V, "last_at", d7, t + DAY), vp7 = inWin(V, "last_at", d14, d7), v30 = inWin(V, "last_at", d30, t + DAY);
  const hits = arr => arr.reduce((s, v) => s + (+v.n || 1), 0); // cada linha agregada vale n visitas
  const su7 = inWin(P, "created_at", d7, t + DAY).length, sup7 = inWin(P, "created_at", d14, d7).length;

  /* pagamentos */
  const prices = setting("prices");
  const activePaid = P.filter(p => p.plan && p.plan !== "free" && (!p.plan_expires_at || new Date(p.plan_expires_at) > t));
  const mrr = activePaid.reduce((s, p) => s + (prices[p.plan] || 0), 0);
  const aiUnlocked = P.filter(p => p.ai_profile_builder_unlocked);
  const aiRev = aiUnlocked.length * setting("aiFee");
  const adCredits = D.ads.reduce((s, a) => s + (+a.credits_spent || 0), 0);
  const gmv = D.jobs.reduce((s, j) => s + (+j.paid_amount || 0), 0);

  /* funil */
  const conProIds = new Set(D.conversations.map(c => c.professional_id));
  const funnel = [
    ["Registados (profissionais)", pros.length],
    ["Com categoria e localização", pros.filter(p => p.category && p.location).length],
    ["Com bio e foto", pros.filter(p => p.bio && p.bio.trim() && p.photo_url).length],
    ["Com pelo menos 1 serviço", pros.filter(p => svc[p.id]).length],
    ["Verificados", pros.filter(p => p.verified).length],
    ["Receberam conversa", pros.filter(p => conProIds.has(p.id)).length],
    ["Com trabalho registado", new Set(D.jobs.map(j => j.professional_id)).size],
    ["Com avaliação", pros.filter(p => rev[p.id]).length]
  ];

  /* oferta vs procura por categoria */
  const cat = {};
  pros.forEach(p => { const c = p.category || "—"; (cat[c] = cat[c] || { c, pros: 0, ver: 0, req: 0, off: 0 }).pros++; if (p.verified) cat[c].ver++; });
  D.requests.forEach(r => { const c = r.category || "—"; (cat[c] = cat[c] || { c, pros: 0, ver: 0, req: 0, off: 0 }).req++; });
  const reqCat = Object.fromEntries(D.requests.map(r => [r.id, r.category || "—"]));
  D.offers.forEach(o => { const c = reqCat[o.request_id]; if (c && cat[c]) cat[c].off++; });
  const loc = {};
  pros.forEach(p => { const l = (p.location || "—").split("–")[0].trim(); loc[l] = (loc[l] || 0) + 1; });

  /* séries temporais */
  const days = n => Array.from({ length: n }, (_, i) => dkey(t - (n - 1 - i) * DAY));
  const bucket = (arr, f, keys, filt) => { const m = Object.fromEntries(keys.map(k => [k, 0])); arr.forEach(x => { if (filt && !filt(x)) return; const k = dkey(x[f]); if (k in m) m[k]++; }); return keys.map(k => ({ x: k, y: m[k] })); };
  const d30k = days(30);
  const uv = keys => { const m = Object.fromEntries(keys.map(k => [k, new Set()])); V.forEach(v => { const k = String(v.day); if (k in m) m[k].add(v.visitor_id); }); return keys.map(k => ({ x: k, y: m[k].size })); };
  const vday = keys => { const m = Object.fromEntries(keys.map(k => [k, 0])); V.forEach(v => { const k = String(v.day); if (k in m) m[k] += +v.n || 1; }); return keys.map(k => ({ x: k, y: m[k] })); };
  const weeks = 12, wk = Array.from({ length: weeks }, (_, i) => { const a = t - (weeks - i) * 7 * DAY, b = a + 7 * DAY; return { a, b, x: new Date(b - DAY).toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit" }) }; });
  const wser = (arr, f, filt) => wk.map(w => ({ x: w.x, y: arr.filter(r => { const q = new Date(r[f]).getTime(); return q >= w.a && q < w.b && (!filt || filt(r)); }).length }));

  /* alertas */
  const alerts = [];
  const gp = D.gdpr.filter(g => g.status === "pending" || g.status === "in_progress");
  gp.forEach(g => { const dias = Math.floor((t - new Date(g.created_at)) / DAY); alerts.push({ lvl: dias > 20 ? "bad" : "warn", txt: `Pedido RGPD (${g.request_type === "delete" ? "eliminação" : "exportação"}) em aberto há ${dias} dias — prazo legal de 30 dias`, go: "ops" }); });
  const vp = D.verif.filter(v => v.status === "pending"); if (vp.length) alerts.push({ lvl: "warn", txt: `${vp.length} pedido(s) de verificação por tratar`, go: "ops" });
  const nv = pros.filter(p => !p.verified); if (nv.length) alerts.push({ lvl: "warn", txt: `${nv.length} profissional(is) por verificar`, go: "pros" });
  const nc = pros.filter(p => !p.category); if (nc.length) alerts.push({ lvl: "warn", txt: `${nc.length} profissionais sem categoria (invisíveis nas pesquisas)`, go: "pros" });
  const failedN = D.notif.filter(n => n.status === "failed").length; if (failedN) alerts.push({ lvl: "bad", txt: `${failedN} notificações falharam o envio`, go: "ops" });
  if (D.incompletos && D.incompletos.porConvidar) alerts.push({ lvl: "warn", txt: `${D.incompletos.porConvidar} pessoa(s) criaram conta mas o registo ficou a meio (sem perfil, não aparecem no painel)`, go: "alerts" });
  const openReq = D.requests.filter(r => r.status === "open" && !D.offers.some(o => o.request_id === r.id)); if (openReq.length) alerts.push({ lvl: "bad", txt: `${openReq.length} pedido(s) de clientes abertos sem nenhuma proposta`, go: "demand" });
  const expiring = activePaid.filter(p => p.plan_expires_at && new Date(p.plan_expires_at) < t + 7 * DAY); if (expiring.length) alerts.push({ lvl: "warn", txt: `${expiring.length} subscrição(ões) a expirar em 7 dias`, go: "fin" });

  M = {
    P, pros, clients, phone, mrr, activePaid, aiUnlocked, aiRev, adCredits, gmv, funnel, cat: Object.values(cat).sort((a, b) => (b.req + b.pros) - (a.req + a.pros)), loc: Object.entries(loc).sort((a, b) => b[1] - a[1]),
    su7, sup7, v7: hits(v7), vp7: hits(vp7), u7: uniq(v7), up7: uniq(vp7), v30: hits(v30), u30: uniq(v30),
    avgScore: pros.length ? Math.round(pros.reduce((s, p) => s + p._score, 0) / pros.length) : 0,
    complete: pros.filter(p => p._score >= 80).length,
    visits30: vday(d30k), uvis30: uv(d30k),
    signWeeks: wser(P, "created_at"), proWeeks: wser(P, "created_at", p => p.account_type !== "client"), cliWeeks: wser(P, "created_at", p => p.account_type === "client"),
    reqWeeks: wser(D.requests, "created_at"), convWeeks: wser(D.conversations, "created_at"),
    alerts, gp, vp, rev: D.reviews.length, avgRating: D.reviews.length ? D.reviews.reduce((s, r) => s + r.rating, 0) / D.reviews.length : 0,
    openReq, msgs: D.messages.length, ignored: ignoreIds.size, weeks: wk
  };
  computeExtra();
}

/* ============ CÁLCULOS EXTRA (atividade, coortes, qualidade) ============ */
function computeExtra() {
  const t = now(), users = M.P;
  const act = {}; D.visits.forEach(v => { if (v.user_id) (act[v.user_id] = act[v.user_id] || []).push(new Date(v.last_at).getTime()); });
  users.forEach(p => { const a = act[p.id] || []; p._last = a.length ? Math.max(...a) : null; p._nv = a.length; p._act = a; });
  const active = d => users.filter(p => p._last && p._last > t - d * DAY).length;
  M.dau = active(1); M.wau = active(7); M.mau = active(30);
  M.stick = M.mau ? Math.round(M.wau / M.mau * 100) : 0;
  const created = p => new Date(p.created_at).getTime();
  M.neverBack = M.pros.filter(p => t - created(p) > 3 * DAY && !p._act.some(x => x - created(p) > DAY));
  M.dormant = M.pros.filter(p => p._last && t - p._last > 30 * DAY);
  M.atRisk = M.pros.filter(p => p._last && t - p._last > 14 * DAY && t - p._last <= 30 * DAY);
  /* coortes semanais (últimas 8 semanas) */
  M.cohorts = [];
  const convPros = new Set(D.conversations.map(c => c.professional_id));
  for (let w = 7; w >= 0; w--) {
    const a = t - (w + 1) * 7 * DAY, b = a + 7 * DAY, us = M.pros.filter(p => created(p) >= a && created(p) < b);
    const ret = k => { const el = us.filter(p => created(p) + (k + 1) * 7 * DAY <= t); return { n: el.length, k: el.filter(p => p._act.some(x => x >= created(p) + k * 7 * DAY && x < created(p) + (k + 1) * 7 * DAY)).length }; };
    M.cohorts.push({ label: new Date(a).toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit" }), n: us.length, act: us.filter(p => p._score >= 60).length, conv: us.filter(p => convPros.has(p.id)).length, r1: ret(1), r2: ret(2), r4: ret(4) });
  }
  /* qualidade / suspeitos */
  const dup = {}; M.pros.forEach(p => { const k = d9(p._phone); if (k.length === 9) dup[k] = (dup[k] || 0) + 1; });
  M.susp = [];
  M.pros.forEach(p => {
    const why = [], days = Math.floor((t - created(p)) / DAY);
    if (/^(test|teste|asd|xxx|demo|aaa)/i.test(p.name.trim()) || p.name.trim().length < 3) why.push("nome suspeito");
    if (dup[d9(p._phone)] > 1) why.push("telemóvel repetido");
    if (!p.category && !p.bio && !p.photo_url && days > 14) why.push(`conta vazia há ${days} dias`);
    if (p.verified && p._score < 40) why.push("verificado com perfil muito incompleto");
    if (why.length) M.susp.push({ p, why });
  });
  const BAD = /(fuder|foder|merda|puta|caralho|porra|cabr[aã]o|idiota|burro|estúpido|estupido|filho da)/i, LINK = /(https?:\/\/|www\.)/i, PH = /(\+?351)?\s?9\d[\s.-]?\d{3}[\s.-]?\d{3}/;
  M.flags = [];
  D.conversations.forEach(c => { const m = c.last_message || ""; if (!m) return; const why = BAD.test(m) ? "linguagem ofensiva" : LINK.test(m) ? "contém ligação externa" : PH.test(m) ? "partilha de contacto fora da plataforma" : ""; if (why) M.flags.push({ c, why }); });
  const topOf = arr => { const o = {}; arr.forEach(x => o[x] = (o[x] || 0) + 1); const e = Object.entries(o).sort((a, b) => b[1] - a[1])[0]; return e ? { k: e[0], n: e[1], p: pct(e[1], arr.length) } : { k: "—", n: 0, p: 0 }; };
  M.topCat = topOf(M.pros.filter(p => p.category).map(p => p.category));
  M.topLoc = topOf(M.pros.filter(p => p.location).map(p => p.location.split("–")[0].trim()));
  M.regPhones = new Set(M.pros.map(p => d9(p._phone)).filter(x => x.length === 9));
}
/* ledger */
function ledgerStats() {
  const L = items("ledger"), t = new Date(), month = (d, off = 0) => { const x = new Date(d); return new Date(x.getFullYear(), x.getMonth() + off, 1); };
  const key = d => dkey(d).slice(0, 7);

  const months = Array.from({ length: 6 }, (_, i) => key(month(t, i - 5)));
  const cash0 = +setting("cash0") || 0, all = L.reduce((s, e) => s + (e.type === "receita" ? 1 : -1) * (+e.amount || 0), 0), cash = cash0 + all;
  const last3 = Array.from({ length: 3 }, (_, i) => key(month(t, -i - 1))), burn = last3.reduce((s, k) => s + ((by[k]?.d || 0) - (by[k]?.r || 0)), 0) / 3;

}

let hMetric = "pros", hDays = 90;
function cumSeries(arr, days) {
  const t = new Date(); t.setHours(23, 59, 59, 999); const ts = arr.map(x => new Date(x.created_at).getTime()).sort((a, b) => a - b);
  return Array.from({ length: days }, (_, i) => { const end = t.getTime() - (days - 1 - i) * DAY; let n = 0; while (n < ts.length && ts[n] <= end) n++; return { x: dkey(end), y: n }; });
}

function scores() {
  const pros = M.pros.length || 1, g = setting("goals"), late = store.tasks.filter(t => t.status !== "done" && t.due_date && new Date(t.due_date) < now() - DAY).length;
  const gdprLate = M.gp.filter(x => now() - new Date(x.created_at) > 20 * DAY).length, failed = D.notif.filter(n => n.status === "failed").length;
  const S = [
    ["Ativação", pct(M.complete, pros), "% de profissionais com perfil de 80+ pontos"],
    ["Retenção", pct(M.mau, M.P.length || 1), "% de contas ativas nos últimos 30 dias"],
    ["Procura", Math.min(100, Math.round(M.clients.length / pros * 200)), "1 cliente por cada 2 profissionais = 100"],
    ["Confiança", pct(M.pros.filter(p => p.verified).length, pros), "% de profissionais verificados"],
    ["Receita", g.mrr ? Math.min(100, pct(M.mrr, g.mrr)) : 0, "MRR face à meta definida"],
    ["Operação", Math.max(0, 100 - gdprLate * 30 - failed * 10 - late * 5 - M.flags.length * 5 - M.openReq.length * 10), "desconta atrasos, RGPD, falhas e pedidos por responder"]
  ];
  return { S, overall: Math.round(S.reduce((s, x) => s + x[1], 0) / S.length) };
}

/* ============ AÇÕES SENSÍVEIS (plano e reembolsos, via funções seguras do servidor) ============ */
async function fn(name, body) {
  if (DEMO) return demoFn(name, body);
  if (!/^https?:$/.test(location.protocol)) throw new Error("Esta ação só funciona quando o painel está aberto em flinko.pt.");
  const call = () => fetch(location.origin + "/.netlify/functions/" + name, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: JSON.stringify(body) });
  let r = await call();
  if (r.status === 401) { await refresh(); r = await call(); }
  const t = await r.text(); let j = {}; try { j = JSON.parse(t); } catch (e) { }
  if (!r.ok) throw new Error(j.error || (r.status === 404 ? "Função não encontrada neste site." : "Erro " + r.status));
  return j;
}
function demoFn(name, body) {
  if (name === "admin-refund" && body.action === "list") return { charges: [{ id: "ch_demo1", amount: 999, amount_refunded: 0, currency: "eur", refunded: false, paid: true, created: Math.floor(now() / 1000) - 12 * 86400 }, { id: "ch_demo2", amount: 999, amount_refunded: 999, currency: "eur", refunded: true, paid: true, created: Math.floor(now() / 1000) - 42 * 86400 }] };
  return { ok: true };
}
const money = (c, cur) => ((c || 0) / 100).toLocaleString("pt-PT", { style: "currency", currency: String(cur || "eur").toUpperCase() });
function payBox(p) {
  return `<h3 style="margin:18px 0 6px">Plano e pagamentos</h3>
    <div class="kv"><span>Plano atual</span><span><b>${esc(p.plan || "free")}</b>${p.plan_expires_at ? ` · expira ${fdate(p.plan_expires_at)}` : ""}</span><span>Subscrição Stripe</span><span>${p.stripe_subscription_id ? `<span class="pill warn">ativa</span>` : "—"}</span></div>
    <div class="row"><select id="planSel" style="width:auto">${["free", "starter", "pro", "premium"].map(x => `<option ${x === (p.plan || "free") ? "selected" : ""}>${x}</option>`).join("")}</select>
    <button class="btn sec" onclick="setPlanFor('${p.id}')">Alterar plano</button><button class="btn sec" onclick="showCharges('${p.id}')">Pagamentos e reembolsos</button></div>
    <div id="chargesBox" style="margin-top:10px"></div>`;

async function setPlanFor(id) {
  const p = D.profiles.find(x => x.id === id), plan = $("#planSel").value;
  if (plan === (p.plan || "free")) return toast("Já está nesse plano");
  const sub = !!p.stripe_subscription_id;
  if (!await ask("Alterar plano", `${p.name}: ${p.plan || "free"} → ${plan}.` + (sub ? " Tem uma subscrição ativa no Stripe: vai ser cancelada para deixar de ser cobrado." : " Não há subscrição Stripe associada."), "Alterar plano", sub)) return;
  try {
    await fn("admin-set-plan", { targetProfileId: id, plan });
    const old = p.plan || "free"; p.plan = plan; if (sub) p.stripe_subscription_id = null; if (plan === "free") p.plan_expires_at = null;
    compute(); render(); openPro(id); toast("Plano alterado");
  } catch (e) { toast("Erro: " + e.message); }
}
async function showCharges(id) {
  const b = $("#chargesBox"); b.innerHTML = `<span class="mut">A carregar pagamentos…</span>`;
  try {
    const c = (await fn("admin-refund", { action: "list", targetProfileId: id })).charges || [];
    b.innerHTML = c.length ? `<div class="tw"><table><tr><th>Data</th><th>Valor</th><th>Reembolsado</th><th></th></tr>${c.map(x => `<tr><td>${fdate(x.created * 1000)}</td><td>${money(x.amount, x.currency)}</td><td>${x.amount_refunded ? money(x.amount_refunded, x.currency) : "—"}</td><td>${x.paid && !x.refunded ? `<button class="btn sec sm" onclick="refundCharge('${id}','${esc(x.id)}',${x.amount - x.amount_refunded},'${esc(x.currency || "eur")}')">Reembolsar</button>` : x.refunded ? `<span class="pill">reembolsado</span>` : ""}</td></tr>`).join("")}</table></div>` : `<span class="mut">Este profissional não tem pagamentos no Stripe.</span>`;
  } catch (e) { b.innerHTML = `<span class="pill bad">${esc(e.message)}</span>`; }
}
async function refundCharge(id, chargeId, maxCents, cur) {
  const p = D.profiles.find(x => x.id === id);
  const r = await form("Reembolsar pagamento", [{ k: "amount", label: `Valor (€) — deixa 0 para reembolsar tudo (máx. ${(maxCents / 100).toFixed(2)})`, type: "number", def: 0 }, { k: "reason", label: "Motivo", type: "select", opts: [["requested_by_customer", "Pedido do cliente"], ["duplicate", "Pagamento duplicado"], ["fraudulent", "Fraude"]] }], {}, "Continuar");
  if (!r) return;
  const cents = r.amount > 0 ? Math.round(r.amount * 100) : undefined;
  if (cents && cents > maxCents) return toast("O valor é superior ao que ainda pode ser reembolsado");
  if (!await ask("Confirmar reembolso", `Vais devolver ${money(cents || maxCents, cur)} a ${p.name}. O dinheiro sai da tua conta Stripe e isto não pode ser desfeito.`, "Reembolsar", true)) return;
  try {
    await fn("admin-refund", { action: "refund", targetProfileId: id, chargeId, amount: cents, reason: r.reason });
    toast("Reembolso efetuado"); showCharges(id);
  } catch (e) { toast("Erro: " + e.message); }
}

  ["new7", "Novos (7 dias)", p => now() - new Date(p.created_at) < 7 * DAY],
  ["nocat", "Sem categoria ou zona", p => !p.category || !p.location],
  ["unver", "Por verificar", p => !p.verified],
  ["inactive", "Sem atividade (30+ dias, 0 conversas)", p => now() - new Date(p.created_at) > 30 * DAY && !p._conv],
  ["expiring", "Plano a expirar (7 dias)", p => p.plan && p.plan !== "free" && p.plan_expires_at && new Date(p.plan_expires_at) < now() + 7 * DAY && new Date(p.plan_expires_at) > now()],
  ["upsell", "Com visitas e sem plano pago", p => (!p.plan || p.plan === "free") && p._views >= 3],
  ["paid", "Com plano pago", p => p.plan && p.plan !== "free"],

async function contactVia(pid, ch) {
  const p = D.profiles.find(x => x.id === pid), text = msgFor(p), ph = M.phone[pid], em = EMAILS && EMAILS[pid];
  if (promoBlocked(tplOf(), pid)) return toast("Modelo promocional: sem consentimento registado para esta pessoa.");
  if (ch === "wa") { if (!ph) return toast("Sem telemóvel"); waOpen(ph, text); }
  else if (ch === "sms") { if (!ph) return toast("Sem telemóvel"); location.href = "sms:" + ph.replace(/\s/g, "") + "?body=" + encodeURIComponent(text); }
  else if (ch === "tel") { if (!ph) return toast("Sem telemóvel"); location.href = "tel:" + ph.replace(/\s/g, ""); }
  else if (ch === "mail") { if (!em) return toast("Sem email"); location.href = "mailto:" + em + "?subject=" + encodeURIComponent("Flinko · " + tplOf().name) + "&body=" + encodeURIComponent(text); }
  try {
    await logContact({ kind: "pro", id: pid }, tplOf(), { wa: "WhatsApp", sms: "SMS", tel: "chamada", mail: "email" }[ch]);
    if (ch !== "tel") await startSeq({ kind: "pro", id: pid }, tplOf().id);
  } catch (e) { toast("Erro: " + e.message); }
  refreshContact();
}
// Mensagem da Flinko (dentro da plataforma) a um ou vários profissionais, pelo
// servidor (admin-flinko-message). Cada um recebe na sua conversa com a
// "Flinko" e pode responder; as respostas chegam às tuas Mensagens.
async function sendFlinkoMessage(L) {
  L = (L || []).filter(Boolean); if (!L.length) return toast("Ninguém neste grupo");
  if (L.length > 500) return toast("No máximo 500 profissionais por envio. Filtra o grupo.");
  const r = await form(L.length === 1 ? "Mensagem da Flinko para " + L[0].name : `Mensagem da Flinko para ${L.length} profissionais`, [{ k: "text", label: "Mensagem (podes usar {nome} e {categoria})", type: "textarea", rows: 8, req: 1 }], { text: L.length === 1 ? "Olá {nome}! " : "" }, "Continuar");
  if (!r || !String(r.text || "").trim()) return;
  const ids = L.map(p => p.id);
  try {
    const pv = await fn("admin-flinko-message", { action: "preview", profileIds: ids });
    const why = {}; (pv.skipped || []).forEach(x => { why[x.reason] = (why[x.reason] || 0) + 1; });
    const out = Object.entries(why).map(([k, n]) => `${n} ${k}`).join(", ");
    if (!pv.recipients) return toast("Ninguém deste grupo pode receber" + (out ? " (" + out + ")" : ""));
    if (!await ask("Enviar mensagem da Flinko", `Vai ser enviada uma mensagem a ${pv.recipients} profissional(is), na conversa com a Flinko (com aviso por notificação e email)${out ? `. Ficam de fora: ${out}` : ""}. As respostas chegam às tuas Mensagens.`, "Enviar a " + pv.recipients)) return;
    const j = await fn("admin-flinko-message", { action: "send", profileIds: ids, message: r.text });
    (D.audit = D.audit || []).unshift({ at: new Date().toISOString(), action: "mensagem_flinko", actor_email: session?.user?.email, summary: `Mensagem da Flinko enviada a ${j.sent} profissional(is)`, details: { sent: j.sentIds || [] } });
    try { for (const id of j.sentIds || []) await logContact({ kind: "pro", id }, { id: "flinko", name: "Mensagem da Flinko" }, "mensagem na Flinko"); } catch (e) { }
    toast(`Mensagem enviada a ${j.sent} profissional(is)`); render();
    // Quem não entra há 14+ dias dificilmente vê a notificação: reforço por WhatsApp.
    const sentSet = new Set(j.sentIds || []);
    const parados = L.filter(p => sentSet.has(p.id) && (!p._last || now() - p._last > 14 * DAY) && flinkoWhatsApp.numero(M.phone[p.id]));
    if (parados.length) waFollowUp(parados, r.text);
  } catch (e) { toast("Erro: " + e.message); }
}
// Reforço por WhatsApp (Click to WhatsApp, sem custos): abre o WhatsApp de cada
// profissional com o aviso já escrito; quem envia és tu, um a um. Nada é
// enviado automaticamente, por isso não há risco de bloqueio do número.
function waFollowUp(L, texto) {
  const fnm = n => String(n || "").trim().split(/\s+/)[0] || "";
  const trecho = t => { t = String(t || "").replace(/\s+/g, " ").trim(); return t.length > 220 ? t.slice(0, 217) + "…" : t; };
  const msgFor = p => `Olá ${fnm(p.name)}! Aqui é a equipa Flinko 👋\n\nDeixámos-te uma mensagem na tua conta:\n«${trecho(String(texto).replace(/\{nome\}/g, fnm(p.name)).replace(/\{categoria\}/g, (p.category || "a tua área").toLowerCase()))}»\n\nVê e responde aqui: https://flinko.pt/messages`;
  const m = $("#modal"); m.classList.remove("hidden");
  m.innerHTML = `<div class="mb" style="max-height:92vh;overflow:auto" role="dialog" aria-label="Reforçar por WhatsApp"><h3 style="font-size:17px;margin-bottom:6px">📲 Reforçar por WhatsApp</h3>
    <p class="mut" style="margin:0 0 12px">${L.length} destes profissionais não entra na Flinko há mais de 14 dias e pode não ver a notificação. Carrega em cada um: o WhatsApp abre com o aviso já escrito e és tu que envias.</p>
    <div id="wafu">${L.map(p => `<div class="row" style="justify-content:space-between;padding:8px 0;border-top:1px solid var(--line,#eee)"><span><b>${esc(p.name)}</b><br><span class="mut">${p._last ? "visto " + ago(new Date(p._last)) : "nunca visto"}</span></span><a class="btn sm" target="_blank" rel="noopener noreferrer" data-pid="${p.id}" href="${esc(flinkoWhatsApp.link(M.phone[p.id], msgFor(p)))}">Abrir WhatsApp</a></div>`).join("")}</div>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn sec" id="wafuok">Fechar</button></div></div>`;
  m.querySelectorAll("#wafu a[data-pid]").forEach(a => a.addEventListener("click", () => {
    a.textContent = "✓ Aberto"; a.classList.add("sec");
    logContact({ kind: "pro", id: a.dataset.pid }, { id: "flinko", name: "Mensagem da Flinko (reforço)" }, "WhatsApp").catch(() => { });
  }));
  $("#wafuok").onclick = () => { m.classList.add("hidden"); m.innerHTML = ""; };
}
const sendGroupMessage = () => sendFlinkoMessage(contactList());

// Envio de email a todo o grupo, pelo servidor (admin-send-campaign). Cada
// pessoa recebe o texto já preenchido com os dados dela ({nome}, {falta}…).
async function sendGroupEmail() {
  const L = contactList(); if (!L.length) return toast("Ninguém neste grupo");
  if (L.length > 500) return toast("No máximo 500 pessoas por envio. Filtra o grupo.");
  const r = await form(`Email para ${L.length} profissional(is)`, [{ k: "subject", label: "Assunto (podes usar {nome})", req: 1 }, { k: "text", label: "Mensagem (usa {nome} {categoria} {falta} {vistas} {conversas} {plano})", type: "textarea", rows: 9, req: 1 }, { k: "kind", label: "Tipo de email", type: "select", opts: [["servico", "Serviço (sobre a conta e o perfil)"], ["promo", "Promocional: só segue para quem consentiu"]] }], { subject: "Flinko · " + tplOf().name, text: curText(), kind: tplOf().promo ? "promo" : "servico" }, "Continuar");
  const promo = r && r.kind === "promo";
  if (!r) return;
  const ids = L.map(p => p.id);
  try {
    const pv = await fn("admin-send-campaign", { action: "preview", profileIds: ids, promo });
    const why = {}; (pv.skipped || []).forEach(x => { why[x.reason] = (why[x.reason] || 0) + 1; });
    const out = Object.entries(why).map(([k, n]) => `${n} ${k}`).join(", ");
    if (!pv.recipients) return toast("Ninguém deste grupo pode receber email" + (out ? " (" + out + ")" : ""));
    if (!await ask("Enviar emails", `Vai ser enviado um email a ${pv.recipients} profissional(is)${out ? `. Ficam de fora: ${out}` : ""}. Só para comunicações sobre a conta e o perfil; promoções precisam de consentimento prévio. Não pode ser desfeito.`, "Enviar " + pv.recipients + " emails")) return;
    const byId = Object.fromEntries(L.map(p => [p.id, p]));
    const messages = {}; ids.forEach(id => { messages[id] = fillTpl(r.text === curText() && !cst.text ? tplText(tplOf(), byId[id]) : r.text, proVars(byId[id])); });
    const j = await fn("admin-send-campaign", { action: "send", profileIds: ids, subject: r.subject, message: r.text, messages, promo });
    D.audit.unshift({ at: new Date().toISOString(), action: "email_massa", actor_email: session?.user?.email, summary: `Email “${r.subject}” enviado a ${j.sent} profissional(is)`, details: { sent: j.sentIds || [] } });
    for (const id of j.sentIds || []) { const c = store.crm[id] || {}; if (!c.stage || c.stage === "novo") await saveCrm(id, { stage: "contactado", next_contact: dkey(now() + 3 * DAY) }).catch(() => { }); }
    toast(`${j.sent} email(s) enviado(s)${j.failed && j.failed.length ? " · " + j.failed.length + " falharam" : ""}`); refreshContact();
  } catch (e) { toast("Erro: " + e.message); }
}

const ALERT_RULES = [["gdpr", "Pedidos RGPD em aberto"], ["regmeio", "Registos a meio (contas sem perfil)"], ["verif", "Pedidos de verificação por tratar"], ["unver", "Profissionais por verificar"], ["nocat", "Profissionais sem categoria"], ["notif", "Notificações que falharam"], ["req", "Pedidos de clientes sem proposta há mais de 24 h"], ["exp", "Subscrições a expirar"], ["ticket", "Apoio fora do prazo (48 h)"], ["den", "Denúncias de perfis por resolver"], ["inv", "Faturas vencidas"], ["task", "Tarefas atrasadas"], ["lead", "Leads por contactar"], ["seg", "Seguimentos para enviar"], ["crm", "Contactos agendados no CRM"], ["reg", "Sem novos registos em 7 dias"]];
function liveAlerts(all) {
  const A = [], t = now(), td = today(), off = new Set((setting("alertrules") || {}).off || []);
  const sn = new Set(items("snooze").filter(s => s.until >= td).map(s => s.key));
  const add = (rule, key, lvl, txt, go) => { if (!off.has(rule)) A.push({ rule, key: rule + ":" + key, lvl, txt, go }); };
  M.gp.forEach(g => { const d = Math.floor((t - new Date(g.created_at)) / DAY); add("gdpr", g.id, d > 20 ? "bad" : "warn", `Pedido RGPD (${g.request_type === "delete" ? "eliminação" : "exportação"}) em aberto há ${d} dias — prazo legal de 30 dias`, "ops"); });
  if (M.vp.length) add("verif", "all", M.vp.some(v => t - new Date(v.created_at) > 3 * DAY) ? "bad" : "warn", `${M.vp.length} pedido(s) de verificação por tratar`, "ops");
  if (D.incompletos && D.incompletos.porConvidar) add("regmeio", "all", "warn", `${D.incompletos.porConvidar} pessoa(s) criaram conta mas o registo ficou a meio (sem perfil, não aparecem no painel)`, "alerts");
  const nv = M.pros.filter(p => !p.verified).length; if (nv) add("unver", "all", "warn", `${nv} profissional(is) por verificar`, "pros");
  const nc = M.pros.filter(p => !p.category).length; if (nc) add("nocat", "all", "warn", `${nc} profissionais sem categoria (invisíveis nas pesquisas)`, "contact");
  const fn_ = D.notif.filter(n => n.status === "failed").length; if (fn_) add("notif", "all", "bad", `${fn_} notificações falharam o envio`, "ops");
  const rq = M.openReq.filter(r => t - new Date(r.created_at) > DAY); if (rq.length) add("req", "all", "bad", `${rq.length} pedido(s) de clientes sem nenhuma proposta há mais de 24 h`, "demand");
  M.activePaid.filter(p => p.plan_expires_at && new Date(p.plan_expires_at) < t + 7 * DAY).forEach(p => { const d = Math.ceil((new Date(p.plan_expires_at) - t) / DAY); add("exp", p.id, d <= 2 ? "bad" : "warn", `Plano ${p.plan} de ${p.name} expira ${d <= 0 ? "hoje" : "em " + d + " dia(s)"}`, "contact"); });
  const tk = items("ticket").filter(x => x.status !== "resolvido" && t - new Date(x.date) > 2 * DAY).length + D.tickets.filter(x => x.kind !== "denuncia" && x.status !== "resolvido" && t - new Date(x.created_at) > 2 * DAY).length; if (tk) add("ticket", "all", "bad", `${tk} pedido(s) de apoio há mais de 48 h sem resolução`, "support");
  const dn = D.tickets.filter(x => x.kind === "denuncia" && x.status !== "resolvido"); if (dn.length) add("den", "all", dn.some(x => t - new Date(x.created_at) > 2 * DAY) ? "bad" : "warn", `${dn.length} denúncia(s) de perfis por resolver`, "mod");
  const iv = items("invoice").filter(i => i.status === "emitida" && i.due && i.due < td); if (iv.length) add("inv", "all", "bad", `${iv.length} fatura(s) vencida(s) por cobrar`, "invoices");
  const tt = store.tasks.filter(x => x.status !== "done" && x.due_date && new Date(x.due_date) < t - DAY); if (tt.length) add("task", "all", "warn", `${tt.length} tarefa(s) atrasada(s)`, "tasks");
  const ld = leadsDue().length; if (ld) add("lead", "all", "warn", `${ld} lead(s) para contactar hoje ou em atraso`, "leads");
  const sg = followupsDue().length; if (sg) add("seg", "all", "warn", `${sg} seguimento(s) para enviar hoje`, "leads");
  const cr = Object.values(store.crm).filter(c => c.next_contact && String(c.next_contact).slice(0, 10) <= td && !["ativo", "inativo"].includes(c.stage) && D.profiles.some(p => p.id === c.profile_id)); if (cr.length) add("crm", "all", "warn", `${cr.length} profissional(is) com contacto agendado para hoje ou em atraso`, "contact");
  if (M.pros.length && !M.su7) add("reg", "all", "warn", "Nenhum registo novo nos últimos 7 dias", "growth");
  return all ? A : A.filter(a => !sn.has(a.key));
}
const alertRow = a => `<div class="sug"><span class="pill ${a.lvl}">${a.lvl === "bad" ? "urgente" : "atenção"}</span><span class="t">${esc(a.txt)}</span><button class="btn sec sm" onclick="go('${a.go}')">Ver</button><button class="btn sec sm" title="Esconder durante 7 dias" onclick="snoozeAlert('${esc(a.key)}')">Adiar 7 dias</button></div>`;
async function snoozeAlert(key) { await saveItem("snooze", { key, until: dkey(now() + 7 * DAY) }); render(); }
async function toggleRule(id, on) { const cur = new Set((setting("alertrules") || {}).off || []); on ? cur.delete(id) : cur.add(id); await saveSetting("alertrules", { off: [...cur] }); render(); }
// Registos a meio: lista e convite para acabarem o registo (admin-registos-a-meio).
function incompletosCard() {
  const I = D.incompletos; if (!I || !I.total) return "";
  return `<div class="card" style="margin-top:14px" id="incompletosCard"><h3>🧩 Registos a meio (${I.total}) <span class="sp"></span>${I.porConvidar ? `<button class="btn sm" onclick="convidarIncompletos()">Enviar convite a ${I.porConvidar}</button>` : ""}</h3>
    <p class="mut" style="margin:0 0 8px">Criaram conta e confirmaram o email, mas nunca ficaram com perfil (falha no registo, já corrigida). Ao voltarem a entrar, a página pergunta se querem contratar ou oferecer serviços e cria o perfil.</p>
    <div class="tw"><table><tr><th>Conta criada</th><th>Email</th><th>Entrou com</th><th>Convite</th></tr>${I.contas.map(c => `<tr><td>${fdate(c.criada)}</td><td>${esc(c.email)}</td><td>${c.via === "google" ? "Google" : "email"}</td><td class="mut">${c.convidado ? "enviado " + fdate(c.convidado) : "por enviar"}</td></tr>`).join("")}</table></div></div>`;
}
async function convidarIncompletos() {
  const I = D.incompletos; if (!I || !I.porConvidar) return;
  const ex = I.exemplo || {};
  if (!await ask("Enviar convite para acabar o registo", `Vai ser enviado um email a ${I.porConvidar} pessoa(s):\n\nAssunto: ${ex.assunto || ""}\n\n${ex.texto || ""}`, "Enviar " + I.porConvidar + " email(s)")) return;
  try {
    const j = await fn("admin-registos-a-meio", { action: "send" });
    toast(`Convite enviado a ${j.sent} pessoa(s)${j.failed ? " · " + j.failed + " falharam" : ""}`);
    D.incompletos = await fn("admin-registos-a-meio", { action: "preview" }).catch(() => D.incompletos);
    compute(); render();
  } catch (e) { toast("Erro: " + e.message); }
}
const vAlerts = () => {
  const A = liveAlerts(), bad = A.filter(a => a.lvl === "bad"), warn = A.filter(a => a.lvl !== "bad"), off = new Set((setting("alertrules") || {}).off || []);

    <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Que avisos queres receber?</h3>${ALERT_RULES.map(([k, l]) => `<label style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)"><input type="checkbox" style="width:auto" ${off.has(k) ? "" : "checked"} onchange="toggleRule('${k}',this.checked)"> ${esc(l)}</label>`).join("")}</div>

/* ============ GRÁFICOS (SVG simples, sem bibliotecas) ============ */
const COL = ["#f26a1b", "#2563eb", "#0d9488", "#7c3aed", "#d97706"];
const niceMax = m => m <= 4 ? 4 : Math.ceil(m / 4) * 4;
function axes(w, h, p, max, labels) {
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, y = h - p.b - (v / max) * (h - p.t - p.b); g += `<line x1="${p.l}" x2="${w - p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l - 6}" y="${y + 3}" text-anchor="end">${Math.round(v * 10) / 10}</text>`; }
  const step = Math.max(1, Math.ceil(labels.length / 7));
  labels.forEach((l, i) => { if (i % step === 0 || i === labels.length - 1) { const x = p.l + (labels.length > 1 ? i * (w - p.l - p.r) / (labels.length - 1) : 0); g += `<text x="${x}" y="${h - 6}" text-anchor="middle">${esc(l)}</text>`; } });
  return g;
}
function lineChart(series, o = {}) {
  const w = 700, h = o.h || 210, p = { l: 34, r: 12, t: 10, b: 24 }, n = series[0].data.length;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.data.map(d => d.y))));
  const X = i => p.l + (n > 1 ? i * (w - p.l - p.r) / (n - 1) : 0), Y = v => h - p.b - (v / max) * (h - p.t - p.b);
  const lab = series[0].data.map(d => o.fmtX ? o.fmtX(d.x) : d.x);
  let s = axes(w, h, p, max, lab);
  series.forEach((sr, k) => {
    const c = sr.color || COL[k], pts = sr.data.map((d, i) => `${X(i)},${Y(d.y)}`).join(" ");
    if (o.area && k === 0) s += `<polygon points="${p.l},${h - p.b} ${pts} ${X(n - 1)},${h - p.b}" fill="${c}" opacity=".12"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>`;
    if (n <= 31) sr.data.forEach((d, i) => { s += `<circle cx="${X(i)}" cy="${Y(d.y)}" r="3" fill="${c}"><title>${esc(lab[i])}: ${d.y} ${esc(sr.name)}</title></circle>`; });
  });
  const lg = series.length > 1 ? `<div class="legend">${series.map((s, k) => `<span><i style="background:${s.color || COL[k]}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${s}</svg>${lg}`;
}
function barChart(series, o = {}) { // barras empilhadas
  const w = 700, h = o.h || 210, p = { l: 34, r: 12, t: 10, b: 24 }, n = series[0].data.length;
  const tot = series[0].data.map((_, i) => series.reduce((s, sr) => s + sr.data[i].y, 0));
  const max = niceMax(Math.max(1, ...tot)), bw = (w - p.l - p.r) / n * .62, X = i => p.l + (i + .5) * (w - p.l - p.r) / n;
  const lab = series[0].data.map(d => d.x);
  let s = axes(w, h, p, max, lab).replace(/<text x="[\d.]+" y="\d+" text-anchor="middle">[^<]*<\/text>/g, "");
  lab.forEach((l, i) => { if (i % Math.max(1, Math.ceil(n / 8)) === 0 || i === n - 1) s += `<text x="${X(i)}" y="${h - 6}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach((sr, k) => sr.data.forEach((d, i) => {
    const below = series.slice(0, k).reduce((a, q) => a + q.data[i].y, 0), y0 = h - p.b - below / max * (h - p.t - p.b), hh = d.y / max * (h - p.t - p.b);
    if (d.y) s += `<rect x="${X(i) - bw / 2}" y="${y0 - hh}" width="${bw}" height="${hh}" rx="3" fill="${sr.color || COL[k]}"><title>${esc(lab[i])}: ${d.y} ${esc(sr.name)}</title></rect>`;
  }));
  const lg = series.length > 1 ? `<div class="legend">${series.map((s, k) => `<span><i style="background:${s.color || COL[k]}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${s}</svg>${lg}`;
}
const delta = (a, b) => { if (!b && !a) return `<span class="d">sem alteração</span>`; if (!b) return `<span class="d up">▲ novo</span>`; const p = Math.round((a - b) / b * 100); if (!p) return `<span class="d">igual aos 7 dias anteriores</span>`; return `<span class="d ${p >= 0 ? "up" : "dn"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p)}% vs 7 dias anteriores</span>`; };
const kpi = (lb, v, d = "") => `<div class="card kpi"><div class="lb">${lb}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
const bar = (v, max, cls = "") => `<div class="bar ${cls}"><i style="width:${Math.min(100, max ? v / max * 100 : 0)}%"></i></div>`;
const sc = s => s >= 80 ? "ok" : s >= 50 ? "warn" : "bad";

function ask(title, msg, okLabel = "Confirmar", danger = false) {
  return new Promise(res => {
    const m = $("#modal"); m.classList.remove("hidden");
    m.innerHTML = `<div class="mb"><h3 style="font-size:17px;margin-bottom:8px">${esc(title)}</h3><p class="mut" style="margin:0 0 18px;white-space:pre-line;max-height:60vh;overflow:auto">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn sec" id="mno">Cancelar</button><button class="btn ${danger ? "bad" : ""}" id="myes">${esc(okLabel)}</button></div></div>`;
    const done = v => { m.classList.add("hidden"); m.innerHTML = ""; res(v); };
    $("#mno").onclick = () => done(false); $("#myes").onclick = () => done(true);
  });
}

}

const STAGES = { novo: "Novo", contactado: "Contactado", a_completar: "A completar perfil", ativo: "Ativo", inativo: "Inativo" };
const stageOf = p => (store.crm[p.id]?.stage) || "novo";
function proList() {
  let L = M.pros.slice(); const q = filt.q.toLowerCase();
  if (q) L = L.filter(p => (p.name + " " + p.category + " " + p.location + " " + p._phone).toLowerCase().includes(q));
  if (filt.cat) L = L.filter(p => (p.category || "—") === filt.cat);
  if (filt.stage) L = L.filter(p => stageOf(p) === filt.stage);
  const st = filt.st;
  if (st === "unver") L = L.filter(p => !p.verified); else if (st === "ver") L = L.filter(p => p.verified);
  else if (st === "nocat") L = L.filter(p => !p.category); else if (st === "low") L = L.filter(p => p._score < 60);
  else if (st === "susp") L = L.filter(p => p.suspended); else if (st === "paid") L = L.filter(p => p.plan !== "free");
  const s = filt.sort;
  L.sort((a, b) => s === "score" ? a._score - b._score : s === "views" ? b._views - a._views : s === "name" ? a.name.localeCompare(b.name) : new Date(b.created_at) - new Date(a.created_at));
  return L;
}

async function patchProfile(id, body) {
  if (DEMO) { Object.assign(D.profiles.find(p => p.id === id), body); return; }
  await api("profiles?id=eq." + id, { method: "PATCH", body, headers: { Prefer: "return=minimal" } });
  Object.assign(D.profiles.find(p => p.id === id), body);
}
async function toggleVerify(id) {
  const p = D.profiles.find(x => x.id === id), nv = !p.verified;
  if (!await ask(nv ? "Verificar profissional" : "Remover verificação", `${p.name} ${nv ? "passa a aparecer como verificado no Flinko." : "deixa de aparecer como verificado."}`)) return;

    // Pela função do servidor: ao verificar, fecha também os pedidos de verificação pendentes deste perfil.
    if (DEMO) Object.assign(p, { verified: nv }); else { await rpc("admin_set_verified", { p_profile: id, p_value: nv }); p.verified = nv; if (nv) D.verif.forEach(v => { if (v.profile_id === id && v.status === "pending") v.status = "approved"; }); }

  } catch (e) { toast("Erro: " + e.message); }
}
async function toggleSuspend(id) {

function projection() {
  const pj = Object.assign({}, DEFAULTS.proj, setting("proj")), costs = setting("costs").reduce((s, c) => s + (+c.amount || 0), 0);
  let pros = M.pros.length, paying = M.activePaid.length, cum = 0; const rows = [];
  for (let m = 1; m <= 12; m++) {
    const add = pj.newPros * Math.pow(1 + pj.growth / 100, m - 1);
    pros += add; paying += add * pj.conv / 100;
    const rev = paying * pj.avgPrice, net = rev - costs; cum += net;
    rows.push({ m, pros: Math.round(pros), paying: Math.round(paying * 10) / 10, rev, net, cum });
  }
  return { pj, costs, rows };
}

/* ============ MODERAÇÃO ============ */
const BADWORDS = /(fuder|foder|merda|puta|caralho|porra|cabr[aã]o|idiota|burro|estúpido|estupido|filho da|vigarist|burl[aã])/i;
function reviewFlags(r) {
  const f = [], txt = (r.comment || "").trim();
  if (BADWORDS.test(txt) || BADWORDS.test(r.reviewer_name || "")) f.push("linguagem ofensiva ou acusação");
  if (/(https?:\/\/|www\.)/i.test(txt)) f.push("contém ligação");
  if (r.client_id && r.client_id === r.professional_id) f.push("avaliou-se a si próprio");
  if (r.client_id && D.reviews.filter(x => x.client_id === r.client_id && x.professional_id === r.professional_id).length > 1) f.push("mesmo cliente várias vezes");
  if (!r.client_id && D.reviews.filter(x => !x.client_id && x.professional_id === r.professional_id && (x.reviewer_name || "").trim().toLowerCase() === (r.reviewer_name || "").trim().toLowerCase()).length > 1) f.push("mesmo nome várias vezes");
  if (r.rating <= 2) f.push(r.rating + "★");
  return f;
}

  try { if (!DEMO) await api("reviews?id=eq." + id, { method: "DELETE", headers: { Prefer: "return=minimal" } }); D.reviews = D.reviews.filter(x => x.id !== id); compute(); render(); toast("Avaliação apagada"); }

/* ============ OPERAÇÕES: verificações e RGPD ============ */
const VST = { pending: ["Pendente", "warn"], approved: ["Aprovado", "ok"], rejected: ["Rejeitado", "bad"], cancelled: ["Cancelado", ""] };
const GST = { pending: ["Pendente", "warn"], in_progress: ["Em tratamento", "warn"], completed: ["Concluído", "ok"], cancelled: ["Cancelado", ""] };
let opsVerif = "pending", opsGdpr = "open";
async function rpc(name, body) { return api("rpc/" + name, { method: "POST", body }); }
async function viewDoc(path) {
  try {
    if (DEMO) return toast("Modo demonstração: sem documentos reais");
    const call = () => fetch(SB_URL + "/storage/v1/object/sign/verification-docs/" + String(path).split("/").map(encodeURIComponent).join("/"), { method: "POST", headers: { apikey: SB_KEY, Authorization: "Bearer " + session.access_token, "Content-Type": "application/json" }, body: JSON.stringify({ expiresIn: 300 }) });
    let r = await call(); if (r.status === 401) { await refresh(); r = await call(); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !(j.signedURL || j.signedUrl)) throw new Error(j.message || j.error || "Erro " + r.status);
    window.open(SB_URL + "/storage/v1" + (j.signedURL || j.signedUrl), "_blank", "noopener");
  } catch (e) { toast("Não foi possível abrir o documento: " + e.message); }
}
async function resolveVerif(id, approve) {
  const v = D.verif.find(x => x.id === id); if (!v) return;
  const r = await form(approve ? "Aprovar verificação" : "Rejeitar verificação", [{ k: "note", label: approve ? "Nota interna (opcional)" : "Motivo (fica guardado; diz-lho também por mensagem)", type: "textarea", req: !approve }], {}, approve ? "Aprovar e marcar verificado" : "Rejeitar");
  if (!r) return;
  try {
    if (DEMO) { v.status = approve ? "approved" : "rejected"; if (approve) Object.assign(D.profiles.find(p => p.id === v.profile_id) || {}, { verified: true }); compute(); render(); }
    else { await rpc("admin_resolve_verification", { p_request: id, p_approve: approve, p_note: r.note || null }); await reload(); }
    toast(approve ? "Verificação aprovada" : "Pedido rejeitado");
  } catch (e) { toast("Erro: " + e.message); }
}
async function setGdpr(id, st) {
  const g = D.gdpr.find(x => x.id === id); if (!g || g.status === st) return;
  try {
    const body = { status: st, resolved_at: st === "completed" || st === "cancelled" ? new Date().toISOString() : null };
    if (!DEMO) await api("gdpr_requests?id=eq." + id, { method: "PATCH", body, headers: { Prefer: "return=minimal" } });
    Object.assign(g, body); compute(); render(); toast("Estado atualizado");
  } catch (e) { toast("Erro: " + e.message); render(); }
}
const download = (name, text, type = "application/json") => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); };
const slugName = n => String(n || "conta").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
async function gdprExport(id) {
  const g = D.gdpr.find(x => x.id === id);
  try {
    toast("A reunir os dados…");
    const j = await fn("admin-gdpr", { action: "export", requestId: id });
    download("flinko-dados-" + slugName(nameOf(g.profile_id)) + "-" + today() + ".json", JSON.stringify(j, null, 2));
    if (g.status === "pending") await setGdpr(id, "in_progress");
    toast("Ficheiro descarregado. Envia-o à pessoa por um canal seguro e marca o pedido como concluído.");
  } catch (e) { toast("Erro: " + e.message); }
}
async function gdprDelete(id) {
  const g = D.gdpr.find(x => x.id === id), nm = nameOf(g.profile_id);
  const r = await form("Apagar conta (pedido RGPD)", [{ k: "name", label: `Isto apaga a conta de ${nm} e todos os dados: perfil, serviços, portfólio, mensagens, pedidos e ficheiros. Cancela a subscrição Stripe, se houver. Não pode ser desfeito. Para confirmar, escreve o nome da conta exatamente assim: ${nm}`, req: 1 }], {}, "Apagar conta");
  if (!r) return;
  if (r.name.trim() !== nm.trim()) return toast("O nome não coincide. Nada foi apagado.");
  try {
    const j = await fn("admin-gdpr", { action: "delete", requestId: id, confirmName: r.name.trim() });
    toast(`Conta apagada${j.filesRemoved ? " · " + j.filesRemoved + " ficheiro(s)" : ""}${j.stripeCancelled ? " · subscrição Stripe cancelada" : ""}. Confirma por escrito à pessoa.`);
    await reload();
  } catch (e) { toast("Erro: " + e.message); }
}
const vOps = () => {
  const days = g => Math.floor((now() - new Date(g.created_at)) / DAY), nq = s => D.notif.filter(n => n.status === s).length;
  const VL = D.verif.filter(v => opsVerif === "all" || v.status === opsVerif), GL = D.gdpr.filter(g => opsGdpr === "all" || (opsGdpr === "open" ? ["pending", "in_progress"].includes(g.status) : g.status === opsGdpr));
  const docs = v => (Array.isArray(v.documents) ? v.documents : []).map((d, i) => `<button class="btn sec sm" data-path="${esc(d.path)}" onclick="viewDoc(this.dataset.path)">📄 ${esc(d.name || "Documento " + (i + 1))}</button>`).join(" ") || `<span class="mut">sem documentos</span>`;
  return head("Operações", "Verificações, RGPD, notificações e saúde dos dados") +
    `<div class="grid g4">${kpi("Verificações pendentes", M.vp.length, `${D.verif.length} pedidos no total`)}${kpi("RGPD em aberto", M.gp.length, "prazo legal: 30 dias")}${kpi("Notificações enviadas", nq("sent"), `${nq("failed")} falharam · ${nq("pending")} pendentes`)}${kpi("Subscrições push", D.push.length, `${D.saved.length} favoritos · ${D.referrals.length} convites`)}</div>
    <div class="card" style="margin-top:14px" id="verifCard"><h3>Pedidos de verificação <span class="sp"></span><select style="width:auto" onchange="opsVerif=this.value;render()">${[["pending", "Pendentes"], ["approved", "Aprovados"], ["rejected", "Rejeitados"], ["all", "Todos"]].map(o => `<option value="${o[0]}" ${opsVerif === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}</select></h3>
      <div class="tw"><table><tr><th>Profissional</th><th>Pedido</th><th>Documentos</th><th>Notas</th><th>Estado</th><th></th></tr>${VL.map(v => { const p = D.profiles.find(x => x.id === v.profile_id); return `<tr><td><b>${esc(nameOf(v.profile_id))}</b>${p ? `<br><span class="mut">${esc(p.category || "sem categoria")} · perfil ${p._score ?? "—"}/100</span>` : ""}</td><td class="mut">${fdate(v.created_at)}<br>${v.status === "pending" ? `<span class="${days(v) > 3 ? "dn" : ""}">há ${days(v)} dias</span>` : "resolvido " + fdate(v.resolved_at)}</td><td>${docs(v)}</td><td>${esc(v.notes || "—")}${v.admin_notes ? `<br><span class="mut">Admin: ${esc(v.admin_notes)}</span>` : ""}</td><td><span class="pill ${(VST[v.status] || [])[1] || ""}">${esc((VST[v.status] || [v.status])[0])}</span></td><td style="white-space:nowrap">${v.status === "pending" ? `<button class="btn sm" onclick="resolveVerif('${v.id}',true)">Aprovar</button> <button class="btn sec sm" onclick="resolveVerif('${v.id}',false)">Rejeitar</button>` : ""} ${p ? `<button class="btn sec sm" onclick="openPro('${p.id}')">Ficha</button>` : ""}</td></tr>`; }).join("") || `<tr><td colspan="6" class="mut">Sem pedidos neste estado.</td></tr>`}</table></div>
      <p class="mut" style="margin:10px 0 0">Aprovar marca o perfil como verificado e fecha o pedido. Os documentos abrem num link temporário (5 minutos).</p></div>
    <div class="card" style="margin-top:14px" id="gdprCard"><h3>Pedidos RGPD <span class="sp"></span><select style="width:auto" onchange="opsGdpr=this.value;render()">${[["open", "Em aberto"], ["completed", "Concluídos"], ["cancelled", "Cancelados"], ["all", "Todos"]].map(o => `<option value="${o[0]}" ${opsGdpr === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}</select></h3>
      <div class="tw"><table><tr><th>Conta</th><th>Tipo</th><th>Pedido</th><th>Prazo</th><th>Estado</th><th></th></tr>${GL.map(g => { const open = ["pending", "in_progress"].includes(g.status), left = 30 - days(g); return `<tr><td><b>${esc(nameOf(g.profile_id))}</b>${g.notes ? `<br><span class="mut">${esc(g.notes)}</span>` : ""}</td><td>${g.request_type === "delete" ? "Eliminação" : "Exportação"}</td><td class="mut">${fdate(g.created_at)}</td><td class="${open && left <= 10 ? "dn" : ""}">${open ? (left >= 0 ? left + " dias restantes" : "atrasado " + -left + " dias") : "—"}</td><td><select style="width:auto" onchange="setGdpr('${g.id}',this.value)">${Object.entries(GST).map(([k, v]) => `<option value="${k}" ${g.status === k ? "selected" : ""}>${v[0]}</option>`).join("")}</select></td><td style="white-space:nowrap">${isOwner() ? `<button class="btn sec sm" onclick="gdprExport('${g.id}')">⬇ Exportar dados</button>${g.request_type === "delete" && open ? ` <button class="btn bad sm" onclick="gdprDelete('${g.id}')">Apagar conta</button>` : ""}` : ownerOnly("Exportar e apagar")}</td></tr>`; }).join("") || `<tr><td colspan="6" class="mut">Sem pedidos neste estado.</td></tr>`}</table></div>
      <p class="mut" style="margin:10px 0 0">Exportação: descarrega um ficheiro com todos os dados da conta para enviares à pessoa. Eliminação: apaga a conta de facto; o pedido desaparece com ela, mas fica em “Registo de ações”. O processo passo a passo está em Contactos e processos.</p></div>
    <div class="card" style="margin-top:14px"><h3>Saúde da ligação aos dados</h3>${LOADERR.length ? LOADERR.map(e => `<div class="sug"><span class="pill bad">erro</span><span class="t">${esc(e)}</span></div>`).join("") : `<span class="pill ok">Todas as tabelas carregaram sem erros</span>`}</div>`;
};
const MIGRATION = `-- Tabelas privadas do painel de gestão (só administradores têm acesso)
create table if not exists public.admin_tasks (
  id uuid primary key default gen_random_uuid(),
  title text not null,
  status text not null default 'todo' check (status in ('todo','doing','done')),
  priority text default 'media',
  due_date date,
  profile_id uuid references public.profiles(id) on delete set null,
  created_at timestamptz not null default now()
);
create table if not exists public.admin_crm (
  profile_id uuid primary key references public.profiles(id) on delete cascade,
  stage text not null default 'novo',
  notes text default '',
  next_contact date,
  updated_at timestamptz default now()
);
create table if not exists public.admin_settings (
  key text primary key,
  value jsonb not null
);
create table if not exists public.admin_items (
  id uuid primary key default gen_random_uuid(),
  kind text not null,
  data jsonb not null default '{}'::jsonb,
  created_at timestamptz not null default now()
);
create index if not exists admin_items_kind_idx on public.admin_items(kind);
alter table public.admin_items enable row level security;
create policy admin_items_all on public.admin_items for all using (is_admin()) with check (is_admin());
alter table public.admin_tasks enable row level security;
alter table public.admin_crm enable row level security;
alter table public.admin_settings enable row level security;
create policy admin_tasks_all on public.admin_tasks for all using (is_admin()) with check (is_admin());
create policy admin_crm_all on public.admin_crm for all using (is_admin()) with check (is_admin());
create policy admin_settings_all on public.admin_settings for all using (is_admin()) with check (is_admin());`;
/* ============ EQUIPA (quem tem acesso ao painel) ============ */
let TEAM = null;
async function loadTeam() {
  try { TEAM = DEMO ? [{ name: "Admin", email: "demo@exemplo.pt", admin_role: "owner" }] : await rpc("admin_team", {}); }
  catch (e) { TEAM = { err: missing(e) ? "A gestão da equipa precisa da migração painel_gestao_completo no Supabase." : e.message }; }
  if (view === "set") render();
}
const ROLEL = { owner: "Dono (tudo)", support: "Apoio (sem dinheiro nem permissões)" };
async function setRole(email, role) {
  const msg = role === "none" ? `${email} deixa de ter acesso ao painel.` : `${email} passa a ${ROLEL[role]}.`;
  if (!await ask("Alterar acesso ao painel", msg, "Confirmar", role === "none")) return;
  try { if (!DEMO) await rpc("admin_set_role", { p_email: email, p_role: role }); TEAM = null; toast("Acesso atualizado"); loadTeam(); }
  catch (e) { toast("Erro: " + e.message); }
}
async function addMember() {
  const r = await form("Dar acesso ao painel", [{ k: "email", label: "Email da conta Flinko da pessoa (tem de estar registada)", type: "email", req: 1 }, { k: "role", label: "Nível de acesso", type: "select", opts: [["support", ROLEL.support], ["owner", ROLEL.owner]] }], { role: "support" }, "Dar acesso");
  if (r) await setRole(r.email.trim(), r.role);
}
function teamCard() {
  const body = !TEAM ? `<span class="mut">A carregar…</span>` : TEAM.err ? `<span class="pill warn">${esc(TEAM.err)}</span>` :
    `<div class="tw"><table><tr><th>Pessoa</th><th>Acesso</th><th></th></tr>${TEAM.map(m => `<tr><td><b>${esc(m.name || "—")}</b><br><span class="mut">${esc(m.email || "")}</span></td><td>${isOwner() && !DEMO ? `<select style="width:auto" onchange="setRole('${esc(m.email)}',this.value)">${Object.entries(ROLEL).map(([k, v]) => `<option value="${k}" ${m.admin_role === k ? "selected" : ""}>${v}</option>`).join("")}</select>` : esc(ROLEL[m.admin_role] || m.admin_role)}</td><td>${isOwner() && !DEMO ? `<button class="btn sec sm" onclick="setRole('${esc(m.email)}','none')">Tirar acesso</button>` : ""}</td></tr>`).join("")}</table></div>`;
  return `<div class="card" style="margin-top:14px" id="teamCard"><h3>👥 Equipa com acesso ao painel <span class="sp"></span>${isOwner() && !DEMO ? `<button class="btn sm" onclick="addMember()">+ Dar acesso</button>` : ""}</h3>${body}
    <p class="mut" style="margin:10px 0 0"><b>Dono</b>: tudo, incluindo planos, reembolsos, receita do Stripe, RGPD, emails em grupo e esta lista. <b>Apoio</b>: vê o painel e trata verificações, moderação e pedidos de apoio, mas não mexe em dinheiro nem em permissões (a base de dados bloqueia-o, não é só o botão escondido). Tem de ficar sempre pelo menos um dono.</p></div>`;
}

const vSet = () => {
  const g = setting("goals");
  if (!TEAM) setTimeout(loadTeam, 0);
  return head("Definições", "Metas, armazenamento e ligação") +
    `<div class="grid g2"><div class="card"><h3>Metas</h3><div class="grid g3">${[["pros", "Profissionais"], ["clients", "Clientes"], ["reviews", "Avaliações"], ["mrr", "MRR (€)"]].map(([k, l]) => `<div><label class="f">${l}</label><input type="number" min="0" value="${g[k]}" onchange="setGoal('${k}',this.value)"></div>`).join("")}</div></div>
    <div class="card"><h3>Armazenamento de tarefas, CRM e definições</h3>${store.cloud ? `<span class="pill ok">Sincronizado no Supabase</span><p class="mut">Tarefas, notas e definições ficam guardadas na base de dados e ficam iguais em qualquer computador.</p>` : `${store.broken ? `<span class="pill bad">Sem ligação</span><p class="mut">Não foi possível ler as tabelas do painel: ${esc(store.broken)}. As alterações estão bloqueadas até voltar a ligação.</p>` : `<span class="pill warn">Só neste navegador</span>`}<p class="mut">As tabelas <code>admin_tasks</code>, <code>admin_crm</code>, <code>admin_settings</code> e <code>admin_items</code> não existem no Supabase, por isso o que fizeres fica guardado apenas neste navegador. Aplica a migração <code>supabase/migrations/20260924150000_painel_gestao_completo.sql</code> ou executa este SQL no Supabase (SQL Editor):</p><textarea readonly rows="10" onclick="this.select()" style="font:12px monospace">${esc(MIGRATION)}</textarea>`}</div></div>
    ${teamCard()}
    <div class="card" style="margin-top:14px"><h3>Como são calculados os números</h3><ul style="margin:0;padding-left:18px;line-height:1.8"><li><b>Contas reais</b>: todas as contas menos as de administrador e demo. As tuas visitas (com sessão iniciada) também são excluídas do tráfego.</li><li><b>Qualidade do perfil</b> (0–100): categoria 15, bio 15, foto 15, serviço 15, localização 10, portfólio 10, verificado 10, capa 5, telemóvel 5.</li><li><b>MRR</b>: nº de profissionais com plano pago e não expirado × preço do plano que defines em Finanças.</li><li><b>Funil</b>: cada passo conta profissionais que cumprem esse critério (não é obrigatório cumprir o anterior).</li><li><b>Nota global</b>: média de seis notas de 0 a 100 (ativação, retenção, procura, confiança, receita e operação). É um indicador de conjunto, não uma métrica oficial.</li><li><b>Histórico</b>: os totais são reconstruídos pelas datas de criação; MRR, caixa, leads e atividade só existem a partir do dia em que o painel começou a guardar fotografias diárias.</li><li><b>Projeção</b>: novos profissionais por mês, com crescimento composto, × conversão para pago × preço médio − custos.</li></ul></div>`;
};
const setGoal = (k, v) => { const g = Object.assign({}, setting("goals")); g[k] = +v || 0; saveSetting("goals", g); };

/* ============ NAVEGAÇÃO / ARRANQUE ============ */
const VIEWS = { alerts: vAlerts, contact: vContact, playbook: vPlaybook, cal: vCal, history: vHistory, marketing: vMarketing, support: vSupport, invoices: vInvoices, company: vCompany, investor: vInvestor, home: vHome, growth: vGrowth, leads: vLeads, pros: vPros, retention: vRetention, demand: vDemand, quality: vQuality, fin: vFin, strategy: vStrategy, compliance: vCompliance, tasks: vTasks, reports: vReports, ops: vOps, set: vSet, mod: vMod, clients: vClients, audit: vAudit };
function badgeOf(k) {
  if (k === "alerts") return liveAlerts().length;
  if (k === "ops") return M.gp.length + M.vp.length;
  if (k === "leads") return leadsDue().length;
  if (k === "quality") return M.flags.length;
  if (k === "tasks") return store.tasks.filter(t => t.status !== "done" && t.due_date && new Date(t.due_date) < now() - DAY).length;
  if (k === "support") return items("ticket").filter(t => t.status !== "resolvido" && now() - new Date(t.date) > 2 * DAY).length + D.tickets.filter(t => t.kind !== "denuncia" && t.status !== "resolvido").length;
  if (k === "mod") return D.tickets.filter(t => t.kind === "denuncia" && t.status !== "resolvido").length;
  if (k === "invoices") return items("invoice").filter(i => i.status === "emitida" && i.due && i.due < today()).length;
  return 0;
}
function render() {
  $("#nav").innerHTML = NAVG.map(([g, L]) => `<div class="ng">${g}</div>` + L.map(([k, ic, l]) => { const b = badgeOf(k); return `<button class="nv ${view === k ? "on" : ""}" onclick="go('${k}')"><span class="ic">${ic}</span>${l}${b ? `<span class="bd">${b}</span>` : ""}</button>`; }).join("")).join("");
  $("#main").innerHTML = VIEWS[view]();
  const na = liveAlerts().length; document.title = (na ? "(" + na + ") " : "") + "Flinko · Gestão";
}
function go(v) { view = v; $("#side").classList.remove("open"); closeDrawer(); render(); scrollTo(0, 0); }
async function reload() { try { await loadAll(); render(); toast("Dados atualizados"); } catch (e) { toast("Erro: " + e.message); } }
async function start() {
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#main").innerHTML = `<p class="mut">A carregar dados…</p>`;
  $("#whoami").textContent = DEMO ? "Demonstração" : (session.user?.email || "") + (ROLE === "support" ? " · apoio" : " · dono");
  await loadAll(); render();
  const u = liveAlerts().filter(a => a.lvl === "bad").length; if (u) toast(u + " aviso(s) urgente(s) — vê “Avisos”");
}
// Lê is_admin e o papel (dono/apoio) do próprio perfil (na tabela não são
// legíveis). Sem admin_role conta como dono.
async function whoAmI() {
  const me = (await rpc("get_my_profile", {}))[0];
  ROLE = me?.admin_role || "owner";
  return me;
}
$("#lf").onsubmit = async e => {
  e.preventDefault(); $("#lerr").textContent = "";
  try {
    const j = await authFetch("token?grant_type=password", { email: $("#em").value.trim(), password: $("#pw").value });
    session = { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user }; ls.set("fk_session", session);
    const me = await whoAmI();
    if (!me?.is_admin) { session = null; ls.set("fk_session", null); throw new Error("Esta conta não tem permissões de administrador."); }
    $("#pw").value = ""; await start();
  } catch (err) { $("#lerr").textContent = err.message; }
};
$("#logout").onclick = () => { session = null; ls.set("fk_session", null); location.reload(); };
(async () => {
  if (session?.access_token) { try { const me = await whoAmI(); if (me?.is_admin) return start(); } catch (e) { } }
})();
</script>
</body>
