<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Mensagens – Flinko</title>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#132420"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>
<script src="/assets/pwa.js" defer></script>
<script src="/assets/push-optin.js"></script>
<script src="/assets/cookie-consent.js" defer></script>
<style>
/* ============================================================
   Mensagens da Flinko: lista de conversas + conversa, ao estilo
   das apps de chat (fotos, responder, reações, visto, a escrever).
   ============================================================ */
:root{
  --dark:#132420;--dark-2:#19352C;--dark-3:#1F4538;
  --orange:#E8720A;--orange-dark:#B85608;--mint:#0F8B5F;--mint-l:#7FE3B3;
  --ink:#132420;--muted:#5E6B66;--line:#E3ECE7;--tint:#F3FBF6;--bg:#EEF3F0;--white:#fff;--red:#C0362C;
  --mine:#1F4538;--theirs:#fff;
  --r:18px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- estrutura ---------- */
.app{display:flex;height:100vh;height:100dvh;max-width:1400px;margin:0 auto;background:var(--white);box-shadow:0 0 0 1px var(--line)}
.side{width:380px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--white);min-width:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;background:var(--bg)}
@media (max-width:860px){
  .app{box-shadow:none}
  .side{width:100%;border-right:none}
  .main{position:fixed;inset:0;z-index:20;transform:translateX(100%);transition:transform .25s ease;visibility:hidden}
  body.view-chat .main{transform:none;visibility:visible}
}

/* ---------- barra de cima da lista ---------- */
.side-top{padding:14px 16px 10px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.logo span{color:var(--orange)}
.side-top h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.25rem;font-weight:800;flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);transition:background .15s}
.icon-btn:hover{background:var(--tint)}
.search{margin:0 16px 8px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:12px;border:none;background:var(--bg);font:inherit;font-size:.92rem;outline:none}
.search input:focus{box-shadow:0 0 0 2px var(--mint) inset;background:#fff}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}

/* ---------- lista de conversas ---------- */
.conv-list{flex:1;overflow-y:auto;overscroll-behavior:contain}
.conv{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;text-align:left;position:relative}
.conv:hover{background:var(--tint)}
.conv.active{background:#E6F4EC}
.conv + .conv::before{content:"";position:absolute;left:76px;right:0;top:0;border-top:1px solid var(--line)}
.conv-body{flex:1;min-width:0}
.conv-l1,.conv-l2{display:flex;align-items:center;gap:8px}
.conv-name{flex:1;font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-time{font-size:.74rem;color:var(--muted);flex-shrink:0}
.conv.unread .conv-time{color:var(--mint);font-weight:700}
.conv-prev{flex:1;font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;min-width:0}
.conv-prev .txt{overflow:hidden;text-overflow:ellipsis}
.conv.unread .conv-prev{color:var(--ink);font-weight:600}
.conv-prev.is-typing{color:var(--mint);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--mint);color:#fff;font-size:.72rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.list-empty{padding:48px 28px;text-align:center;color:var(--muted);line-height:1.6}
.list-empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:6px}
.list-empty .btn{margin-top:16px}

/* ---------- avatares ---------- */
.av{position:relative;width:48px;height:48px;border-radius:50%;flex-shrink:0;background:var(--dark-3);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av.sm{width:38px;height:38px;font-size:.8rem}
.av.lg{width:84px;height:84px;font-size:1.6rem}
.av .dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#25C06D;border:2px solid #fff;display:none}
.av.online .dot{display:block}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:700;font-size:.92rem}
.btn-dark{background:var(--dark);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{border:1.5px solid var(--line);background:#fff}

/* ---------- conversa: cabeçalho ---------- */
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--white);border-bottom:1px solid var(--line);z-index:2}
.chat-who{flex:1;display:flex;align-items:center;gap:10px;min-width:0;text-align:left;border-radius:12px;padding:4px}
.chat-who:hover{background:var(--tint)}
.chat-name{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-sub.live{color:var(--mint);font-weight:600}
.back{display:none}
@media (max-width:860px){.back{display:inline-flex}}

/* ---------- conversa: mensagens ---------- */
.feed{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 6% 8px;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(19,36,32,.045) 1px,transparent 1px);background-size:18px 18px}
@media (max-width:860px){.feed{padding:10px 10px 6px}}
.empty-chat{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:24px;gap:10px}
.empty-chat .big{width:84px;height:84px;border-radius:24px;background:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -12px rgba(19,36,32,.3)}
.empty-chat h2{color:var(--ink);font-size:1.15rem}
.older{display:block;margin:4px auto 10px;font-size:.8rem;color:var(--muted)}
.day{display:flex;justify-content:center;margin:14px 0 8px}
.day span{background:rgba(255,255,255,.92);color:var(--muted);font-size:.74rem;font-weight:700;padding:5px 12px;border-radius:10px;box-shadow:0 1px 2px rgba(19,36,32,.08)}
.intro{max-width:360px;margin:10px auto 16px;text-align:center;background:#FFF6E8;color:#7A4A10;font-size:.8rem;line-height:1.5;padding:10px 14px;border-radius:12px}

.row{display:flex;margin:1px 0;position:relative;align-items:flex-end;gap:6px}
.row.first{margin-top:8px}
.row.mine{justify-content:flex-end}
.bw{max-width:min(78%,560px);position:relative;display:flex;flex-direction:column}
.row.mine .bw{align-items:flex-end}
.bubble{position:relative;padding:7px 10px 7px 12px;border-radius:var(--r);font-size:.94rem;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1.5px rgba(19,36,32,.13);transition:transform .15s}
.row.theirs .bubble{background:var(--theirs)}
.row.mine .bubble{background:var(--mine);color:#fff}
.row.theirs.last .bubble{border-bottom-left-radius:6px}
.row.mine.last .bubble{border-bottom-right-radius:6px}
.row.flash .bubble{animation:flash 1.2s ease}
@keyframes flash{0%,100%{box-shadow:0 1px 1.5px rgba(19,36,32,.13)}30%{box-shadow:0 0 0 4px rgba(232,114,10,.45)}}
.bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.row.mine .bubble a{color:#fff}
.meta{float:right;display:inline-flex;align-items:center;gap:3px;font-size:.68rem;margin:8px 0 -4px 10px;line-height:1;opacity:.75;white-space:nowrap}
.row.mine .meta{opacity:.85}
.tick{width:16px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tick.read{color:var(--mint-l)}
.row.pending .meta .clock{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row.failed .bubble{opacity:.7}
.fail{font-size:.74rem;color:var(--red);font-weight:700;margin-top:3px}
.bubble.photo-only{padding:4px}
.bubble.photo-only .meta{position:absolute;right:10px;bottom:10px;margin:0;background:rgba(0,0,0,.45);color:#fff;opacity:1;padding:3px 6px;border-radius:8px}

/* citação (responder) */
.quote{display:block;width:100%;text-align:left;border-left:3px solid var(--orange);background:rgba(19,36,32,.06);border-radius:8px;padding:5px 8px;margin:1px 0 6px;font-size:.8rem;line-height:1.35;white-space:normal}
.row.mine .quote{background:rgba(255,255,255,.12);border-left-color:var(--mint-l)}
.quote b{display:block;color:var(--orange-dark);font-size:.76rem}
.row.mine .quote b{color:var(--mint-l)}
.quote span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}

/* fotos */
.pics{display:grid;gap:3px;border-radius:14px;overflow:hidden;margin-bottom:4px;min-width:220px}
.pics.n1{grid-template-columns:1fr}
.pics.n2,.pics.n4{grid-template-columns:1fr 1fr}
.pics.n3{grid-template-columns:1fr 1fr}.pics.n3 .pic:first-child{grid-column:1/-1}
.pic{position:relative;background:#DDE7E1;aspect-ratio:4/3;overflow:hidden;cursor:zoom-in}
.pics.n1 .pic{aspect-ratio:auto;max-height:340px;min-height:140px}
.pic img{width:100%;height:100%;object-fit:cover}
.pics.n1 .pic img{max-height:340px}
.pic .up{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(19,36,32,.35);color:#fff}

/* reações */
.reacts{display:flex;gap:4px;margin-top:-6px;padding:0 8px;z-index:1}
.react{display:inline-flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:.8rem;box-shadow:0 1px 2px rgba(19,36,32,.1)}
.react.me{border-color:var(--mint);background:#E6F4EC}
.react em{font-style:normal;font-size:.7rem;color:var(--muted);font-weight:700}

/* ações ao passar o rato (computador) */
.acts{display:flex;gap:2px;opacity:0;transition:opacity .15s;align-self:center}
.row:hover .acts{opacity:1}
.acts button{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:rgba(255,255,255,.9);box-shadow:0 1px 3px rgba(19,36,32,.12)}
.acts button:hover{color:var(--ink)}
.acts .ico{width:16px;height:16px}
@media (hover:none){.acts{display:none}}
.row.mine .acts{order:-1}

/* a escrever… */
.typing-row{display:none;margin-top:8px}
.typing-row.on{display:flex}
.typing{background:#fff;border-radius:var(--r);border-bottom-left-radius:6px;padding:12px 14px;display:inline-flex;gap:4px;box-shadow:0 1px 1.5px rgba(19,36,32,.13)}
.typing i{width:7px;height:7px;border-radius:50%;background:#9AA8A2;animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* botão ir para o fim */
.jump{position:absolute;right:18px;bottom:96px;width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(19,36,32,.2);display:none;align-items:center;justify-content:center;z-index:3}
.jump.on{display:flex}
.jump .badge{position:absolute;top:-6px;right:-4px}

/* ---------- escrever ---------- */
.composer{background:var(--white);border-top:1px solid var(--line);padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:600;white-space:nowrap}
.chip:hover{border-color:var(--mint);background:var(--tint)}
.chip.add{border-style:dashed;color:var(--muted)}
.chip .x{margin-left:6px;color:var(--muted)}
.replying,.attach-strip{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;border-radius:12px;background:var(--tint)}
.replying{border-left:3px solid var(--orange)}
.replying .q{flex:1;min-width:0;font-size:.82rem}
.replying .q b{display:block;color:var(--orange-dark);font-size:.78rem}
.replying .q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.attach-strip{overflow-x:auto}
.thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#DDE7E1}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px}
.bar{display:flex;align-items:flex-end;gap:6px}
.field{flex:1;display:flex;align-items:flex-end;background:var(--bg);border-radius:22px;padding:4px 6px 4px 14px;min-height:44px}
.field textarea{flex:1;border:none;background:transparent;resize:none;font:inherit;font-size:.96rem;line-height:1.4;padding:8px 0;max-height:140px;outline:none;color:var(--ink)}
.send{width:44px;height:44px;border-radius:50%;background:var(--orange);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s,background .15s}
.send:active{transform:scale(.92)}
.send:disabled{background:#C9D3CE}
.tool{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.tool:hover,.tool.on{color:var(--ink);background:var(--tint)}
.drop{position:absolute;inset:0;background:rgba(19,36,32,.55);color:#fff;display:none;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;z-index:5;border:3px dashed rgba(255,255,255,.7);margin:10px;border-radius:20px}
.drop.on{display:flex}
.offline{display:none;background:#FFF4E0;color:#7A4A10;font-size:.8rem;text-align:center;padding:6px}
body.is-offline .offline{display:block}

/* ---------- painel de detalhes ---------- */
.info{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100%;background:#fff;box-shadow:-10px 0 30px rgba(19,36,32,.15);z-index:40;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;visibility:hidden}
.info.open{transform:none;visibility:visible}
.info-head{display:flex;align-items:center;gap:8px;padding:12px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);font-weight:800}
.info-body{flex:1;overflow-y:auto;padding:20px}
.info-who{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:18px}
.info-who h3{font-size:1.15rem}
.info-sec{margin-top:18px}
.info-sec h4{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:7px 0;border-bottom:1px solid var(--line)}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;text-align:right}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gal button{aspect-ratio:1;border-radius:8px;overflow:hidden;background:#DDE7E1}
.gal img{width:100%;height:100%;object-fit:cover}
.info-actions{display:grid;gap:8px}
.info-actions .btn{width:100%}
.scrim{position:fixed;inset:0;background:rgba(19,36,32,.35);z-index:35;display:none}
.scrim.on{display:block}

/* ---------- menu de mensagem (toque longo) e reações ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;z-index:50;padding:14px 14px max(14px,env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .22s ease;box-shadow:0 -10px 30px rgba(19,36,32,.2)}
.sheet.open{transform:none}
.sheet .emojis{display:flex;justify-content:space-around;padding:6px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.sheet .emojis button,.pop button{font-size:1.6rem;width:48px;height:48px;border-radius:50%;transition:transform .12s}
.sheet .emojis button:active,.pop button:hover{transform:scale(1.2)}
.sheet .emojis button.me,.pop button.me{background:#E6F4EC}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 8px;font-weight:600;border-radius:12px}
.sheet .opt:hover{background:var(--tint)}
.pop{position:fixed;z-index:50;background:#fff;border-radius:999px;box-shadow:0 8px 28px rgba(19,36,32,.25);padding:4px;display:none;gap:2px}
.pop.open{display:flex}
.pop button{width:40px;height:40px;font-size:1.35rem}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:999px;font-size:.86rem;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ---------- fotos em ecrã inteiro ---------- */
.lb{position:fixed;inset:0;background:rgba(8,14,12,.96);z-index:70;display:none;flex-direction:column}
.lb.open{display:flex}
.lb-top{display:flex;align-items:center;gap:8px;padding:12px;padding-top:max(12px,env(safe-area-inset-top));color:#fff}
.lb-top .cnt{flex:1;font-weight:600;font-size:.9rem;opacity:.8}
.lb-top .icon-btn{color:#fff}
.lb-top .icon-btn:hover{background:rgba(255,255,255,.12)}
.lb-img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px;touch-action:pan-y}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center}
.lb-nav.prev{left:14px}.lb-nav.next{right:14px}
@media (hover:none){.lb-nav{display:none}}

/* esqueleto enquanto carrega */
.sk{height:64px;margin:6px 16px;border-radius:12px;background:linear-gradient(90deg,#EEF3F0 25%,#F7FAF8 50%,#EEF3F0 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* segurança: aviso de burla, bloquear, denunciar */
.warn{margin-top:5px;max-width:340px;background:#FFF6E8;border:1px solid #F2D3A4;color:#7A4A10;font-size:.78rem;line-height:1.45;padding:8px 11px;border-radius:12px}
.warn b{display:block;margin-bottom:2px}
.warn button{background:none;border:0;padding:0;margin-top:3px;color:var(--red);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.official{display:inline-flex;align-items:center;margin-left:4px;padding:0 6px;border-radius:999px;background:#E8720A;color:#fff;font-size:.66rem;font-weight:800;line-height:1.5;vertical-align:1px}
.blocked-bar{padding:16px;text-align:center;font-size:.88rem;color:var(--muted);background:var(--white);border-top:1px solid var(--line)}
.blocked-bar button{margin-left:8px}
.btn-danger{background:var(--white);color:var(--red);border:1.5px solid #F0C9C5}
.btn-danger:hover{background:#FDF1F0}
.confirm-box{background:#FDF1F0;border-radius:12px;padding:12px;font-size:.84rem;line-height:1.45;color:var(--ink)}
.confirm-box .row2{display:flex;gap:8px;margin-top:10px}
.confirm-box .row2 .btn{flex:1}

<body>
<div class="offline" role="status">Sem ligação. As mensagens são enviadas quando a ligação voltar.</div>
<div class="app">
  <!-- LISTA DE CONVERSAS -->
  <aside class="side" aria-label="Conversas">
    <div class="side-top">
      <a href="/dashboard" class="icon-btn" aria-label="Voltar ao painel"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
      <h1>Mensagens</h1>
      <a href="/" class="logo" aria-label="Flinko — página inicial">Flink<span>o</span></a>
    </div>
    <label class="search"><span class="sr">Procurar conversa</span>
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Procurar conversa" autocomplete="off"/>
    </label>
    <div class="conv-list" id="list" role="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  </aside>

  <!-- CONVERSA -->
  <main class="main" id="main" aria-label="Conversa">
    <div class="empty-chat" id="noChat">
      <div class="big"><svg class="ico" viewBox="0 0 24 24" style="width:40px;height:40px;color:var(--orange)"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg></div>
      <h2>As tuas conversas</h2>
      <p>Escolhe uma conversa à esquerda para continuar.</p>
    </div>

    <div id="chat" style="display:none;flex:1;flex-direction:column;min-height:0">
      <header class="chat-head">
        <button class="icon-btn back" onclick="closeChat()" aria-label="Voltar às conversas"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="chat-who" onclick="openInfo()" aria-label="Ver detalhes">
          <span class="av sm" id="hAv"></span>
          <span style="min-width:0"><span class="chat-name" id="hName" style="display:block"></span><span class="chat-sub" id="hSub" style="display:block"></span></span>
        </button>
        <button class="icon-btn" onclick="openInfo()" aria-label="Detalhes da conversa"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg></button>
      </header>

      <div class="feed" id="feed" aria-live="polite"></div>
      <button class="jump" id="jump" onclick="scrollToBottom(true)" aria-label="Ir para a mensagem mais recente"><svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg><span class="badge" id="jumpN" style="display:none"></span></button>

      <div class="composer" id="composer">
        <div class="chips" id="chips" hidden></div>
        <div class="replying" id="replying" hidden>
          <div class="q"><b id="rpWho"></b><span id="rpTxt"></span></div>
          <button class="icon-btn" onclick="cancelReply()" aria-label="Cancelar resposta"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="attach-strip" id="strip" hidden></div>
        <div class="bar">
          <button class="tool" onclick="document.getElementById('file').click()" aria-label="Enviar fotos"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="m21 17-5-5-8 8"/></svg></button>
          <button class="tool" id="quickBtn" onclick="toggleQuick()" aria-label="Respostas rápidas" hidden><svg class="ico" viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg></button>
          <div class="field"><label class="sr" for="input">Mensagem</label><textarea id="input" rows="1" placeholder="Mensagem" enterkeyhint="send"></textarea></div>
          <button class="send" id="sendBtn" onclick="send()" aria-label="Enviar" disabled><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        <input type="file" id="file" accept="image/*" multiple hidden/>
      </div>
      <div class="blocked-bar" id="blockedBar" hidden></div>
      <div class="drop" id="drop">Larga aqui as fotos</div>
    </div>
  </main>
</div>

<!-- detalhes da conversa -->
<div class="scrim" id="scrim" onclick="closeInfo();closeSheet()"></div>
<aside class="info" id="info" aria-label="Detalhes">
  <div class="info-head"><button class="icon-btn" onclick="closeInfo()" aria-label="Fechar"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>Detalhes</div>
  <div class="info-body" id="infoBody"></div>
</aside>

<!-- menu de uma mensagem (toque longo no telemóvel) -->
<div class="sheet" id="sheet" role="dialog" aria-label="Opções da mensagem">
  <div class="emojis" id="sheetEmojis"></div>
  <button class="opt" onclick="sheetReply()"><svg class="ico" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/></svg>Responder</button>
  <button class="opt" id="sheetCopy" onclick="sheetCopy()"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copiar texto</button>
</div>
<div class="pop" id="pop" role="dialog" aria-label="Reagir"></div>
<div class="toast" id="toast" role="status"></div>

<!-- fotos em ecrã inteiro -->
<div class="lb" id="lb" role="dialog" aria-label="Foto">
  <div class="lb-top">
    <button class="icon-btn" onclick="closeLb()" aria-label="Fechar"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <span class="cnt" id="lbCnt"></span>
    <a class="icon-btn" id="lbDl" href="#" target="_blank" rel="noopener" aria-label="Abrir original"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></a>
  </div>
  <div class="lb-img" id="lbImg"></div>
  <button class="lb-nav prev" onclick="lbStep(-1)" aria-label="Foto anterior"><svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="lb-nav next" onclick="lbStep(1)" aria-label="Foto seguinte"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
</div>

<script>
const SUPABASE_URL='https://cdwinidhtfxfxowflize.supabase.co'
const SUPABASE_KEY='sb_publishable_G1U9iSJLR2JkhD9gvfyY3Q_qaqnMaUk'
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

const PAGE=50                     // mensagens por página
const MAX_FOTOS=4
const EMOJIS=['❤️','👍','😂','😮','🙏','👏']
const MSG_COLS='id,conversation_id,sender_id,content,attachments,reply_to,read,read_at,created_at'
const $=id=>document.getElementById(id)
const esc=escapeHtml
const isTouch=matchMedia('(hover:none)').matches

// Estado
const S={
  me:null,myName:'',iAmPro:false,
  convs:[],            // conversas (com .other, .unread, .lastMine, .lastRead)
  active:null,         // conversa aberta (ou rascunho: {id:null,draft:true,other})
  msgs:[],hasMore:false,loadingOlder:false,
  reactions:{},        // message_id -> [{user_id,emoji}]
  urls:{},             // caminho da foto -> link temporário
  files:[],            // fotos por enviar [{file,preview}]
  replyTo:null,
  online:new Set(),
  typingUntil:0,typingCh:null,lastTypingSent:0,
  newWhileUp:0,
  quick:false,
  blocked:new Set()    // pessoas que eu bloqueei
}

/* ============ utilitários ============ */
function initials(n){return String(n||'?').trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase()||'?'}
function firstName(n){return String(n||'').trim().split(/\s+/)[0]||''}
function avatarHtml(p,cls){
  const url=safeUrl(p&&p.photo_url)
  const online=p&&S.online.has(p.id)?' online':''
  return '<span class="av'+(cls?' '+cls:'')+online+'">'+(url?'<img src="'+esc(url)+'" alt="" loading="lazy">':esc(initials(p&&p.name)))+'<span class="dot"></span></span>'
}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function dayLabel(d){
  const hoje=new Date(),ontem=new Date(Date.now()-864e5)
  if(sameDay(d,hoje))return 'Hoje'
  if(sameDay(d,ontem))return 'Ontem'
  if(Date.now()-d<6*864e5)return d.toLocaleDateString('pt-PT',{weekday:'long'})
  return d.toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:d.getFullYear()===hoje.getFullYear()?undefined:'numeric'})
}
function hhmm(d){return d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}
function listTime(iso){
  if(!iso)return ''
  const d=new Date(iso)
  if(sameDay(d,new Date()))return hhmm(d)
  if(sameDay(d,new Date(Date.now()-864e5)))return 'Ontem'
  if(Date.now()-d<6*864e5)return d.toLocaleDateString('pt-PT',{weekday:'short'}).replace('.','')
  return d.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'2-digit'})
}
// Texto sempre escapado ANTES de virar HTML; só depois os endereços viram links.
function fmt(txt){
  const limpo=String(txt||'').replace(/\r\n?/g,'\n').replace(/\n{3,}/g,'\n\n').trim()
  return esc(limpo).replace(/\bhttps?:\/\/[^\s<]+/g,u=>{
    const fim=u.replace(/[.,;:!?)\]]+$/,''),sobra=u.slice(fim.length)
    return '<a href="'+fim+'" target="_blank" rel="noopener noreferrer nofollow">'+fim+'</a>'+sobra
  })
}
function snippet(m){
  if(!m)return ''
  const t=String(m.content||'').trim()
  if(t)return t.length>90?t.slice(0,87)+'…':t
  const n=(m.attachments||[]).length
  return n>1?'📷 '+n+' fotos':'📷 Foto'
}
// Aviso de segurança por baixo de mensagens recebidas que pedem pagamento
// adiantado, dados bancários ou códigos. Só aparece a quem recebe; não bloqueia
// nada (há profissionais honestos que pedem MB WAY no fim do trabalho).
const RISCO_PAGAMENTO=/\biban\b|\bPT\s?50(?:[\s.]?\d){10,}|\bmb\s?way\b|adiantad|adiantamento|\bsinal\b.{0,30}(pag|transfer|€|eur)|(pag|transfer).{0,30}\bsinal\b|western\s?union|moneygram|paysafe|bitcoin|cripto|transfer[êe]ncia\s+(antes|primeiro|j[áa])/i
const RISCO_CODIGO=/c[óo]digo.{0,25}(sms|verifica|confirma|recebe|cheg)|\bcvv\b|dados\s+do\s+cart[ãa]o|n[úu]mero\s+do\s+cart[ãa]o|palavra[-\s]passe|password/i
function riscoAviso(texto){
  const t=String(texto||'')
  if(RISCO_CODIGO.test(t))return '<b>⚠️ Nunca partilhes códigos, cartões ou palavras-passe.</b>A Flinko e os profissionais nunca precisam deles.'
  if(RISCO_PAGAMENTO.test(t))return '<b>⚠️ Cuidado com pagamentos adiantados.</b>Paga só depois de o trabalho estar combinado (de preferência, feito). Desconfia de quem pede dinheiro antes de te conhecer.'
  return ''
}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2200)}
const TICK='<svg class="tick" viewBox="0 0 16 12"><path d="M1 6.5 4.5 10 11 2"/></svg>'
const TICKS='<svg class="tick" viewBox="0 0 16 12"><path d="M1 6.5 4.5 10 11 2"/><path d="M6 9.5 7 10 14 2"/></svg>'
const CLOCK='<svg class="tick clock" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5"/><path d="M6 3.5V6l1.6 1"/></svg>'

/* ============ arranque ============ */
async function init(){
  const{data:{session}}=await db.auth.getSession()
  const params=new URLSearchParams(location.search)
  const withId=(params.get('with')||'').replace(/[^0-9a-fA-F-]/g,'')
  if(!session){
    location.href='auth.html?tab=login&redirect='+encodeURIComponent('messages.html'+(withId?'?with='+withId:''))
    return
  }
  S.me=session.user.id
  const{data:me}=await db.from('profiles').select('name,category').eq('id',S.me).maybeSingle()
  S.myName=(me&&me.name)||''
  S.iAmPro=!!(me&&String(me.category||'').trim())
  $('quickBtn').hidden=!S.iAmPro

  const{data:bl}=await db.from('user_blocks').select('blocked_id').eq('blocker_id',S.me)
  S.blocked=new Set((bl||[]).map(b=>b.blocked_id))
  await loadConversations()
  if(window.flinkoPushEnsure)flinkoPushEnsure(db,S.me)
  subscribe()
  presence()

  const cId=(params.get('c')||'').replace(/[^0-9a-fA-F-]/g,'')
  if(withId&&withId!==S.me)await openWith(withId)
  else if(cId)openConv(cId,{replace:true})
  else if(!isTouch&&innerWidth>860&&S.convs.length)openConv(S.convs[0].id,{replace:true})
}

/* ============ lista de conversas ============ */
async function loadConversations(){
  const{data,error}=await db.from('conversations').select('*').or('professional_id.eq.'+S.me+',client_id.eq.'+S.me).order('last_message_at',{ascending:false})
  if(error){$('list').innerHTML='<div class="list-empty">Não foi possível carregar as conversas. Verifica a ligação e atualiza a página.</div>';return}
  const rows=data||[]
  const otherIds=[...new Set(rows.map(c=>c.professional_id===S.me?c.client_id:c.professional_id))]
  const map={}
  if(otherIds.length){
    const{data:ps}=await db.from('profiles').select('id,name,photo_url,category,slug').in('id',otherIds)
    ;(ps||[]).forEach(p=>map[p.id]=p)
  }
  // não lidas, e se a última mensagem foi minha e já foi vista (✓✓ na lista)
  const meta={}
  if(rows.length){
    // Contado no servidor (resumo_conversas): ler as mensagens todas parava nas 1000.
    const{data:rs,error:re}=await db.rpc('resumo_conversas')
    if(!re&&rs)rs.forEach(r=>{meta[r.conversation_id]={unread:r.unread,count:r.total,last:{sender_id:r.last_sender,read:r.last_read}}})
    else{
      const{data:ms}=await db.from('messages').select('conversation_id,sender_id,read,created_at').in('conversation_id',rows.map(c=>c.id)).order('created_at',{ascending:false}).limit(1000)
      ;(ms||[]).forEach(m=>{
        const x=meta[m.conversation_id]=meta[m.conversation_id]||{unread:0,last:null,count:0}
        if(!x.last)x.last=m
        x.count++
        if(m.sender_id!==S.me&&!m.read)x.unread++
      })
    }
  }
  const keep=S.convs.filter(c=>c.draft)
  // Conversa oficial (enviada pelo admin): do lado do profissional aparece como "Flinko".
  const flinko=oid=>({id:oid,name:'Flinko',photo_url:location.origin+'/icon-192.png',category:'Equipa Flinko',flinko:true})
  S.convs=rows.map(c=>{
    const oid=c.professional_id===S.me?c.client_id:c.professional_id
    const x=meta[c.id]||{unread:0,last:null,count:0}
    const other=c.is_flinko&&c.client_id!==S.me?flinko(oid):(map[oid]||{id:oid,name:'Utilizador'})
    return Object.assign({},c,{other,unread:x.unread,count:x.count,
      lastMine:!!(x.last&&x.last.sender_id===S.me),lastRead:!!(x.last&&x.last.read)})
  }).concat(keep)
  renderList()
}

function renderList(){
  const el=$('list')
  const q=$('q').value.trim().toLowerCase()
  // conversas vazias de outros (criadas mas sem mensagens) não aparecem a quem as recebeu
  let L=S.convs.filter(c=>c.draft||c.count>0||c.client_id===S.me||(S.active&&S.active.id===c.id))
  if(q)L=L.filter(c=>(c.other.name||'').toLowerCase().includes(q)||(c.last_message||'').toLowerCase().includes(q))
  L.sort((a,b)=>new Date(b.last_message_at||b.created_at||0)-new Date(a.last_message_at||a.created_at||0))
  if(!L.length){
    el.innerHTML=q?'<div class="list-empty">Nenhuma conversa encontrada.</div>'
      :'<div class="list-empty"><strong>Ainda não tens conversas</strong>'+(S.iAmPro
        ?'Quando um cliente te contactar, a conversa aparece aqui. Entretanto, vê os pedidos abertos da tua zona.<br><a class="btn btn-dark" href="/pedidos">Ver pedidos de clientes</a>'
        :'Encontra um profissional e carrega em “Enviar mensagem” no perfil dele.<br><a class="btn btn-orange" href="/categoria">Encontrar profissional</a>')+'</div>'
    updateTitle();return
  }
  el.innerHTML=L.map(c=>{
    const act=S.active&&((c.id&&S.active.id===c.id)||(c.draft&&S.active.draft))
    const typing=c.id&&S.active&&S.active.id===c.id&&S.typingUntil>Date.now()
    const prev=c.draft?'<span class="txt">Nova conversa</span>'
      :S.blocked.has(c.other.id)?'<span class="txt">🚫 Bloqueado</span>'
      :typing?'<span class="txt">a escrever…</span>'
      :(c.lastMine?'<span class="'+(c.lastRead?'tick read':'')+'" style="display:inline-flex;color:'+(c.lastRead?'var(--mint)':'var(--muted)')+'">'+(c.lastRead?TICKS:TICK)+'</span>':'')+'<span class="txt">'+esc(c.last_message||'Conversa iniciada')+'</span>'
    return '<button class="conv'+(act?' active':'')+(c.unread?' unread':'')+'" role="listitem" onclick="openConv(\''+(c.id||'draft')+'\')">'+
      avatarHtml(c.other)+
      '<span class="conv-body"><span class="conv-l1"><span class="conv-name">'+esc(c.other.name)+(c.other.flinko?' <span class="official" title="Conta oficial">✓</span>':c.is_flinko?' <span class="official" title="Enviada como Flinko">Flinko</span>':'')+'</span><span class="conv-time">'+listTime(c.last_message_at)+'</span></span>'+
      '<span class="conv-l2"><span class="conv-prev'+(typing?' is-typing':'')+'">'+prev+'</span>'+(c.unread?'<span class="badge" aria-label="'+c.unread+' por ler">'+c.unread+'</span>':'')+'</span></span></button>'
  }).join('')
  updateTitle()
}
function updateTitle(){
  const n=S.convs.reduce((s,c)=>s+(c.unread||0),0)
  document.title=(n?'('+n+') ':'')+'Mensagens – Flinko'
}
$('q').addEventListener('input',renderList)

/* ============ abrir conversa ============ */
// A partir de um perfil (?with=): a conversa só é criada quando se envia a
// primeira mensagem, para não ficarem conversas vazias.
async function openWith(otherId){
  const existing=S.convs.find(c=>c.professional_id===otherId||c.client_id===otherId)
  if(existing){openConv(existing.id,{replace:true});return}
  const{data:p}=await db.from('profiles').select('id,name,photo_url,category,slug').eq('id',otherId).maybeSingle()
  if(!p){toast('Este perfil já não está disponível.');return}
  const draft={id:null,draft:true,other:p,last_message_at:new Date().toISOString(),count:0}
  S.convs=S.convs.filter(c=>!c.draft).concat(draft)
  openConv('draft',{replace:true})
}

async function openConv(id,opts){
  opts=opts||{}
  const conv=id==='draft'?S.convs.find(c=>c.draft):S.convs.find(c=>c.id===id)
  if(!conv)return
  if(S.active&&S.active!==conv)saveDraftText()
  S.active=conv;S.msgs=[];S.reactions={};S.hasMore=false;S.newWhileUp=0;S.typingUntil=0
  cancelReply(true);clearFiles()
  $('noChat').style.display='none'
  $('chat').style.display='flex'
  document.body.classList.add('view-chat')
  // o "voltar" do telemóvel fecha a conversa em vez de sair da página
  const url='messages.html'+(conv.id?'?c='+conv.id:location.search)
  if(opts.replace)history.replaceState({chat:true},'',url);else history.pushState({chat:true},'',url)
  renderHead()
  renderList()
  renderBlocked()
  $('input').value=loadDraftText()
  autoGrow();updateSend()
  if(!conv.id){renderFeed();renderChips();return}
  $('feed').innerHTML='<div class="sk" style="width:60%"></div><div class="sk" style="width:45%;margin-left:auto"></div><div class="sk" style="width:55%"></div>'
  const{data,error}=await db.from('messages').select(MSG_COLS).eq('conversation_id',conv.id).order('created_at',{ascending:false}).limit(PAGE)
  if(S.active!==conv)return
  if(error){$('feed').innerHTML='<div class="empty-chat">Não foi possível carregar as mensagens.</div>';return}
  S.msgs=(data||[]).reverse()
  S.hasMore=(data||[]).length===PAGE
  await Promise.all([loadReactions(S.msgs.map(m=>m.id)),signUrls(S.msgs)])
  if(S.active!==conv)return
  renderFeed();scrollToBottom()
  renderChips()
  markRead()
  joinTyping(conv.id)
  if(!isTouch)$('input').focus()
}

function closeChat(){
  if(history.state&&history.state.chat)history.back()
  else showList()
}
function showList(){
  saveDraftText()
  document.body.classList.remove('view-chat')
  closeInfo();closeSheet()
}
addEventListener('popstate',()=>{if(innerWidth<=860&&document.body.classList.contains('view-chat'))showList()})

function renderHead(){
  const o=S.active.other

/* ============ mensagens ============ */
async function loadReactions(ids){
  ids=ids.filter(i=>!String(i).startsWith('tmp-'))
  if(!ids.length)return
  const{data}=await db.from('message_reactions').select('message_id,user_id,emoji').in('message_id',ids)
  ids.forEach(i=>{S.reactions[i]=[]})
  ;(data||[]).forEach(r=>{(S.reactions[r.message_id]=S.reactions[r.message_id]||[]).push(r)})
}
// As fotos estão num espaço privado: mostram-se com links temporários (1 hora).
async function signUrls(msgs){
  const paths=[]
  msgs.forEach(m=>(m.attachments||[]).forEach(a=>{if(a&&a.path&&!S.urls[a.path])paths.push(a.path)}))
  if(!paths.length)return
  try{
    const{data}=await db.storage.from('chat-media').createSignedUrls(paths,3600)
    ;(data||[]).forEach(r=>{if(r&&r.signedUrl)S.urls[r.path]=r.signedUrl})
  }catch(e){}
}

function renderFeed(){
  const feed=$('feed'),M=S.msgs
  let h=''
  if(S.hasMore)h+='<button class="older" onclick="loadOlder()">Ver mensagens anteriores</button>'
  if(!M.length){
    h+='<div class="intro">🔒 As mensagens ficam entre ti e '+esc(firstName(S.active.other.name)||'esta pessoa')+'. Para tua segurança, combina e paga os trabalhos diretamente com o profissional e nunca partilhes palavras-passe.</div>'
    h+='<div class="empty-chat" style="height:auto;padding-top:30px"><div class="big">'+avatarHtml(S.active.other,'lg')+'</div><h2>'+esc(S.active.other.name||'')+'</h2><p>'+(S.iAmPro?'Diz olá e pergunta em que podes ajudar.':'Diz o que precisas: o trabalho, a zona e quando dá jeito. Podes juntar fotos.')+'</p></div>'
  }
  let prev=null
  M.forEach((m,i)=>{
    const d=new Date(m.created_at)
    if(!prev||!sameDay(new Date(prev.created_at),d))h+='<div class="day"><span>'+esc(dayLabel(d))+'</span></div>'
    const next=M[i+1]
    const first=!prev||prev.sender_id!==m.sender_id||d-new Date(prev.created_at)>5*6e4||!sameDay(new Date(prev.created_at),d)
    const last=!next||next.sender_id!==m.sender_id||new Date(next.created_at)-d>5*6e4||!sameDay(new Date(next.created_at),d)
    h+=bubbleHtml(m,first,last)
    prev=m
  })
  h+='<div class="row theirs typing-row" id="typingRow"><div class="typing"><i></i><i></i><i></i></div></div>'
  feed.innerHTML=h
  if(S.typingUntil>Date.now())$('typingRow').classList.add('on')
}

function bubbleHtml(m,first,last){
  const mine=m.sender_id===S.me
  const atts=Array.isArray(m.attachments)?m.attachments:[]
  const text=String(m.content||'').trim()
  let st=m._status==='sending'?'pending':m._status==='failed'?'failed':''
  let cls='row '+(mine?'mine':'theirs')+(first?' first':'')+(last?' last':'')+(st?' '+st:'')
  let inner=''
  if(m.reply_to){
    const o=S.msgs.find(x=>x.id===m.reply_to)
    const who=o?(o.sender_id===S.me?'Tu':firstName(S.active.other.name)):''
    inner+='<button class="quote" onclick="event.stopPropagation();jumpTo(\''+m.reply_to+'\')"><b>'+esc(who||'Mensagem')+'</b><span>'+esc(o?snippet(o):'Mensagem anterior')+'</span></button>'
  }
  if(atts.length){
    inner+='<div class="pics n'+Math.min(atts.length,4)+'">'+atts.slice(0,4).map((a,j)=>{
      const u=S.urls[a.path]||a._local||''
      return '<div class="pic" onclick="event.stopPropagation();openLb(\''+m.id+'\','+j+')">'+(u?'<img src="'+esc(u)+'" alt="Foto enviada" loading="lazy">':'')+(m._status==='sending'?'<span class="up">'+CLOCK+'</span>':'')+'</div>'
    }).join('')+'</div>'
  }
  if(text)inner+=fmt(text)
  const ticks=!mine?'':m._status==='sending'?CLOCK:m._status==='failed'?'':m.read?'<span class="tick read" title="Vista'+(m.read_at?' às '+esc(hhmm(new Date(m.read_at))):'')+'">'+TICKS+'</span>':'<span title="Enviada">'+TICK+'</span>'
  inner+='<span class="meta">'+esc(hhmm(new Date(m.created_at)))+' '+ticks+'</span>'
  const rs=S.reactions[m.id]||[]
  let reacts=''
  if(rs.length){
    const g={}
    rs.forEach(r=>{(g[r.emoji]=g[r.emoji]||[]).push(r.user_id)})
    reacts='<div class="reacts">'+Object.keys(g).map(e=>'<button class="react'+(g[e].includes(S.me)?' me':'')+'" onclick="event.stopPropagation();toggleReact(\''+m.id+'\',\''+e+'\')" aria-label="Reação '+e+'">'+e+(g[e].length>1?'<em>'+g[e].length+'</em>':'')+'</button>').join('')+'</div>'
  }
  const acts=String(m.id).startsWith('tmp-')?'':'<div class="acts"><button onclick="event.stopPropagation();startReply(\''+m.id+'\')" aria-label="Responder"><svg class="ico" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/></svg></button><button onclick="event.stopPropagation();openPop(\''+m.id+'\',this)" aria-label="Reagir"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button></div>'
  const fail=m._status==='failed'?(m._err?'<div class="fail">'+esc(m._err)+'</div>':'<button class="fail" onclick="retry(\''+m.id+'\')">Não enviada. Toca para tentar de novo</button>'):''
  const aviso=!mine&&text?riscoAviso(text):''
  const warn=aviso?'<div class="warn" role="note">'+aviso+'<br><button onclick="event.stopPropagation();openReport()">Denunciar esta conversa</button></div>':''
  return '<div class="'+cls+'" data-id="'+esc(m.id)+'">'+acts+'<div class="bw"><div class="bubble'+(atts.length&&!text&&!m.reply_to?' photo-only':'')+'">'+inner+'</div>'+reacts+fail+warn+'</div></div>'
}

function nearBottom(){const f=$('feed');return f.scrollHeight-f.scrollTop-f.clientHeight<140}
function scrollToBottom(smooth){
  const f=$('feed')
  f.scrollTo({top:f.scrollHeight,behavior:smooth?'smooth':'auto'})
  S.stick=true;S.newWhileUp=0;updateJump()
  // as fotos alteram a altura quando acabam de carregar: se estávamos no fim, continuamos no fim
  f.querySelectorAll('img').forEach(img=>{if(!img.complete)img.addEventListener('load',()=>{if(S.stick)f.scrollTop=f.scrollHeight},{once:true})})
}
function updateJump(){
  const on=!nearBottom()
  $('jump').classList.toggle('on',on)
  $('jumpN').style.display=S.newWhileUp&&on?'inline-flex':'none'
  $('jumpN').textContent=S.newWhileUp
}
$('feed').addEventListener('scroll',()=>{
  S.stick=nearBottom()
  updateJump()
  if(nearBottom()){S.newWhileUp=0;markRead()}
  if($('feed').scrollTop<80&&S.hasMore&&!S.loadingOlder)loadOlder()
},{passive:true})

async function loadOlder(){
  if(!S.active||!S.active.id||!S.msgs.length||S.loadingOlder)return
  S.loadingOlder=true
  const conv=S.active,f=$('feed'),before=f.scrollHeight-f.scrollTop
  const{data}=await db.from('messages').select(MSG_COLS).eq('conversation_id',conv.id).lt('created_at',S.msgs[0].created_at).order('created_at',{ascending:false}).limit(PAGE)
  if(S.active!==conv){S.loadingOlder=false;return}
  const older=(data||[]).reverse()
  S.hasMore=(data||[]).length===PAGE
  await Promise.all([loadReactions(older.map(m=>m.id)),signUrls(older)])
  S.msgs=older.concat(S.msgs)
  renderFeed()
  f.scrollTop=f.scrollHeight-before
  S.loadingOlder=false
}

async function jumpTo(id){
  let tries=0
  while(!S.msgs.find(m=>m.id===id)&&S.hasMore&&tries<10){await loadOlder();tries++}
  const row=document.querySelector('.row[data-id="'+CSS.escape(id)+'"]')
  if(!row){toast('Mensagem não encontrada');return}
  row.scrollIntoView({block:'center',behavior:'smooth'})
  row.classList.remove('flash');void row.offsetWidth;row.classList.add('flash')
}

// Marca como lidas as mensagens recebidas, só com a conversa à vista.
async function markRead(){
  const c=S.active
  if(!c||!c.id||document.hidden||!nearBottom())return
  const ids=S.msgs.filter(m=>m.sender_id!==S.me&&!m.read&&!String(m.id).startsWith('tmp-')).map(m=>m.id)
  if(!ids.length&&!c.unread)return
  S.msgs.forEach(m=>{if(ids.includes(m.id))m.read=true})
  c.unread=0;renderList()
  await db.from('messages').update({read:true}).eq('conversation_id',c.id).neq('sender_id',S.me).eq('read',false)
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)markRead()})

function updateSend(){$('sendBtn').disabled=!input.value.trim()&&!S.files.length}
input.addEventListener('input',()=>{autoGrow();updateSend();sendTyping();renderChips()})

function saveDraftText(){try{if(!S.active)return;const v=input.value;if(v.trim())localStorage.setItem(draftKey(),v);else localStorage.removeItem(draftKey())}catch(e){}}

// fotos
$('file').addEventListener('change',e=>{addFiles([...e.target.files]);e.target.value=''})
async function addFiles(list){
  const livres=MAX_FOTOS-S.files.length
  if(list.length>livres)toast('Máximo '+MAX_FOTOS+' fotos por mensagem')
  for(const f of list.slice(0,Math.max(livres,0))){
    if(!f.type.startsWith('image/'))continue
    if(f.size>15*1024*1024){toast('Foto demasiado grande');continue}
    let file=f
    try{file=await resizeImageFile(f,{maxWidth:1600,maxHeight:1600,quality:.8})}catch(e){}
    if(file.size>5*1024*1024){toast('Foto demasiado grande');continue}
    S.files.push({file,preview:URL.createObjectURL(file)})
  }
  renderStrip();updateSend();input.focus()
}
function renderStrip(){
  const el=$('strip')
  el.hidden=!S.files.length
  el.innerHTML=S.files.map((x,i)=>'<div class="thumb"><img src="'+esc(x.preview)+'" alt="Foto por enviar"><button onclick="rmFile('+i+')" aria-label="Retirar foto">✕</button></div>').join('')
  input.placeholder=S.files.length?'Adicionar legenda…':'Mensagem'
}
function rmFile(i){const x=S.files.splice(i,1)[0];if(x)URL.revokeObjectURL(x.preview);renderStrip();updateSend()}
function clearFiles(){S.files=[];renderStrip()}

;['dragenter','dragover'].forEach(ev=>$('main').addEventListener(ev,e=>{if(S.active&&[...(e.dataTransfer.types||[])].includes('Files')){e.preventDefault();$('drop').classList.add('on')}}))
;['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('on');if(ev==='drop')addFiles([...e.dataTransfer.files])}))

// criar a conversa só na primeira mensagem (e com os papéis certos)
async function ensureConversation(){
  const c=S.active
  if(c.id)return c.id
  const o=c.other
  const otherIsPro=!!String(o.category||'').trim()
  const row=otherIsPro||!S.iAmPro?{professional_id:o.id,client_id:S.me}:{professional_id:S.me,client_id:o.id}
  let{data,error}=await db.from('conversations').insert(row).select().single()
  if(error){
    const r=await db.from('conversations').select('*').or('and(professional_id.eq.'+o.id+',client_id.eq.'+S.me+'),and(professional_id.eq.'+S.me+',client_id.eq.'+o.id+')').limit(1).maybeSingle()
    data=r.data
  }
  if(!data)throw new Error('Não foi possível começar a conversa.')
  try{localStorage.removeItem(draftKey())}catch(e){}
  Object.assign(c,data,{draft:false,count:0})
  history.replaceState({chat:true},'','messages.html?c='+c.id)
  joinTyping(c.id)
  return c.id
}

async function send(){
  const text=input.value.trim()
  if((!text&&!S.files.length)||!S.active)return
  const files=S.files.slice(),reply=S.replyTo
  input.value='';autoGrow();S.files=[];renderStrip();cancelReply(true);updateSend()
  try{localStorage.removeItem(draftKey())}catch(e){}
  const tmp={id:'tmp-'+Date.now()+Math.random().toString(36).slice(2,6),sender_id:S.me,content:text,
    attachments:files.map(f=>({path:'',_local:f.preview})),reply_to:reply?reply.id:null,read:false,
    created_at:new Date().toISOString(),_status:'sending',_files:files}
  S.msgs.push(tmp);renderFeed();scrollToBottom(true)
  if(window.flinkoTrack&&!S.msgs.some(m=>m.sender_id===S.me&&m!==tmp))window.flinkoTrack('perfil_contactar',{perfil:S.active.other.id,origem:'mensagens'})
  await deliver(tmp)
}

async function deliver(tmp){
  const conv=S.active
  try{
    const convId=await ensureConversation()
    const atts=[]
    for(const f of tmp._files||[]){
      const ext=(f.file.type.split('/')[1]||'jpg').replace('jpeg','jpg').replace(/[^a-z0-9]/g,'')
      const path=convId+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext
      const{error}=await db.storage.from('chat-media').upload(path,f.file,{contentType:f.file.type,upsert:false})
      if(error)throw error
      S.urls[path]=f.preview
      atts.push({path})
    }
    const{data,error}=await db.from('messages').insert({conversation_id:convId,sender_id:S.me,content:tmp.content,attachments:atts,reply_to:tmp.reply_to}).select(MSG_COLS).single()
    if(error)throw error
    const real=data||Object.assign({},tmp,{id:'tmp-done-'+Date.now(),attachments:atts,_status:null})
    const i=S.msgs.indexOf(tmp)
    if(i>=0&&S.active===conv){S.msgs[i]=real;S.reactions[real.id]=[];renderFeed();if(nearBottom())scrollToBottom()}
    conv.last_message=snippet(real);conv.last_message_at=real.created_at;conv.lastMine=true;conv.lastRead=false;conv.count=(conv.count||0)+1
    renderList()
    notify(convId,snippet(real))
    // acabou de enviar: é quando faz sentido querer saber da resposta
    if(window.flinkoPushAsk&&!S.pushAsked){S.pushAsked=true;flinkoPushAsk({db,userId:S.me,delay:1200,
      title:'Queres saber quando '+(firstName(conv.other.name)||'te')+' responder?',
      text:'Ativa as notificações e recebes a resposta logo, mesmo com a Flinko fechada.'})}
  }catch(e){
    tmp._status='failed'
    if(/Não é possível enviar/.test(String(e&&e.message||'')))tmp._err='Não é possível enviar mensagens nesta conversa.'
    if(S.active===conv)renderFeed()
    if(!navigator.onLine)document.body.classList.add('is-offline')
  }
}
function retry(id){
  const m=S.msgs.find(x=>x.id===id)
  if(!m)return
  m._status='sending';renderFeed();deliver(m)
}
addEventListener('online',()=>{document.body.classList.remove('is-offline');S.msgs.filter(m=>m._status==='failed').forEach(m=>retry(m.id))})
addEventListener('offline',()=>document.body.classList.add('is-offline'))

// Email + push ao destinatário. O servidor confirma quem somos e descobre o
// endereço sozinho (nunca vem daqui).
async function notify(convId,preview){
  try{
    const{data:{session}}=await db.auth.getSession()
    if(!session)return
    fetch('/.netlify/functions/notify-message',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({conversationId:convId,preview})})
  }catch(e){}
}

/* ============ sugestões e respostas rápidas ============ */
const SUG_CLIENTE=['Olá! Gostava de pedir um orçamento.','Tem disponibilidade esta semana?','Pode dar-me um preço aproximado?','Posso enviar fotos do trabalho?']
const SUG_PRO_INICIO=['Olá! Obrigado pelo contacto. Em que posso ajudar?']
const RAPIDAS=['Posso passar para ver o trabalho. Quando lhe dá jeito?','Envio o orçamento ainda hoje.','Pode enviar fotos do que precisa?','Obrigado! Fica marcado.','Estou a caminho.']
function myQuick(){try{return JSON.parse(localStorage.getItem('fk_quick_replies')||'[]')}catch(e){return []}}
function toggleQuick(){S.quick=!S.quick;$('quickBtn').classList.toggle('on',S.quick);renderChips()}
function renderChips(){
  const el=$('chips')
  let items=[],extra=''
  const empty=S.active&&!S.msgs.some(m=>m.sender_id===S.me)
  if(S.quick&&S.iAmPro){
    const mine=myQuick()
    items=mine.map(t=>({t,mine:true})).concat(RAPIDAS.map(t=>({t})))
    if(input.value.trim()&&!mine.includes(input.value.trim()))extra='<button class="chip add" onclick="saveQuick()">＋ Guardar esta mensagem</button>'
  }else if(empty&&!input.value.trim()){
    items=(S.iAmPro?SUG_PRO_INICIO:SUG_CLIENTE).map(t=>({t}))
  }
  el.hidden=!items.length&&!extra
  el.innerHTML=items.map((x,i)=>'<button class="chip" data-i="'+i+'">'+esc(x.t)+(x.mine?'<span class="x" data-rm="'+i+'" aria-label="Apagar">✕</span>':'')+'</button>').join('')+extra
  el.querySelectorAll('.chip[data-i]').forEach(b=>b.addEventListener('click',e=>{
    const x=items[+b.dataset.i]
    if(e.target.dataset.rm!=null){const L=myQuick().filter(t=>t!==x.t);localStorage.setItem('fk_quick_replies',JSON.stringify(L));renderChips();return}
    input.value=x.t;autoGrow();updateSend();input.focus()
    if(S.quick){S.quick=false;$('quickBtn').classList.remove('on');el.hidden=true}
    else renderChips()
  }))
}
function saveQuick(){
  const t=input.value.trim();if(!t)return
  const L=[t].concat(myQuick().filter(x=>x!==t)).slice(0,12)
  try{localStorage.setItem('fk_quick_replies',JSON.stringify(L))}catch(e){}
  toast('Resposta rápida guardada');renderChips()
}

function startReply(id){

  S.replyTo=m

  $('rpTxt').textContent=snippet(m)

}
function cancelReply(silent){S.replyTo=null;$('replying').hidden=true;if(!silent)input.focus()}

/* ============ reações ============ */
async function toggleReact(id,emoji){
  closePop();closeSheet()
  if(String(id).startsWith('tmp-'))return
  const L=S.reactions[id]=S.reactions[id]||[]
  const mine=L.find(r=>r.user_id===S.me)
  if(mine&&mine.emoji===emoji){
    S.reactions[id]=L.filter(r=>r!==mine);rerenderRow(id)
    await db.from('message_reactions').delete().eq('message_id',id).eq('user_id',S.me)
  }else{
    S.reactions[id]=L.filter(r=>r.user_id!==S.me).concat({message_id:id,user_id:S.me,emoji});rerenderRow(id)
    const{error}=await db.from('message_reactions').upsert({message_id:id,user_id:S.me,emoji},{onConflict:'message_id,user_id'})
    if(error)toast('Não foi possível reagir')
  }
}
function rerenderRow(id){
  const i=S.msgs.findIndex(m=>m.id===id),row=document.querySelector('.row[data-id="'+CSS.escape(id)+'"]')
  if(i<0||!row)return
  const tmp=document.createElement('div')
  tmp.innerHTML=bubbleHtml(S.msgs[i],row.classList.contains('first'),row.classList.contains('last'))
  row.replaceWith(tmp.firstChild)
}
function emojiButtons(id){
  const mine=(S.reactions[id]||[]).find(r=>r.user_id===S.me)
  return EMOJIS.map(e=>'<button class="'+(mine&&mine.emoji===e?'me':'')+'" onclick="toggleReact(\''+id+'\',\''+e+'\')" aria-label="Reagir com '+e+'">'+e+'</button>').join('')
}
function openPop(id,btn){
  const p=$('pop');p.innerHTML=emojiButtons(id);p.classList.add('open')
  const r=btn.getBoundingClientRect(),w=p.offsetWidth
  p.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px'
  p.style.top=Math.max(8,r.top-56)+'px'
}
function closePop(){$('pop').classList.remove('open')}
document.addEventListener('click',e=>{if(!e.target.closest('#pop')&&!e.target.closest('.acts'))closePop()})

}
function closeSheet(){$('sheet').classList.remove('open');if(!$('info').classList.contains('open'))$('scrim').classList.remove('on')}
function sheetReply(){const m=sheetMsg;closeSheet();if(m)startReply(m.id)}
async function sheetCopy(){const m=sheetMsg;closeSheet();try{await navigator.clipboard.writeText(m.content||'');toast('Texto copiado')}catch(e){}}
;(function gestures(){
  const feed=$('feed')
  let t=null,sx=0,sy=0,row=null,moved=false,lastTap={id:null,at:0}
  feed.addEventListener('touchstart',e=>{
    row=e.target.closest('.row[data-id]');if(!row||row.dataset.id.startsWith('tmp-'))return
    if(e.target.closest('button,a,.pic'))return
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false
    t=setTimeout(()=>{t=null;openSheet(row.dataset.id)},450)
  },{passive:true})
  feed.addEventListener('touchmove',e=>{
    if(!row)return
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy
    if(Math.abs(dx)>8||Math.abs(dy)>8){clearTimeout(t);t=null;moved=true}
    if(dx>0&&Math.abs(dy)<30){const b=row.querySelector('.bubble');if(b)b.style.transform='translateX('+Math.min(dx,70)+'px)'}
  },{passive:true})
  feed.addEventListener('touchend',e=>{
    clearTimeout(t)
    if(!row)return
    const b=row.querySelector('.bubble'),dx=e.changedTouches[0].clientX-sx
    if(b)b.style.transform=''
    if(moved&&dx>60)startReply(row.dataset.id)
    else if(!moved&&!e.target.closest('button,a,.pic')){
      const now=Date.now()
      if(lastTap.id===row.dataset.id&&now-lastTap.at<300){toggleReact(row.dataset.id,'❤️');lastTap={id:null,at:0}}
      else lastTap={id:row.dataset.id,at:now}
    }
    row=null
  })
  // computador: duplo clique também dá ❤️
  feed.addEventListener('dblclick',e=>{const r=e.target.closest('.row[data-id]');if(r&&!r.dataset.id.startsWith('tmp-')&&!e.target.closest('button,a,.pic')){getSelection().removeAllRanges();toggleReact(r.dataset.id,'❤️')}})
  feed.addEventListener('contextmenu',e=>{if(isTouch&&e.target.closest('.row[data-id]'))e.preventDefault()})
})()

/* ============ fotos em ecrã inteiro ============ */
let lb={list:[],i:0}
function openLb(msgId,j){
  // todas as fotos da conversa, por ordem, a começar na que se tocou
  const all=[]
  S.msgs.forEach(m=>(m.attachments||[]).forEach((a,k)=>{const u=S.urls[a.path]||a._local;if(u)all.push({u,m:m.id,k})}))
  const i=all.findIndex(x=>x.m===msgId&&x.k===j)
  if(i<0)return
  lb={list:all,i}
  $('lb').classList.add('open');showLb()
}
function showLb(){
  const x=lb.list[lb.i]
  $('lbImg').innerHTML='<img src="'+esc(x.u)+'" alt="Foto '+(lb.i+1)+' de '+lb.list.length+'">'
  $('lbCnt').textContent=(lb.i+1)+' de '+lb.list.length
  $('lbDl').href=x.u
}
function lbStep(d){if(!lb.list.length)return;lb.i=(lb.i+d+lb.list.length)%lb.list.length;showLb()}
function closeLb(){$('lb').classList.remove('open')}
;(function(){let x0=null;$('lbImg').addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});$('lbImg').addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)lbStep(dx<0?1:-1);x0=null})})()
document.addEventListener('keydown',e=>{
  if($('lb').classList.contains('open')){if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')lbStep(1);if(e.key==='ArrowLeft')lbStep(-1);return}
  if(e.key==='Escape'){if(S.replyTo)cancelReply();closePop();closeSheet();closeInfo()}
})

/* ============ detalhes da conversa ============ */

  if(!S.active)return
  const o=S.active.other,isPro=!o.flinko&&!!String(o.category||'').trim()
  const fotos=[];S.msgs.forEach(m=>(m.attachments||[]).forEach((a,k)=>{const u=S.urls[a.path]||a._local;if(u)fotos.push({u,m:m.id,k})}))
  let h='<div class="info-who">'+avatarHtml(o,'lg')+'<h3>'+esc(o.name||'')+'</h3><div style="color:var(--muted);font-size:.88rem">'+esc(o.category||(isPro?'':'Cliente'))+'</div>'
  if(isPro)h+='<a class="btn btn-ghost" style="margin-top:8px" href="'+(o.slug?'/'+encodeURIComponent(o.slug):'/profile.html?id='+encodeURIComponent(o.id))+'">Ver perfil</a>'
  h+='</div>'
  if(S.iAmPro&&S.active.id){
    h+='<div class="info-sec"><h4>Trabalho</h4><div id="infoJob"><div class="sk" style="margin:0"></div></div></div>'
    h+='<div class="info-sec"><h4>Ações</h4><div class="info-actions"><a class="btn btn-dark" href="dashboard.html?page=orcamento&cliente='+encodeURIComponent(o.name||'')+'">Criar orçamento</a><a class="btn btn-ghost" href="dashboard.html?page=agenda&cliente='+encodeURIComponent(o.name||'')+'">Marcar visita</a></div></div>'
  }
  if(fotos.length)h+='<div class="info-sec"><h4>Fotos ('+fotos.length+')</h4><div class="gal">'+fotos.slice(-30).map(x=>'<button onclick="closeInfo();openLb(\''+x.m+'\','+x.k+')"><img src="'+esc(x.u)+'" alt="" loading="lazy"></button>').join('')+'</div></div>'
  const nome=esc(firstName(o.name)||'esta pessoa')
  if(o.flinko)h+='<div class="info-sec" style="font-size:.86rem;line-height:1.5">✓ Conversa oficial com a equipa Flinko. Podes responder aqui a qualquer momento.</div>'
  else h+='<div class="info-sec"><h4>Segurança</h4><div class="info-actions" id="safety">'+
    (S.blocked.has(o.id)?'<button class="btn btn-ghost" onclick="unblockUser()">Desbloquear '+nome+'</button>':'<button class="btn btn-danger" onclick="askBlock()">Bloquear '+nome+'</button>')+
    '<button class="btn btn-danger" onclick="openReport()">Denunciar</button></div></div>'
  h+='<div class="info-sec" style="font-size:.8rem;color:var(--muted);line-height:1.5">🔒 Só tu e '+esc(firstName(o.name)||'esta pessoa')+' veem esta conversa e as fotos. Se algo não estiver bem, <a href="/contacto" style="color:var(--orange-dark);font-weight:700">fala connosco</a>.</div>'
  $('infoBody').innerHTML=h
  $('info').classList.add('open');$('scrim').classList.add('on')
  if(S.iAmPro&&S.active.id){
    const{data}=await db.from('jobs').select('title,status,quote_amount,scheduled_at,paid_amount').eq('conversation_id',S.active.id).order('created_at',{ascending:false}).limit(1)
    const j=data&&data[0],el=$('infoJob');if(!el)return
    const eur=v=>Number(v).toLocaleString('pt-PT',{style:'currency',currency:'EUR'})
    el.innerHTML=!j?'<p style="font-size:.86rem;color:var(--muted)">Ainda não há trabalho ligado a esta conversa.</p>'
      :[['Serviço',esc(j.title||'—')],['Orçamento',j.quote_amount!=null?eur(j.quote_amount):'Por enviar'],['Visita',j.scheduled_at?esc(new Date(j.scheduled_at).toLocaleString('pt-PT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})):'Sem data'],['Recebido',j.paid_amount!=null?eur(j.paid_amount):'—']]
        .map(r=>'<div class="kv"><span class="k">'+r[0]+'</span><span class="v">'+r[1]+'</span></div>').join('')
  }
}
/* ============ bloquear e denunciar ============ */
function renderBlocked(){
  const o=S.active&&S.active.other,b=!!(o&&S.blocked.has(o.id))
  $('composer').hidden=b
  $('blockedBar').hidden=!b
  if(b)$('blockedBar').innerHTML='Bloqueaste '+esc(o.name||'esta pessoa')+'. Nenhum de vocês pode enviar mensagens.<button class="btn btn-ghost" onclick="unblockUser()">Desbloquear</button>'
}
function askBlock(){
  const o=S.active.other
  $('safety').innerHTML='<div class="confirm-box"><b>Bloquear '+esc(firstName(o.name)||'esta pessoa')+'?</b><br>Deixam de poder enviar mensagens um ao outro. A pessoa não é avisada. Podes desbloquear quando quiseres.<div class="row2"><button class="btn btn-ghost" onclick="openInfo()">Cancelar</button><button class="btn btn-dark" onclick="blockUser()">Bloquear</button></div></div>'
}
async function blockUser(silent){
  const o=S.active.other
  const{error}=await db.from('user_blocks').insert({blocker_id:S.me,blocked_id:o.id})
  if(error&&!/duplicate|23505/.test(error.message||'')){toast('Não foi possível bloquear');return false}
  S.blocked.add(o.id)
  renderBlocked();renderList()
  if(!silent){closeInfo();toast((firstName(o.name)||'Utilizador')+' foi bloqueado')}
  return true
}
async function unblockUser(){
  const o=S.active.other
  const{error}=await db.from('user_blocks').delete().eq('blocker_id',S.me).eq('blocked_id',o.id)
  if(error){toast('Não foi possível desbloquear');return}
  S.blocked.delete(o.id)
  renderBlocked();renderList();closeInfo()
  toast('Desbloqueado')
}
const MOTIVOS=['Pede pagamento adiantado ou dados bancários','Parece burla ou perfil falso','Linguagem ofensiva ou assédio','Spam ou publicidade','Outro motivo']
function openReport(){
  if(!S.active)return
  const o=S.active.other
  if(!$('info').classList.contains('open')){$('info').classList.add('open');$('scrim').classList.add('on')}
  $('infoBody').innerHTML='<form class="report" id="reportForm" onsubmit="event.preventDefault();sendReport()"><div class="info-sec" style="border:0"><h4>Denunciar '+esc(o.name||'utilizador')+'</h4>'+
    MOTIVOS.map((m,i)=>'<label class="opt"><input type="radio" name="motivo" value="'+i+'"'+(i===0&&S.msgs.some(x=>x.sender_id!==S.me&&riscoAviso(x.content))?' checked':'')+'>'+esc(m)+'</label>').join('')+
    '<label class="sr" for="repTxt">Detalhes</label><textarea id="repTxt" maxlength="1500" placeholder="Conta-nos o que aconteceu (opcional)"></textarea>'+
    '<label class="opt" style="border:0"><input type="checkbox" id="repBlock" checked>Bloquear também esta pessoa</label>'+
    '<p class="note">A equipa da Flinko recebe a denúncia com as últimas mensagens desta conversa, para poder analisar. A pessoa não é avisada.</p>'+
    '<div class="err" id="repErr" hidden></div>'+
    '<div class="info-actions"><button class="btn btn-dark" id="repBtn" type="submit">Enviar denúncia</button><button class="btn btn-ghost" type="button" onclick="openInfo()">Cancelar</button></div></div></form>'
}
async function sendReport(){
  const o=S.active.other,err=$('repErr'),btn=$('repBtn')
  const sel=document.querySelector('#reportForm input[name=motivo]:checked')
  err.hidden=true
  if(!sel){err.textContent='Escolhe um motivo.';err.hidden=false;return}
  btn.disabled=true
  const{data:{session}}=await db.auth.getSession()
  const recentes=S.msgs.filter(m=>!String(m.id).startsWith('tmp-')).slice(-12)
    .map(m=>'['+new Date(m.created_at).toLocaleString('pt-PT')+'] '+(m.sender_id===S.me?'Denunciante':(o.name||'Denunciado'))+': '+(String(m.content||'').trim()||'(foto)')).join('\n')
  const detalhe=$('repTxt').value.trim()
  const texto=('Motivo: '+MOTIVOS[+sel.value]+(detalhe?'\n\n'+detalhe:'')+(recentes?'\n\nÚltimas mensagens:\n'+recentes:'')).slice(0,4900)
  const{error}=await db.from('support_tickets').insert({kind:'denuncia',name:(S.myName||'Utilizador').slice(0,120),email:(session&&session.user&&session.user.email)||'',
    subject:('Denúncia nas mensagens: '+MOTIVOS[+sel.value]).slice(0,200),message:texto,target_profile_id:o.id,reporter_id:S.me,
    page:('messages.html'+(S.active.id?'?c='+S.active.id:'')).slice(0,300)})
  btn.disabled=false
  if(error){err.textContent=/limite|limit|demasiad/i.test(error.message||'')?'Já enviaste várias denúncias na última hora. Tenta mais tarde.':'Não foi possível enviar a denúncia. Tenta outra vez.';err.hidden=false;return}
  if($('repBlock').checked&&!S.blocked.has(o.id))await blockUser(true)
  closeInfo()
  toast('Denúncia enviada. Obrigado, vamos analisar.')
}
function closeInfo(){$('info').classList.remove('open');if(!$('sheet').classList.contains('open'))$('scrim').classList.remove('on')}

/* ============ tempo real ============ */
function subscribe(){
  const ch=db.channel('fk-messages')
  ch.on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>onInsert(p.new))
  ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>onUpdate(p.new))
  ch.on('postgres_changes',{event:'*',schema:'public',table:'message_reactions'},p=>onReaction(p))
  ch.subscribe()
}
async function onInsert(m){
  if(!m)return
  const conv=S.convs.find(c=>c.id===m.conversation_id)
  if(!conv){await loadConversations();return}
  if(m.sender_id===S.me&&S.active===conv&&S.msgs.some(x=>x.id===m.id||(x._status==='sending'&&x.content===m.content)))return
  conv.last_message=snippet(m);conv.last_message_at=m.created_at;conv.count=(conv.count||0)+1
  conv.lastMine=m.sender_id===S.me;conv.lastRead=false
  if(S.active===conv){
    if(S.msgs.some(x=>x.id===m.id))return
    await signUrls([m])
    const wasNear=nearBottom()
    S.msgs.push(m);S.reactions[m.id]=[]
    S.typingUntil=0;renderSub()
    renderFeed()
    if(wasNear)scrollToBottom(true);else{S.newWhileUp++;updateJump()}
    markRead()
  }else if(m.sender_id!==S.me){
    conv.unread=(conv.unread||0)+1
  }
  renderList()
}
function onUpdate(m){
  if(!m)return
  const conv=S.convs.find(c=>c.id===m.conversation_id)
  if(conv&&m.sender_id===S.me&&m.read){conv.lastRead=true;renderList()}
  if(S.active&&S.active.id===m.conversation_id){
    const x=S.msgs.find(y=>y.id===m.id)
    if(x&&x.read!==m.read){x.read=m.read;x.read_at=m.read_at;rerenderRow(x.id)}
  }
}
function onReaction(p){
  const r=p.new&&p.new.message_id?p.new:p.old
  if(!r||!S.msgs.some(m=>m.id===r.message_id))return
  let L=(S.reactions[r.message_id]||[]).filter(x=>x.user_id!==r.user_id)
  if(p.eventType!=='DELETE'&&p.new&&p.new.emoji)L=L.concat({message_id:r.message_id,user_id:r.user_id,emoji:p.new.emoji})
  S.reactions[r.message_id]=L
  rerenderRow(r.message_id)
}

// "a escrever…": aviso efémero entre os dois, sem passar pela base de dados
function joinTyping(convId){
  try{
    if(S.typingCh){db.removeChannel?db.removeChannel(S.typingCh):S.typingCh.unsubscribe()}
    const ch=db.channel('fk-typing-'+convId)
    ch.on('broadcast',{event:'typing'},p=>{
      if(!p||!p.payload||p.payload.user===S.me||!S.active||S.active.id!==convId)return
      S.typingUntil=Date.now()+3500
      renderSub();renderList()
      const tr=$('typingRow');if(tr){const near=nearBottom();tr.classList.add('on');if(near)scrollToBottom(true)}
      clearTimeout(joinTyping._t)
      joinTyping._t=setTimeout(()=>{if(S.typingUntil<=Date.now()){renderSub();renderList();const t2=$('typingRow');if(t2)t2.classList.remove('on')}},3600)
    })
    ch.subscribe()
    S.typingCh=ch
  }catch(e){}
}
function sendTyping(){
  if(!S.typingCh||typeof S.typingCh.send!=='function'||!input.value.trim())return
  if(Date.now()-S.lastTypingSent<2500)return
  S.lastTypingSent=Date.now()
  try{S.typingCh.send({type:'broadcast',event:'typing',payload:{user:S.me}})}catch(e){}
}

// "online": quem tem as mensagens abertas neste momento
function presence(){
  try{
    const ch=db.channel('fk-online',{config:{presence:{key:S.me}}})
    if(typeof ch.presenceState!=='function')return
    ch.on('presence',{event:'sync'},()=>{
      S.online=new Set(Object.keys(ch.presenceState()))
      renderList();if(S.active){renderSub();const a=$('hAv');if(a)a.classList.toggle('online',S.online.has(S.active.other.id))}
    })
    ch.subscribe(st=>{if(st==='SUBSCRIBED'&&typeof ch.track==='function')ch.track({at:Date.now()})})
  }catch(e){}
}
