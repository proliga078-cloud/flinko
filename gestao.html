<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flinko · Gestão</title>
<style>
:root{
  --bg:#f4f5f8;--card:#fff;--ink:#1c2033;--mut:#6b7186;--line:#e6e8ef;
  --side:#161a2b;--side-ink:#aab0c6;--acc:#f26a1b;--acc2:#fff1e8;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--blue:#2563eb;--pur:#7c3aed;--teal:#0d9488;
  --r:14px;--sh:0 1px 2px rgba(20,24,40,.05),0 4px 14px rgba(20,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1220;--card:#181c30;--ink:#eceef7;--mut:#8e94ad;--line:#262b44;--side:#0a0d19;--acc2:#2b1d14;--sh:0 1px 2px rgba(0,0,0,.3)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
a{color:var(--acc)}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:30px;width:100%;max-width:380px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo b{color:var(--acc)}
.lbox p{color:var(--mut);margin:6px 0 18px}
label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.bad{background:var(--bad)}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
/* layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
aside .logo{color:#fff;padding:4px 10px 16px}
aside nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;border:0;background:none;color:inherit;text-align:left}
.nv:hover{background:rgba(255,255,255,.06)}
.nv.on{background:var(--acc);color:#fff}
.nv .ic{width:20px;text-align:center}
.nv .bd{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
aside .btn.sec{color:var(--side-ink);border-color:rgba(255,255,255,.2)}
.ng{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#6b7391;padding:12px 11px 4px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .cd{background:var(--card);border-radius:8px;min-height:88px;padding:4px 6px;font-size:11px;overflow:hidden;cursor:pointer}
.cal .cd.o{opacity:.35;cursor:default}.cal .cd.t{outline:2px solid var(--acc)}
.ev{display:block;border-radius:4px;padding:1px 4px;margin-top:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details summary{list-style:revert}
.who{font-size:12px;padding:10px;border-top:1px solid rgba(255,255,255,.08);word-break:break-all}
main{padding:24px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;letter-spacing:-.3px}
.top .sub{color:var(--mut)}
.top .sp{flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.pill.ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.pill.warn{background:#fef3c7;color:#92400e;border-color:#fde68a}
.pill.bad{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.pill.acc{background:var(--acc2);color:var(--acc);border-color:transparent}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;min-width:0}
.card h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.kpi .lb{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.8px;margin:2px 0}
.kpi .d{font-size:12px;color:var(--mut)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.sec{margin:26px 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--bg)}
.tw{overflow:auto;max-width:100%}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.fun{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;padding:6px 0}
.fun .fb{height:26px;background:var(--acc2);border-radius:8px;overflow:hidden}
.fun .fb i{display:block;height:100%;background:var(--acc);border-radius:8px;min-width:2px}
.fun .n{text-align:right;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{width:auto;min-width:150px}
.sug{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sug:last-child{border:0}
.sug .t{flex:1}
.kb{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:12px}
.kb .col{background:var(--bg);border-radius:12px;padding:10px;min-height:120px}
.kb h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--mut);letter-spacing:.5px}
.tk{background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:var(--sh)}
.tk .tt{font-weight:600}
.tk .mt{font-size:12px;color:var(--mut);margin:4px 0 8px}
.tk .ac{display:flex;gap:6px;flex-wrap:wrap}
svg text{fill:var(--mut);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
/* drawer + modal */
#ov{position:fixed;inset:0;background:rgba(10,12,25,.5);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);z-index:41;padding:22px;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
#modal{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:rgba(10,12,25,.55);padding:16px}
#modal .mb{background:var(--card);border-radius:16px;padding:22px;max-width:420px;width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;margin:12px 0}
.kv span:nth-child(odd){color:var(--mut)}
.note{background:var(--acc2);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.mut{color:var(--mut)}
.mob{display:none}
@media print{aside,.tools,.btn,.mob,#ov,#drawer{display:none!important}#app{display:block}main{padding:0}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}
@media (max-width:860px){
  .cal .cd{min-height:56px}.ev{font-size:0;height:6px;padding:0}
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:230px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  main{padding:16px 14px 60px}
  .mob{display:inline-block}
  .kb{grid-template-columns:1fr}
  .fun{grid-template-columns:110px 1fr 70px}
}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <div class="logo">Flin<b>ko</b> · Gestão</div>
    <p>Entra com a conta de administrador do Flinko.</p>
    <form id="lf">
      <label class="f">Email</label><input id="em" type="email" autocomplete="username" required>
      <label class="f">Palavra-passe</label><input id="pw" type="password" autocomplete="current-password" required>
      <div class="err" id="lerr"></div>
      <div class="row" style="margin-top:8px">
        <button class="btn" type="submit">Entrar</button>
        <button class="btn sec" type="button" id="demoBtn">Ver demonstração</button>
      </div>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="logo">Flin<b>ko</b> · Gestão</div>
    <button class="btn sec sm" onclick="openSearch()" style="margin:0 6px 8px">🔍 Pesquisar · Ctrl+K</button>
    <nav id="nav"></nav>
    <div class="who"><div id="whoami"></div><button class="btn sec sm" id="logout" style="margin-top:8px">Sair</button></div>
  </aside>
  <main id="main"></main>
</div>

<div id="ov" class="hidden"></div>
<div id="drawer" class="hidden"></div>
<div id="modal" class="hidden"></div>

<script>
"use strict";
/* ============ CONFIG ============ */
const SB_URL = "https://cdwinidhtfxfxowflize.supabase.co";
const SB_KEY = "sb_publishable_G1U9iSJLR2JkhD9gvfyY3Q_qaqnMaUk"; // chave pública (anon)
const DAY = 864e5;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = v => (v || 0).toLocaleString("pt-PT", { style: "currency", currency: "EUR", maximumFractionDigits: v % 1 ? 2 : 0 });
const num = v => (v || 0).toLocaleString("pt-PT");
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const now = () => Date.now();
const dkey = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const fdate = d => d ? new Date(d).toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit", year: "numeric" }) : "—";
const ago = d => { if (!d) return "—"; const n = Math.floor((now() - new Date(d)) / DAY); return n <= 0 ? "hoje" : n === 1 ? "ontem" : "há " + n + " dias"; };
const ls = { get(k, f) { if (k !== "fk_session" && DEMO) return f; try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } }, set(k, v) { if (k !== "fk_session" && DEMO) return; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());

/* ============ AUTH + API ============ */
let session = ls.get("fk_session", null);
let DEMO = false;

async function authFetch(path, body) {
  const r = await fetch(SB_URL + "/auth/v1/" + path, { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || "Falha no início de sessão");
  return j;
}
async function refresh() {
  if (!session?.refresh_token) throw new Error("Sessão expirada");
  const j = await authFetch("token?grant_type=refresh_token", { refresh_token: session.refresh_token });
  session = { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user };
  ls.set("fk_session", session);
}
async function api(path, opt = {}, retry = true) {
  if (DEMO) return demoApi(path, opt);
  const r = await fetch(SB_URL + "/rest/v1/" + path, {
    method: opt.method || "GET",
    headers: Object.assign({ apikey: SB_KEY, Authorization: "Bearer " + session.access_token, "Content-Type": "application/json", Prefer: "return=representation" }, opt.headers || {}),
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  if (r.status === 401 && retry) { await refresh(); return api(path, opt, false); }
  const t = await r.text();
  if (!r.ok) { let m = t; try { m = JSON.parse(t).message || t; } catch (e) { } const e = new Error(m); e.status = r.status; throw e; }
  return t ? JSON.parse(t) : [];
}

/* ============ STORAGE (tarefas, CRM, definições) ============ */
const store = { cloud: false, tasks: [], crm: {}, settings: {} };
const DEFAULTS = {
  prices: { starter: 9.99, pro: 19.99, premium: 29.99 },
  aiFee: 2.99,
  costs: [{ name: "Domínio flinko.pt", amount: 0 }, { name: "Supabase", amount: 0 }, { name: "Netlify", amount: 0 }, { name: "Email / outros", amount: 0 }],
  goals: { pros: 100, clients: 50, reviews: 20, mrr: 100 },
  proj: { newPros: 10, conv: 5, growth: 5, avgPrice: 19.99 }
};
async function loadStore() {
  if (DEMO && store._init) return;
  store._init = true;
  try {
    const [t, c, s] = await Promise.all([api("admin_tasks?select=*&order=created_at.desc"), api("admin_crm?select=*"), api("admin_settings?select=*")]);
    store.tasks = t; store.crm = Object.fromEntries(c.map(x => [x.profile_id, x]));
    store.settings = Object.fromEntries(s.map(x => [x.key, x.value]));
    if (!(await loadItems())) throw new Error("admin_items em falta");
    store.cloud = true;
  } catch (e) {
    store.cloud = false;
    store.tasks = ls.get("fk_tasks", []); store.crm = ls.get("fk_crm", {}); store.settings = ls.get("fk_settings", {}); store.items = ls.get("fk_items", {});
  }
}
const setting = k => store.settings[k] ?? DEFAULTS[k];
async function saveSetting(k, v) {
  store.settings[k] = v;
  if (store.cloud) await api("admin_settings", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: { key: k, value: v } });
  else ls.set("fk_settings", store.settings);
}
async function saveTask(t) {
  const i = store.tasks.findIndex(x => x.id === t.id);
  if (i >= 0) store.tasks[i] = t; else store.tasks.unshift(t);
  if (store.cloud) await api("admin_tasks", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: t });
  else ls.set("fk_tasks", store.tasks);
}
async function delTask(id) {
  store.tasks = store.tasks.filter(x => x.id !== id);
  if (store.cloud) await api("admin_tasks?id=eq." + id, { method: "DELETE", headers: { Prefer: "return=minimal" } });
  else ls.set("fk_tasks", store.tasks);
}
async function saveCrm(pid, patch) {
  const cur = store.crm[pid] || { profile_id: pid, stage: "novo", notes: "", next_contact: null };
  const nv = Object.assign({}, cur, patch, { profile_id: pid, updated_at: new Date().toISOString() });
  store.crm[pid] = nv;
  if (store.cloud) await api("admin_crm", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: nv });
  else ls.set("fk_crm", store.crm);
}

/* ============ CARREGAR DADOS ============ */
let D = {}, M = {}, LOADERR = [];
const TABLES = {
  profiles: "profiles?select=id,name,category,location,plan,plan_expires_at,verified,approved,suspended,is_admin,is_demo,created_at,account_type,bio,photo_url,cover_url,slug,stripe_subscription_id,ai_profile_builder_unlocked,ai_profile_builder_paid_at,credits,avg_response_minutes&order=created_at.desc&limit=5000",
  private: "profile_private?select=profile_id,phone&limit=5000",
  services: "services?select=id,professional_id,price_from,price_to,created_at&limit=5000",
  portfolio: "portfolio_items?select=id,professional_id,created_at&limit=5000",
  reviews: "reviews?select=id,professional_id,rating,created_at&limit=5000",
  conversations: "conversations?select=id,professional_id,client_id,last_message,last_message_at,created_at&order=last_message_at.desc&limit=5000",
  messages: "messages?select=id,conversation_id,sender_id,read,created_at&limit=10000",
  requests: "requests?select=id,client_id,title,category,location,status,is_urgent,budget_from,budget_to,created_at&order=created_at.desc&limit=5000",
  offers: "request_offers?select=id,request_id,professional_id,created_at&limit=5000",
  jobs: "jobs?select=id,professional_id,status,quote_amount,paid_amount,paid_at,created_at&limit=5000",
  visits: "site_visits?select=visitor_id,user_id,path,referrer,created_at&order=created_at.desc&limit=20000",
  pviews: "profile_views?select=profile_id,viewed_at&limit=20000",
  gdpr: "gdpr_requests?select=id,profile_id,request_type,status,created_at,resolved_at&order=created_at.desc&limit=500",
  verif: "verification_requests?select=id,profile_id,status,created_at,resolved_at&order=created_at.desc&limit=500",
  ads: "ad_slots?select=id,professional_id,credits_spent,status,starts_at,ends_at&limit=1000",
  notif: "notification_queue?select=id,status,kind,created_at&limit=5000",
  push: "push_subscriptions?select=id,profile_id&limit=5000",
  saved: "saved_professionals?select=id&limit=5000",
  referrals: "signup_referrals?select=id&limit=5000"
};
async function loadAll() {
  LOADERR = [];
  const keys = Object.keys(TABLES);
  const res = await Promise.all(keys.map(k => api(TABLES[k]).catch(e => { LOADERR.push(k + ": " + e.message); return []; })));
  D = Object.fromEntries(keys.map((k, i) => [k, res[i]]));
  await loadStore();
  compute();
  takeSnapshot().catch(() => { });
}

/* ============ CÁLCULOS ============ */
function compute() {
  const t = now(), d7 = t - 7 * DAY, d14 = t - 14 * DAY, d30 = t - 30 * DAY;
  const P = D.profiles.filter(p => !p.is_demo && !p.is_admin);           // contas reais
  const ignoreIds = new Set(D.profiles.filter(p => p.is_demo || p.is_admin).map(p => p.id));
  const pros = P.filter(p => p.account_type !== "client");
  const clients = P.filter(p => p.account_type === "client");
  const phone = Object.fromEntries(D.private.map(x => [x.profile_id, x.phone]));
  const cnt = (arr, key) => arr.reduce((m, x) => (m[x[key]] = (m[x[key]] || 0) + 1, m), {});
  const svc = cnt(D.services, "professional_id"), port = cnt(D.portfolio, "professional_id"), rev = cnt(D.reviews, "professional_id");
  const convByPro = cnt(D.conversations, "professional_id"), offByPro = cnt(D.offers, "professional_id");
  const viewsByPro = cnt(D.pviews, "profile_id");

  /* completude do perfil (0-100) */
  const chk = p => [
    ["Categoria", 15, !!p.category], ["Localização", 10, !!p.location], ["Bio", 15, !!(p.bio && p.bio.trim())],
    ["Foto", 15, !!p.photo_url], ["Capa", 5, !!p.cover_url], ["Serviço", 15, !!svc[p.id]],
    ["Portfólio", 10, !!port[p.id]], ["Verificado", 10, !!p.verified], ["Telemóvel", 5, !!phone[p.id]]
  ];
  pros.forEach(p => { p._chk = chk(p); p._score = p._chk.reduce((s, c) => s + (c[2] ? c[1] : 0), 0); p._missing = p._chk.filter(c => !c[2]).map(c => c[0]); p._phone = phone[p.id] || ""; p._views = viewsByPro[p.id] || 0; p._conv = convByPro[p.id] || 0; p._svc = svc[p.id] || 0; });

  /* tráfego sem as visitas do admin/demo */
  const V = D.visits.filter(v => !(v.user_id && ignoreIds.has(v.user_id)));
  const inWin = (arr, f, a, b) => arr.filter(x => { const q = new Date(x[f]).getTime(); return q >= a && q < b; });
  const uniq = arr => new Set(arr.map(v => v.visitor_id)).size;
  const v7 = inWin(V, "created_at", d7, t + DAY), vp7 = inWin(V, "created_at", d14, d7), v30 = inWin(V, "created_at", d30, t + DAY);
  const su7 = inWin(P, "created_at", d7, t + DAY).length, sup7 = inWin(P, "created_at", d14, d7).length;

  /* pagamentos */
  const prices = setting("prices");
  const activePaid = P.filter(p => p.plan && p.plan !== "free" && (!p.plan_expires_at || new Date(p.plan_expires_at) > t));
  const mrr = activePaid.reduce((s, p) => s + (prices[p.plan] || 0), 0);
  const aiUnlocked = P.filter(p => p.ai_profile_builder_unlocked);
  const aiRev = aiUnlocked.length * setting("aiFee");
  const adCredits = D.ads.reduce((s, a) => s + (+a.credits_spent || 0), 0);
  const gmv = D.jobs.reduce((s, j) => s + (+j.paid_amount || 0), 0);

  /* funil */
  const conProIds = new Set(D.conversations.map(c => c.professional_id));
  const funnel = [
    ["Registados (profissionais)", pros.length],
    ["Com categoria e localização", pros.filter(p => p.category && p.location).length],

/* ============ CÁLCULOS EXTRA (atividade, coortes, qualidade) ============ */
function computeExtra() {
  const t = now(), users = M.P;
  const act = {}; D.visits.forEach(v => { if (v.user_id) (act[v.user_id] = act[v.user_id] || []).push(new Date(v.created_at).getTime()); });
  users.forEach(p => { const a = act[p.id] || []; p._last = a.length ? Math.max(...a) : null; p._nv = a.length; p._act = a; });
  const active = d => users.filter(p => p._last && p._last > t - d * DAY).length;
  M.dau = active(1); M.wau = active(7); M.mau = active(30);
  M.stick = M.mau ? Math.round(M.wau / M.mau * 100) : 0;
  const created = p => new Date(p.created_at).getTime();
  M.neverBack = M.pros.filter(p => t - created(p) > 3 * DAY && !p._act.some(x => x - created(p) > DAY));
  M.dormant = M.pros.filter(p => p._last && t - p._last > 30 * DAY);
  M.atRisk = M.pros.filter(p => p._last && t - p._last > 14 * DAY && t - p._last <= 30 * DAY);
  /* coortes semanais (últimas 8 semanas) */
  M.cohorts = [];
  const convPros = new Set(D.conversations.map(c => c.professional_id));
  for (let w = 7; w >= 0; w--) {
    const a = t - (w + 1) * 7 * DAY, b = a + 7 * DAY, us = M.pros.filter(p => created(p) >= a && created(p) < b);
    const ret = k => { const el = us.filter(p => created(p) + (k + 1) * 7 * DAY <= t); return { n: el.length, k: el.filter(p => p._act.some(x => x >= created(p) + k * 7 * DAY && x < created(p) + (k + 1) * 7 * DAY)).length }; };
    M.cohorts.push({ label: new Date(a).toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit" }), n: us.length, act: us.filter(p => p._score >= 60).length, conv: us.filter(p => convPros.has(p.id)).length, r1: ret(1), r2: ret(2), r4: ret(4) });
  }
  /* qualidade / suspeitos */
  const dup = {}; M.pros.forEach(p => { const k = d9(p._phone); if (k.length === 9) dup[k] = (dup[k] || 0) + 1; });
  M.susp = [];
  M.pros.forEach(p => {
    const why = [], days = Math.floor((t - created(p)) / DAY);
    if (/^(test|teste|asd|xxx|demo|aaa)/i.test(p.name.trim()) || p.name.trim().length < 3) why.push("nome suspeito");
    if (dup[d9(p._phone)] > 1) why.push("telemóvel repetido");
    if (!p.category && !p.bio && !p.photo_url && days > 14) why.push(`conta vazia há ${days} dias`);
    if (p.verified && p._score < 40) why.push("verificado com perfil muito incompleto");
    if (why.length) M.susp.push({ p, why });
  });
  const BAD = /(fuder|foder|merda|puta|caralho|porra|cabr[aã]o|idiota|burro|estúpido|estupido|filho da)/i, LINK = /(https?:\/\/|www\.)/i, PH = /(\+?351)?\s?9\d[\s.-]?\d{3}[\s.-]?\d{3}/;
  M.flags = [];
  D.conversations.forEach(c => { const m = c.last_message || ""; if (!m) return; const why = BAD.test(m) ? "linguagem ofensiva" : LINK.test(m) ? "contém ligação externa" : PH.test(m) ? "partilha de contacto fora da plataforma" : ""; if (why) M.flags.push({ c, why }); });
  const topOf = arr => { const o = {}; arr.forEach(x => o[x] = (o[x] || 0) + 1); const e = Object.entries(o).sort((a, b) => b[1] - a[1])[0]; return e ? { k: e[0], n: e[1], p: pct(e[1], arr.length) } : { k: "—", n: 0, p: 0 }; };
  M.topCat = topOf(M.pros.filter(p => p.category).map(p => p.category));
  M.topLoc = topOf(M.pros.filter(p => p.location).map(p => p.location.split("–")[0].trim()));
  M.regPhones = new Set(M.pros.map(p => d9(p._phone)).filter(x => x.length === 9));
}

  if (DEMO) { if (!items("snapshot").length) { const a = []; for (let i = 30; i >= 0; i--) { const k = 30 - i; a.push({ id: uid(), date: dkey(now() - i * DAY), pros: 10 + Math.round(k * .6), clients: 1 + Math.round(k * .1), wau: 3 + Math.round(k * .5), mau: 6 + Math.round(k * .7), mrr: k > 20 ? 20 : 0, leads: 5 + k, score: 40 + Math.round(k / 3), cash: 500 - k * 4 }); } store.items.snapshot = a; } return; }
  const td = today(); if (items("snapshot").some(s => s.date === td)) return;
  const S = ledgerStats();
  await saveItem("snapshot", { date: td, pros: M.pros.length, clients: M.clients.length, verified: M.pros.filter(p => p.verified).length, wau: M.wau, mau: M.mau, convs: D.conversations.length, requests: D.requests.length, reviews: M.rev, mrr: M.mrr, leads: items("lead").length, score: M.avgScore, cash: S.cash });
}
const DERIV = { pros: ["Profissionais", () => M.pros], clients: ["Clientes", () => M.clients], convs: ["Conversas", () => D.conversations], requests: ["Pedidos", () => D.requests], reviews: ["Avaliações", () => D.reviews], services: ["Serviços publicados", () => D.services] };
const SNAPM = { wau: "Ativos (7 dias)", mau: "Ativos (30 dias)", mrr: "MRR (€)", leads: "Leads", score: "Qualidade média dos perfis", cash: "Caixa (€)" };
let hMetric = "pros", hDays = 90;
function cumSeries(arr, days) {
  const t = new Date(); t.setHours(23, 59, 59, 999); const ts = arr.map(x => new Date(x.created_at).getTime()).sort((a, b) => a - b);
  return Array.from({ length: days }, (_, i) => { const end = t.getTime() - (days - 1 - i) * DAY; let n = 0; while (n < ts.length && ts[n] <= end) n++; return { x: dkey(end), y: n }; });
}
const vHistory = () => {
  const d = DERIV[hMetric], snaps = items("snapshot").sort((a, b) => a.date < b.date ? -1 : 1);
  const at = (arr, ago) => { const a = arr; return a.length ? a[Math.max(0, a.length - 1 - ago)].y : 0; };
  const growth = Object.entries(DERIV).map(([k, [l, f]]) => { const s = cumSeries(f(), 31), n = s[30].y, w = s[23].y, m = s[0].y; return `<tr><td>${l}</td><td><b>${n}</b></td><td>${w}</td><td>${m}</td><td class="${n - w >= 0 ? "up" : "dn"}">${n - w >= 0 ? "+" : ""}${n - w} (${w ? pct(n - w, w) : "—"}${w ? "%" : ""})</td><td class="${n - m >= 0 ? "up" : "dn"}">${n - m >= 0 ? "+" : ""}${n - m} (${m ? pct(n - m, m) : "—"}${m ? "%" : ""})</td></tr>`; }).join("");
  const chart = d ? lineChart([{ name: d[0], data: cumSeries(d[1](), hDays), color: COL[0] }], { area: true, fmtX: x => x.slice(8) + "/" + x.slice(5, 7) })
    : (snaps.length >= 2 ? lineChart([{ name: SNAPM[hMetric], data: snaps.map(s => ({ x: s.date, y: +s[hMetric] || 0 })), color: COL[1] }], { area: true, fmtX: x => x.slice(8) + "/" + x.slice(5, 7) }) : `<p class="mut">Ainda só há ${snaps.length} registo(s) diário(s). O painel guarda uma fotografia dos números cada dia em que o abres; volta amanhã para veres a linha.</p>`);
  return head("Histórico", "Evolução real dos números ao longo do tempo") +
    `<div class="card"><h3>Evolução <span class="sp"></span></h3><div class="tools"><select onchange="hMetric=this.value;render()"><optgroup label="Reconstruído a partir das datas de criação">${Object.entries(DERIV).map(([k, v]) => `<option value="${k}" ${hMetric === k ? "selected" : ""}>${v[0]}</option>`).join("")}</optgroup><optgroup label="Fotografias diárias do painel">${Object.entries(SNAPM).map(([k, v]) => `<option value="${k}" ${hMetric === k ? "selected" : ""}>${v}</option>`).join("")}</optgroup></select>${DERIV[hMetric] ? `<select onchange="hDays=+this.value;render()">${[30, 90, 180, 365].map(n => `<option value="${n}" ${hDays === n ? "selected" : ""}>${n} dias</option>`).join("")}</select>` : ""}</div>${chart}</div>
    <div class="card" style="margin-top:14px"><h3>Crescimento</h3><div class="tw"><table><tr><th>Métrica</th><th>Hoje</th><th>Há 7 dias</th><th>Há 30 dias</th><th>Δ 7 dias</th><th>Δ 30 dias</th></tr>${growth}</table></div><p class="mut" style="margin:10px 0 0">Os totais históricos são recalculados a partir da data de criação de cada registo. Não contam contas entretanto apagadas.</p></div>`;
};

    <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Calendário de conteúdos <span class="sp"></span><button class="btn sm" onclick="addPost()">+ Publicação</button></h3>${P.map(p => `<div class="sug"><span class="t"><b>${fdate(p.date)}</b> · ${esc(p.channel)}<br><span class="mut">${esc(p.text)}</span></span><select onchange="setPost('${p.id}',this.value)" style="width:auto">${[["ideia", "Ideia"], ["agendado", "Agendado"], ["publicado", "Publicado"]].map(o => `<option value="${o[0]}" ${p.status === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}</select><button class="btn sec sm" onclick="confirmDel('post','${p.id}','esta publicação')">✕</button></div>`).join("") || `<span class="mut">Planeia o que vais publicar e quando.</span>`}</div>

/* ============ FATURAÇÃO ============ */
const nextInvNo = () => { const y = new Date().getFullYear(), n = items("invoice").filter(i => String(i.number).includes(y + "/")).length + 1; return `FT ${y}/${String(n).padStart(3, "0")}`; };

  const i = items("invoice").find(x => x.id === id);

  await saveItem("invoice", Object.assign({}, i, { status: "paga", paid_at: today() })); await saveItem("ledger", { date: today(), type: "receita", category: "Subscrições", desc: `${i.number} · ${i.client}`, amount: +i.net, ref: i.number }); render();
};
const vInvoices = () => {
  const I = items("invoice").slice().sort((a, b) => a.date < b.date ? 1 : -1), td = today(), live = I.filter(i => i.status !== "anulada" && i.status !== "rascunho");
  const m = td.slice(0, 7), q = Math.floor(new Date().getMonth() / 3), inQ = i => { const d = new Date(i.date); return d.getFullYear() === new Date().getFullYear() && Math.floor(d.getMonth() / 3) === q; };

    `<div class="note">Isto é um controlo interno. As faturas legais têm de ser emitidas em software certificado pela Autoridade Tributária. Confirma o enquadramento de IVA e os prazos com o teu contabilista.</div>

function scores() {

/* ============ GRÁFICOS (SVG simples, sem bibliotecas) ============ */
const COL = ["#f26a1b", "#2563eb", "#0d9488", "#7c3aed", "#d97706"];
const niceMax = m => m <= 4 ? 4 : Math.ceil(m / 4) * 4;
function axes(w, h, p, max, labels) {
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, y = h - p.b - (v / max) * (h - p.t - p.b); g += `<line x1="${p.l}" x2="${w - p.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${p.l - 6}" y="${y + 3}" text-anchor="end">${Math.round(v * 10) / 10}</text>`; }
  const step = Math.max(1, Math.ceil(labels.length / 7));
  labels.forEach((l, i) => { if (i % step === 0 || i === labels.length - 1) { const x = p.l + (labels.length > 1 ? i * (w - p.l - p.r) / (labels.length - 1) : 0); g += `<text x="${x}" y="${h - 6}" text-anchor="middle">${esc(l)}</text>`; } });
  return g;
}
function lineChart(series, o = {}) {
  const w = 700, h = o.h || 210, p = { l: 34, r: 12, t: 10, b: 24 }, n = series[0].data.length;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.data.map(d => d.y))));
  const X = i => p.l + (n > 1 ? i * (w - p.l - p.r) / (n - 1) : 0), Y = v => h - p.b - (v / max) * (h - p.t - p.b);
  const lab = series[0].data.map(d => o.fmtX ? o.fmtX(d.x) : d.x);
  let s = axes(w, h, p, max, lab);
  series.forEach((sr, k) => {
    const c = sr.color || COL[k], pts = sr.data.map((d, i) => `${X(i)},${Y(d.y)}`).join(" ");
    if (o.area && k === 0) s += `<polygon points="${p.l},${h - p.b} ${pts} ${X(n - 1)},${h - p.b}" fill="${c}" opacity=".12"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>`;
    if (n <= 31) sr.data.forEach((d, i) => { s += `<circle cx="${X(i)}" cy="${Y(d.y)}" r="3" fill="${c}"><title>${esc(lab[i])}: ${d.y} ${esc(sr.name)}</title></circle>`; });
  });
  const lg = series.length > 1 ? `<div class="legend">${series.map((s, k) => `<span><i style="background:${s.color || COL[k]}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${s}</svg>${lg}`;
}
function barChart(series, o = {}) { // barras empilhadas
  const w = 700, h = o.h || 210, p = { l: 34, r: 12, t: 10, b: 24 }, n = series[0].data.length;
  const tot = series[0].data.map((_, i) => series.reduce((s, sr) => s + sr.data[i].y, 0));
  const max = niceMax(Math.max(1, ...tot)), bw = (w - p.l - p.r) / n * .62, X = i => p.l + (i + .5) * (w - p.l - p.r) / n;
  const lab = series[0].data.map(d => d.x);
  let s = axes(w, h, p, max, lab).replace(/<text x="[\d.]+" y="\d+" text-anchor="middle">[^<]*<\/text>/g, "");
  lab.forEach((l, i) => { if (i % Math.max(1, Math.ceil(n / 8)) === 0 || i === n - 1) s += `<text x="${X(i)}" y="${h - 6}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach((sr, k) => sr.data.forEach((d, i) => {
    const below = series.slice(0, k).reduce((a, q) => a + q.data[i].y, 0), y0 = h - p.b - below / max * (h - p.t - p.b), hh = d.y / max * (h - p.t - p.b);
    if (d.y) s += `<rect x="${X(i) - bw / 2}" y="${y0 - hh}" width="${bw}" height="${hh}" rx="3" fill="${sr.color || COL[k]}"><title>${esc(lab[i])}: ${d.y} ${esc(sr.name)}</title></rect>`;
  }));
  const lg = series.length > 1 ? `<div class="legend">${series.map((s, k) => `<span><i style="background:${s.color || COL[k]}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${s}</svg>${lg}`;
}
const delta = (a, b) => { if (!b && !a) return `<span class="d">sem alteração</span>`; if (!b) return `<span class="d up">▲ novo</span>`; const p = Math.round((a - b) / b * 100); if (!p) return `<span class="d">igual aos 7 dias anteriores</span>`; return `<span class="d ${p >= 0 ? "up" : "dn"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p)}% vs 7 dias anteriores</span>`; };
const kpi = (lb, v, d = "") => `<div class="card kpi"><div class="lb">${lb}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
const bar = (v, max, cls = "") => `<div class="bar ${cls}"><i style="width:${Math.min(100, max ? v / max * 100 : 0)}%"></i></div>`;
const sc = s => s >= 80 ? "ok" : s >= 50 ? "warn" : "bad";

      <div class="card"><h3>Custos mensais <button class="btn sec sm" onclick="addCost()">+ linha</button></h3>${costs.map((c, i) => `<div class="row" style="margin-bottom:6px"><input value="${esc(c.name)}" onchange="editCost(${i},'name',this.value)" style="flex:2"><input type="number" step="0.01" min="0" value="${c.amount}" onchange="editCost(${i},'amount',this.value)" style="flex:1"><button class="btn sec sm" onclick="delCost(${i})">✕</button></div>`).join("")}<b>Total: ${eur(tc)}/mês</b></div></div>
    <div class="card" style="margin-top:14px"><h3>Projeção a 12 meses</h3>
      <div class="grid g4"><div><label class="f">Novos profissionais/mês</label><input type="number" min="0" value="${pj.newPros}" onchange="setProj('newPros',this.value)"></div><div><label class="f">Crescimento mensal (%)</label><input type="number" min="0" value="${pj.growth}" onchange="setProj('growth',this.value)"></div><div><label class="f">Conversão para pago (%)</label><input type="number" min="0" max="100" value="${pj.conv}" onchange="setProj('conv',this.value)"></div><div><label class="f">Preço médio (€/mês)</label><input type="number" step="0.01" min="0" value="${pj.avgPrice}" onchange="setProj('avgPrice',this.value)"></div></div>
      <div style="margin-top:14px">${lineChart([{ name: "Receita mensal", data: rows.map(r => ({ x: "M" + r.m, y: Math.round(r.rev) })), color: COL[0] }, { name: "Custos", data: rows.map(r => ({ x: "M" + r.m, y: Math.round(tc) })), color: "#dc2626" }])}</div>
      <div class="tw"><table><tr><th>Mês</th><th>Profissionais</th><th>Pagantes</th><th>Receita</th><th>Resultado</th><th>Acumulado</th></tr>${rows.map(r => `<tr><td>M${r.m}</td><td>${r.pros}</td><td>${r.paying}</td><td>${eur(r.rev)}</td><td class="${r.net >= 0 ? "up" : "dn"}">${eur(r.net)}</td><td class="${r.cum >= 0 ? "up" : "dn"}">${eur(r.cum)}</td></tr>`).join("")}</table></div></div>` + finExtra();
};
const setPrice = (k, v) => { const p = Object.assign({}, setting("prices")); p[k] = +v || 0; saveSetting("prices", p).then(() => { compute(); render(); }); };
const setProj = (k, v) => { const p = Object.assign({}, DEFAULTS.proj, setting("proj")); p[k] = +v || 0; saveSetting("proj", p).then(render); };
const editCost = (i, k, v) => { const c = setting("costs").map(x => Object.assign({}, x)); c[i][k] = k === "amount" ? +v || 0 : v; saveSetting("costs", c).then(render); };
const addCost = () => saveSetting("costs", setting("costs").concat([{ name: "Novo custo", amount: 0 }])).then(render);
const delCost = i => saveSetting("costs", setting("costs").filter((_, j) => j !== i)).then(render);

/* tarefas */
const PRI = { alta: "bad", media: "warn", baixa: "" };
function suggestions() {
  const s = [], has = t => store.tasks.some(x => x.title === t && x.status !== "done");
  const nv = M.pros.filter(p => !p.verified); nv.slice(0, 3).forEach(p => s.push(`Verificar ${p.name}`));
  M.pros.filter(p => !p.category).slice(0, 5).forEach(p => s.push(`Contactar ${p.name} para completar o perfil (falta categoria)`));
  M.gp.forEach(g => s.push(`Tratar pedido RGPD de ${nameOf(g.profile_id)}`));
  M.openReq.slice(0, 3).forEach(r => s.push(`Arranjar profissional para o pedido “${r.title}”`));
  const inactive = M.pros.filter(p => p.verified && !p._conv && !p._views).length; if (inactive) s.push(`Divulgar ${inactive} perfis verificados que ainda não tiveram visitas ou conversas`);
  const tl = items("ticket").filter(t => t.status !== "resolvido" && now() - new Date(t.date) > 2 * DAY).length; if (tl) s.push(`Responder a ${tl} pedido(s) de apoio fora do prazo de 48 h`);
  const il = items("invoice").filter(i => i.status === "emitida" && i.due && i.due < today()).length; if (il) s.push(`Cobrar ${il} fatura(s) em atraso`);
  const ld = leadsDue().length; if (ld) s.push(`Contactar ${ld} lead(s) em atraso na aquisição`);
  if (M.neverBack && M.neverBack.length) s.push(`Reativar ${M.neverBack.length} profissionais que nunca voltaram ao site`);
  if (M.flags && M.flags.length) s.push(`Moderar ${M.flags.length} conversa(s) com conteúdo assinalado`);
  return s.filter(t => !has(t));
}
const vTasks = () => {
  const cols = [["todo", "Por fazer"], ["doing", "Em curso"], ["done", "Feitas"]], sug = suggestions();
  return head("Tarefas", `${store.tasks.filter(t => t.status !== "done").length} em aberto${store.cloud ? "" : " · guardadas só neste navegador"}`) +
    `<div class="card" style="margin-bottom:14px"><h3>Nova tarefa</h3><form class="row" onsubmit="addTask(event)"><input id="ttl" placeholder="O que tens de fazer?" required style="flex:3;min-width:220px"><input id="tdue" type="date" style="flex:1;min-width:140px"><select id="tpri" style="flex:1;min-width:110px"><option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option></select><button class="btn">Adicionar</button></form></div>
    <div class="kb">${cols.map(([k, l]) => `<div class="col"><h4>${l} (${store.tasks.filter(t => t.status === k).length})</h4>${store.tasks.filter(t => t.status === k).sort((a, b) => (a.due_date || "9") < (b.due_date || "9") ? -1 : 1).map(t => `<div class="tk"><div class="tt">${esc(t.title)}</div><div class="mt">${t.profile_id ? "👤 " + esc(nameOf(t.profile_id)) + " · " : ""}<span class="pill ${PRI[t.priority] || ""}">${esc(t.priority || "media")}</span> ${t.due_date ? (new Date(t.due_date) < now() - DAY && t.status !== "done" ? `<span class="dn">atrasada · ${fdate(t.due_date)}</span>` : "até " + fdate(t.due_date)) : ""}</div><div class="ac">${k !== "todo" ? `<button class="btn sec sm" onclick="moveTask('${t.id}','${k === "done" ? "doing" : "todo"}')">◀</button>` : ""}${k !== "done" ? `<button class="btn sm" onclick="moveTask('${t.id}','${k === "todo" ? "doing" : "done"}')">${k === "todo" ? "Iniciar" : "Concluir"} ▶</button>` : ""}<button class="btn sec sm" onclick="removeTask('${t.id}')">✕</button></div></div>`).join("") || `<span class="mut">—</span>`}</div>`).join("")}</div>
    ${sug.length ? `<div class="card" style="margin-top:14px"><h3>💡 Sugestões automáticas (a partir dos teus dados)</h3>${sug.map((t, i) => `<div class="sug"><span class="t">${esc(t)}</span><button class="btn sec sm" onclick="addSug(${i})">+ Criar tarefa</button></div>`).join("")}</div>` : ""}`;
};
const addTask = async e => { e.preventDefault(); await saveTask({ id: uid(), title: $("#ttl").value.trim(), status: "todo", priority: $("#tpri").value, due_date: $("#tdue").value || null, profile_id: null, created_at: new Date().toISOString() }); render(); };
const addSug = async i => { const t = suggestions()[i]; if (!t) return; await saveTask({ id: uid(), title: t, status: "todo", priority: "media", due_date: null, profile_id: null, created_at: new Date().toISOString() }); render(); };
const moveTask = async (id, st) => { const t = store.tasks.find(x => x.id === id); await saveTask(Object.assign({}, t, { status: st })); render(); };
const removeTask = async id => { if (await ask("Apagar tarefa", "Esta ação não pode ser desfeita.", "Apagar", true)) { await delTask(id); render(); } };
const askText = (title, ph) => new Promise(res => { const m = $("#modal"); m.classList.remove("hidden"); m.innerHTML = `<div class="mb"><h3 style="font-size:17px;margin-bottom:10px">${esc(title)}</h3><input id="mtx" placeholder="${esc(ph)}"><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" id="mno">Cancelar</button><button class="btn" id="myes">Criar</button></div></div>`; const done = v => { m.classList.add("hidden"); m.innerHTML = ""; res(v); }; $("#mno").onclick = () => done(null); $("#myes").onclick = () => done($("#mtx").value.trim()); $("#mtx").focus(); });
const newTaskFor = async pid => { const title = await askText("Nova tarefa para " + nameOf(pid), "O que tens de fazer?"); if (!title) return; await saveTask({ id: uid(), title, status: "todo", priority: "media", due_date: null, profile_id: pid, created_at: new Date().toISOString() }); toast("Tarefa criada"); openPro(pid); };

const vOps = () => {
  const gd = D.gdpr, days = g => Math.floor((now() - new Date(g.created_at)) / DAY), nq = s => D.notif.filter(n => n.status === s).length;
  return head("Operações", "Verificações, RGPD, notificações e saúde dos dados") +
    `<div class="grid g4">${kpi("Verificações pendentes", M.vp.length, `${D.verif.length} pedidos no total`)}${kpi("RGPD em aberto", M.gp.length, "prazo legal: 30 dias")}${kpi("Notificações enviadas", nq("sent"), `${nq("failed")} falharam · ${nq("pending")} pendentes`)}${kpi("Subscrições push", D.push.length, `${D.saved.length} favoritos · ${D.referrals.length} convites`)}</div>
    <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Pedidos RGPD</h3><div class="tw"><table><tr><th>Conta</th><th>Tipo</th><th>Estado</th><th>Em aberto</th></tr>${gd.map(g => `<tr><td>${esc(nameOf(g.profile_id))}</td><td>${g.request_type === "delete" ? "Eliminação" : "Exportação"}</td><td><span class="pill ${g.status === "completed" ? "ok" : "warn"}">${esc(g.status)}</span></td><td class="${days(g) > 20 && g.status !== "completed" ? "dn" : ""}">${g.status === "completed" ? "—" : days(g) + " dias"}</td></tr>`).join("") || `<tr><td colspan="4" class="mut">Sem pedidos.</td></tr>`}</table></div></div>
    <div class="card"><h3>Pedidos de verificação</h3><div class="tw"><table><tr><th>Profissional</th><th>Estado</th><th>Data</th></tr>${D.verif.map(v => `<tr><td>${esc(nameOf(v.profile_id))}</td><td><span class="pill ${v.status === "approved" ? "ok" : v.status === "pending" ? "warn" : ""}">${esc(v.status)}</span></td><td class="mut">${fdate(v.created_at)}</td></tr>`).join("") || `<tr><td colspan="3" class="mut">Sem pedidos.</td></tr>`}</table></div></div></div>
    <div class="card" style="margin-top:14px"><h3>Saúde da ligação aos dados</h3>${LOADERR.length ? LOADERR.map(e => `<div class="sug"><span class="pill bad">erro</span><span class="t">${esc(e)}</span></div>`).join("") : `<span class="pill ok">Todas as tabelas carregaram sem erros</span>`}</div>`;
};
const MIGRATION = `-- Tabelas privadas do painel de gestão (só administradores têm acesso)
create table if not exists public.admin_tasks (
  id uuid primary key default gen_random_uuid(),
  title text not null,
  status text not null default 'todo' check (status in ('todo','doing','done')),
  priority text default 'media',
  due_date date,
  profile_id uuid references public.profiles(id) on delete set null,
  created_at timestamptz not null default now()
);
create table if not exists public.admin_crm (
  profile_id uuid primary key references public.profiles(id) on delete cascade,
  stage text not null default 'novo',
  notes text default '',
  next_contact date,
  updated_at timestamptz default now()
);
create table if not exists public.admin_settings (
  key text primary key,
  value jsonb not null
);
create table if not exists public.admin_items (
  id uuid primary key default gen_random_uuid(),
  kind text not null,
  data jsonb not null default '{}'::jsonb,
  created_at timestamptz not null default now()
);
create index if not exists admin_items_kind_idx on public.admin_items(kind);
alter table public.admin_items enable row level security;
create policy admin_items_all on public.admin_items for all using (is_admin()) with check (is_admin());
alter table public.admin_tasks enable row level security;
alter table public.admin_crm enable row level security;
alter table public.admin_settings enable row level security;
create policy admin_tasks_all on public.admin_tasks for all using (is_admin()) with check (is_admin());
create policy admin_crm_all on public.admin_crm for all using (is_admin()) with check (is_admin());
create policy admin_settings_all on public.admin_settings for all using (is_admin()) with check (is_admin());`;
const vSet = () => {
  const g = setting("goals");
  return head("Definições", "Metas, armazenamento e ligação") +
    `<div class="grid g2"><div class="card"><h3>Metas</h3><div class="grid g3">${[["pros", "Profissionais"], ["clients", "Clientes"], ["reviews", "Avaliações"], ["mrr", "MRR (€)"]].map(([k, l]) => `<div><label class="f">${l}</label><input type="number" min="0" value="${g[k]}" onchange="setGoal('${k}',this.value)"></div>`).join("")}</div></div>
    <div class="card"><h3>Armazenamento de tarefas, CRM e definições</h3>${store.cloud ? `<span class="pill ok">Sincronizado no Supabase</span><p class="mut">Tarefas, notas e definições ficam guardadas na base de dados e ficam iguais em qualquer computador.</p>` : `<span class="pill warn">Só neste navegador</span><p class="mut">As tabelas <code>admin_tasks</code>, <code>admin_crm</code> e <code>admin_settings</code> ainda não existem no Supabase, por isso tudo é guardado apenas neste navegador. Para sincronizar, executa este SQL no Supabase (SQL Editor):</p><textarea readonly rows="10" onclick="this.select()" style="font:12px monospace">${esc(MIGRATION)}</textarea>`}</div></div>
    <div class="card" style="margin-top:14px"><h3>Como são calculados os números</h3><ul style="margin:0;padding-left:18px;line-height:1.8"><li><b>Contas reais</b>: todas as contas menos as de administrador e demo. As tuas visitas (com sessão iniciada) também são excluídas do tráfego.</li><li><b>Qualidade do perfil</b> (0–100): categoria 15, bio 15, foto 15, serviço 15, localização 10, portfólio 10, verificado 10, capa 5, telemóvel 5.</li><li><b>MRR</b>: nº de profissionais com plano pago e não expirado × preço do plano que defines em Finanças.</li><li><b>Funil</b>: cada passo conta profissionais que cumprem esse critério (não é obrigatório cumprir o anterior).</li><li><b>Nota global</b>: média de seis notas de 0 a 100 (ativação, retenção, procura, confiança, receita e operação). É um indicador de conjunto, não uma métrica oficial.</li><li><b>Histórico</b>: os totais são reconstruídos pelas datas de criação; MRR, caixa, leads e atividade só existem a partir do dia em que o painel começou a guardar fotografias diárias.</li><li><b>Projeção</b>: novos profissionais por mês, com crescimento composto, × conversão para pago × preço médio − custos.</li></ul></div>`;
};
const setGoal = (k, v) => { const g = Object.assign({}, setting("goals")); g[k] = +v || 0; saveSetting("goals", g); };

/* ============ NAVEGAÇÃO / ARRANQUE ============ */
const VIEWS = { cal: vCal, history: vHistory, marketing: vMarketing, support: vSupport, invoices: vInvoices, company: vCompany, investor: vInvestor, home: vHome, growth: vGrowth, leads: vLeads, pros: vPros, retention: vRetention, demand: vDemand, quality: vQuality, fin: vFin, strategy: vStrategy, compliance: vCompliance, tasks: vTasks, reports: vReports, ops: vOps, set: vSet };
function badgeOf(k) {
  if (k === "ops") return M.gp.length + M.vp.length;
  if (k === "leads") return leadsDue().length;
  if (k === "quality") return M.flags.length;
  if (k === "tasks") return store.tasks.filter(t => t.status !== "done" && t.due_date && new Date(t.due_date) < now() - DAY).length;
  if (k === "support") return items("ticket").filter(t => t.status !== "resolvido" && now() - new Date(t.date) > 2 * DAY).length;
  if (k === "invoices") return items("invoice").filter(i => i.status === "emitida" && i.due && i.due < today()).length;
  return 0;
}
function render() {
  $("#nav").innerHTML = NAVG.map(([g, L]) => `<div class="ng">${g}</div>` + L.map(([k, ic, l]) => { const b = badgeOf(k); return `<button class="nv ${view === k ? "on" : ""}" onclick="go('${k}')"><span class="ic">${ic}</span>${l}${b ? `<span class="bd">${b}</span>` : ""}</button>`; }).join("")).join("");
  $("#main").innerHTML = VIEWS[view]();
}
function go(v) { view = v; $("#side").classList.remove("open"); closeDrawer(); render(); scrollTo(0, 0); }
async function reload() { try { await loadAll(); render(); toast("Dados atualizados"); } catch (e) { toast("Erro: " + e.message); } }
async function start() {
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#main").innerHTML = `<p class="mut">A carregar dados…</p>`;
  $("#whoami").textContent = DEMO ? "Demonstração" : (session.user?.email || "");
  await loadAll(); render();
}
$("#lf").onsubmit = async e => {
  e.preventDefault(); $("#lerr").textContent = "";
  try {
    const j = await authFetch("token?grant_type=password", { email: $("#em").value.trim(), password: $("#pw").value });
    session = { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user }; ls.set("fk_session", session);
    const me = await api("profiles?select=is_admin&id=eq." + j.user.id);
    if (!me[0]?.is_admin) { session = null; ls.set("fk_session", null); throw new Error("Esta conta não tem permissões de administrador."); }
    $("#pw").value = ""; await start();
  } catch (err) { $("#lerr").textContent = err.message; }
};
$("#demoBtn").onclick = () => { DEMO = true; start(); };
$("#logout").onclick = () => { session = null; ls.set("fk_session", null); location.reload(); };
(async () => {
  if (new URLSearchParams(location.search).has("demo")) { DEMO = true; return start(); }
  if (session?.access_token) { try { const me = await api("profiles?select=is_admin&id=eq." + session.user.id); if (me[0]?.is_admin) return start(); } catch (e) { } }
})();
</script>
</body>
</html>
