<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Flinko · Gestão</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=optional" rel="stylesheet"/>
<style>
/* Painel de gestão novo (out/2026): 6 partes em vez de 29, e cada parte só
   carrega o que mostra. O painel antigo continua em /admin para o resto. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#132420;--muted:#4E5C57;--muted-2:#69756F;--line:#E3ECE7;--bg:#F5F7F6;--paper:#fff;
  --dark:#0F1F1A;--orange:#BB5C08;--orange-dark:#9A4A06;--orange-soft:#FBEBDD;
  --mint:#0F8B5F;--mint-dark:#0A6B49;--mint-soft:#E3F5EC;--red:#B42318;--red-soft:#FDECEA;--amber-soft:#FFF4D6;
  --radius:14px;--shadow:0 10px 30px -18px rgba(19,36,32,.35)
}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Plus Jakarta Sans','Inter',sans-serif;letter-spacing:-.02em;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}

/* Entrada */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:34px;width:100%;max-width:380px}
.login-card h1{font-size:1.5rem;margin-bottom:6px}
.login-card p{color:var(--muted);margin-bottom:20px}
.login-card label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 6px}
.login-card .btn{width:100%;margin-top:18px}
.erro{color:var(--red);font-size:.9rem;margin-top:10px}

/* Estrutura */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.lado{background:var(--dark);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.marca{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.3rem;padding:4px 12px 22px}
.marca span{color:#F08A3A}
.procurar{display:flex;align-items:center;gap:10px;margin:0 6px 14px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:rgba(255,255,255,.8);cursor:pointer;font-weight:600}
.procurar:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.procurar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.procurar kbd{margin-left:auto;font:inherit;font-size:.7rem;opacity:.6;border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:1px 5px}
.pq-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;cursor:pointer;padding:4px 0}
.pq-item:hover b{text-decoration:underline}
.nav .mais{display:none}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-decoration:none;color:rgba(255,255,255,.75);font-weight:600;position:relative}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav .conta{margin-left:auto;background:var(--orange);color:#fff;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px}
.lado .fundo{margin-top:auto;padding:12px;font-size:.82rem;color:rgba(255,255,255,.6);border-top:1px solid rgba(255,255,255,.1)}
.lado .fundo a{color:rgba(255,255,255,.8)}
.lado .fundo button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
main{padding:30px 34px 60px;min-width:0}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.topo h1{font-size:1.9rem}
.topo p{color:var(--muted);margin-top:4px}

/* Peças */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:10px;border:1.5px solid transparent;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{opacity:.92}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.laranja{background:var(--orange)}
.btn.verde{background:var(--mint)}
.btn.linha{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.linha:hover{border-color:var(--ink)}
.btn.perigo{background:#fff;color:var(--red);border-color:#F3C3BD}
.btn.peq{min-height:34px;padding:6px 12px;font-size:.88rem}
.cartao{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.cartao h2{font-size:1.1rem;margin-bottom:4px}
.cartao .sub{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.grelha{display:grid;gap:16px}
.grelha>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.kpi strong{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:2rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.88rem}
.lista{list-style:none;display:grid}
.lista li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.lista li:first-child{border-top:0}
.lista .info{flex:1;min-width:0}
.lista .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista .info small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vazio{color:var(--muted);padding:14px 0;font-size:.93rem}
.vazio .btn{margin-top:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--mint-soft);color:var(--mint-dark);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.verde{background:var(--mint-soft);color:var(--mint-dark)}
.tag.laranja{background:var(--orange-soft);color:var(--orange-dark)}
.tag.vermelho{background:var(--red-soft);color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button span{opacity:.65;margin-left:4px}
.campo{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.campo:focus{outline:none;border-color:var(--mint)}
textarea.campo{min-height:120px;resize:vertical}
label.rot{display:block;font-weight:600;font-size:.86rem;margin:14px 0 6px}
.barra-pesq{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.barra-pesq .campo{flex:1;min-width:200px}
.nota{font-size:.84rem;color:var(--muted-2);margin-top:6px}
.pontos{height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:70px;flex-shrink:0}
.pontos i{display:block;height:100%;background:var(--mint)}
.pontos.baixo i{background:var(--orange)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}

/* Estratégia */
.tit-sec{font-size:1.35rem;margin:34px 0 6px}
.intro-sec{color:var(--muted);margin-bottom:14px;max-width:60em}
.var{font-weight:700;font-size:.82rem;color:var(--muted)}
.var.sobe{color:var(--mint-dark)}
.var.desce{color:var(--red)}
.kpi div{margin-top:6px}
.recs{display:grid;gap:12px}
.rec summary{cursor:pointer;display:flex;gap:12px;align-items:center;list-style:none;font-size:1.02rem}
.rec summary::-webkit-details-marker{display:none}
.rec summary::after{content:"+";margin-left:auto;font-size:1.4rem;color:var(--muted);line-height:1}
.rec[open] summary::after{content:"−"}
.rec-corpo{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;max-width:72em}
.rec-corpo h4{font-size:.8rem;color:var(--orange-dark);margin:14px 0 4px;font-family:'Inter',sans-serif;font-weight:700}
.rec-corpo p,.rec-corpo li{color:var(--ink);line-height:1.6}
.rec-corpo ol,.rec-corpo ul{padding-left:20px;display:grid;gap:6px}
.rec-corpo .lead-rec{font-size:1.02rem;color:var(--muted)}
.rec-corpo .pre{white-space:pre-line}
.fontes li{list-style:disc}
.plano{padding-left:18px;display:grid;gap:8px;margin-top:8px;font-size:.92rem}
.barras{width:100%;border-collapse:collapse}
.barras th{overflow-wrap:anywhere;text-align:left;font-weight:600;font-size:.88rem;padding:6px 10px 6px 0;white-space:nowrap;width:1%}
.barras td{padding:6px 0}
.barras .barra{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--mint)}
.barras .v{text-align:right;padding-left:10px;white-space:nowrap;font-weight:700;width:1%}
.barras .v small{font-weight:500;color:var(--muted)}
.colunas{display:flex;gap:4px;align-items:flex-end;height:90px;margin:6px 0 14px}
.colunas .col{min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.colunas .col span{width:100%;max-width:26px;background:var(--mint);border-radius:4px 4px 0 0}
.colunas small{font-size:.66rem;color:var(--muted-2)}
h4.mini{font-size:.85rem;margin-top:8px;font-family:'Inter',sans-serif}
.tabela-wrap{overflow-x:auto}
.tabela{width:100%;border-collapse:collapse;font-size:.9rem}
.tabela th,.tabela td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tabela thead th{font-size:.78rem;color:var(--muted);font-weight:700}

/* Ficha lateral */
#ficha{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(15,31,26,.35)}
#ficha .painel{width:min(520px,100%);height:100%;background:#fff;overflow:auto;padding:24px;box-shadow:-20px 0 50px -30px rgba(0,0,0,.5)}
#ficha .cab{display:flex;gap:14px;align-items:center;margin-bottom:18px}
#ficha .cab .av{width:58px;height:58px;font-size:1.1rem}
#ficha .cab h2{font-size:1.35rem}
#ficha .fechar{margin-left:auto;border:0;background:var(--bg);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.2rem}
.seccao{border-top:1px solid var(--line);padding:16px 0}
.seccao h3{font-size:.95rem;margin-bottom:10px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}

/* Mensagens */
.inbox{display:grid;grid-template-columns:320px 1fr;min-height:520px;padding:0;overflow:hidden}
.inbox .conversas{border-right:1px solid var(--line);overflow:auto;max-height:70vh}
.inbox .conversas button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:#fff;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.inbox .conversas button[aria-current="true"]{background:var(--mint-soft)}
.inbox .conversas .info{flex:1;min-width:0}
.inbox .conversas b{display:block;font-size:.92rem}
.inbox .conversas small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.82rem}
.fio{display:flex;flex-direction:column;min-height:520px}
.fio .msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px;max-height:56vh;background:var(--bg)}
.bolha{max-width:78%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;font-size:.93rem}
.bolha.eu{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.bolha.ele{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bolha small{display:block;opacity:.6;font-size:.72rem;margin-top:3px}
.fio form{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}
.fio form textarea{min-height:46px;max-height:140px}
.progresso{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0}
.progresso i{display:block;height:100%;background:var(--mint);transition:width .3s ease}
.destinos{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin-top:8px}
.destinos label{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
.destinos label:first-child{border-top:0}

/* Aviso rápido */
#aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;max-width:90vw;box-shadow:var(--shadow)}
#aviso.mau{background:var(--red)}

@media (max-width:900px){
  #app{grid-template-columns:1fr}
  .lado{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:40;gap:0}
  .marca,.lado .fundo,.procurar{display:none}
  .nav{display:flex;width:100%;justify-content:space-around}
  .nav a.sec{display:none}
  .nav .mais{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1;min-height:52px;border:0;background:none;color:rgba(255,255,255,.75);font-weight:600;font-size:.66rem;position:relative;cursor:pointer}
  .nav .mais svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
  .nav .mais .conta{position:absolute;top:2px;right:8px}
  .nav a{flex-direction:column;gap:3px;padding:8px 4px;font-size:.66rem;flex:1;text-align:center;min-height:52px;justify-content:center}
  .nav .conta{position:absolute;top:2px;right:8px;margin:0}
  main{padding:20px 16px 96px}
  .g4{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .inbox{grid-template-columns:1fr}
  .inbox .conversas{max-height:none;border-right:0}
  .inbox.a-ler .conversas{display:none}
  .inbox:not(.a-ler) .fio{display:none}
  .topo h1{font-size:1.5rem}
  .barras th{white-space:normal;width:auto;max-width:120px}
  .colunas{gap:2px}
  .colunas small{font-size:.58rem}
  .colunas .col:nth-child(even) small{visibility:hidden}
  .lista .pontos{display:none}
  .lista li{flex-wrap:wrap}
}
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="login-card" id="formLogin">
    <h1>Gestão do Flinko</h1>
    <p>Entra com a tua conta de administrador.</p>
    <label for="lEmail">Email</label>
    <input class="campo" id="lEmail" type="email" autocomplete="email" required/>
    <label for="lPass">Palavra-passe</label>
    <input class="campo" id="lPass" type="password" autocomplete="current-password" required/>
    <button class="btn laranja" type="submit">Entrar</button>
    <div class="erro" id="lErro" role="alert"></div>
  </form>
</section>

<div id="app" class="hidden">
  <aside class="lado">
    <div class="marca">Flink<span>o</span> · Gestão</div>
    <nav class="nav" id="nav" aria-label="Partes do painel"></nav>
    <div class="fundo">
      <div id="quem"></div>
      <a href="/admin.html">Abrir o painel antigo</a><br/>
      <button type="button" id="sair">Sair</button>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<div id="ficha" class="hidden" role="dialog" aria-modal="true" aria-label="Ficha"></div>
<div id="aviso" class="hidden" role="status" aria-live="polite"></div>

<script src="/assets/whatsapp-link.js"></script>
<script src="/assets/gestao-numeros.js"></script>
<script src="/assets/gestao-estrategia.js"></script>
<script src="/assets/gestao.js"></script>
<script src="/assets/gestao-moderacao.js"></script>
<script src="/assets/gestao-pesquisa.js"></script>
</body>
</html>
